<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Personal Board</title>
<!-- drawn by setFavicon() from the palette in force, and redrawn when it changes,
     so the colours are not written down twice -->
<link id="favicon" rel="icon" type="image/svg+xml" />
<style>
  :root {
    --ivory: #FCFBF7;
    --slate: #141413;
    --clay: #D97757;
    --clay-d: #B85C3E;
    /* the same clay a step darker again: --clay-d clears 4.5:1 as ink on white by
       so little that any tint behind it costs it the ratio, and this one is for
       red words that come to rest on a tint rather than on white */
    --clay-dd: #A85033;
    --oat: #E3DACC;
    --olive: #788C5D;
    --gray-50: #F0EEE6;
    --gray-200: #D1CFC5;
    --gray-500: #87867F;
    --gray-600: #63625C;   /* text on a column tint, never under 4.5:1 on any of them */
    --gray-800: #3D3D3A;
    --white: #ffffff;

    /* Each column carries its own --fill and --rule, written onto it by the
       palette picker from the COLUMNS list. Nothing here needs to know how many
       columns there are or what they are called. */
    --col-rule: rgba(20, 20, 19, 0.07);
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--ivory);
    color: var(--slate);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 48px 32px 64px;
  }

  /* ---------- shapes worn in more than one place ----------
     Each of these sets what the shape has in common; the sections below add
     what is particular to one use of it. */

  /* a pill: the toolbar buttons, Add, the yes of a confirmation, Undo */
  button.ghost,
  .composer .save,
  .clear-ask .yes,
  .toast button {
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 12px;
    cursor: pointer;
  }

  /* a word on its own, grey until it is wanted */
  .composer .cancel,
  .clear-ask .no,
  .clearbtn {
    background: transparent;
    border: none;
    color: var(--gray-600);
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 2px;
    cursor: pointer;
  }
  .composer .cancel:hover,
  .clear-ask .no:hover { color: var(--slate); }

  /* a small square holding one character */
  .card-actions button,
  .notes-close {
    --side: 20px;
    width: var(--side);
    height: var(--side);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1;
    color: var(--gray-800);
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 4px;
    cursor: pointer;
  }
  .card-actions button:hover,
  .notes-close:hover { border-color: var(--gray-500); color: var(--slate); }

  /* a box to type into: both composers, and a card opened for editing */
  .composer textarea,
  .card textarea {
    width: 100%;
    resize: vertical;
    background: var(--white);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.35;
    color: var(--slate);
    outline: none;
  }

  /* small print in capitals */
  .palette-panel .cap,
  .pal-back,
  .notes-col {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--gray-600);
  }

  /* the small print on a card's bottom row */
  .date,
  .notemark {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.02em;
  }

  /* ---------- header ---------- */
  header { margin-bottom: 22px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-500);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 6px 0 4px;
  }
  .hintline {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-500);
    margin-top: 10px;
  }
  .hintline::before {
    content: "›";
    color: var(--clay);
    margin-right: 6px;
  }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--ivory);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 0 12px;
    margin-bottom: 14px;
    border-bottom: 1.5px solid var(--gray-200);
  }
  .summary {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gray-800);
    letter-spacing: 0.01em;
  }
  .summary b { color: var(--slate); font-weight: 600; }
  .summary .dot { color: var(--gray-200); margin: 0 4px; }
  .spacer { flex: 1; }
  button.ghost {
    background: transparent;
    color: var(--gray-800);
    border: 1.5px solid var(--gray-200);
    font-size: 12px;
    padding: 9px 16px;
  }
  button.ghost:hover { border-color: var(--gray-500); }
  button.ghost[aria-expanded="true"] { border-color: var(--gray-500); }

  /* ---------- palette picker ---------- */
  .palette-wrap { position: relative; }
  .palette-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 20;
    width: 268px;
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 10px;
    padding: 7px;
    box-shadow: 0 6px 22px rgba(20,20,19,0.10);
    display: none;
    flex-direction: column;
    gap: 1px;
    max-height: 72vh;
    overflow-y: auto;
  }
  .palette-panel.on { display: flex; }
  .palette-panel .cap { padding: 5px 7px 7px; }
  .pal {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    padding: 7px;
    border: 1.5px solid transparent;
    border-radius: 7px;
    background: transparent;
    cursor: pointer;
    text-align: left;
  }
  .pal:hover { background: var(--gray-50); }
  .pal:focus-visible { outline: 2px solid var(--clay); outline-offset: -2px; }
  .pal.on { border-color: var(--clay); }
  .pal-top { display: flex; align-items: baseline; gap: 8px; }
  .pal-name { font-size: 12px; color: var(--slate); }
  .pal-num {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--gray-600);
    font-variant-numeric: tabular-nums;
  }
  .pal-bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .pal-bar {
    height: 24px;
    border-radius: 3px;
    border: 1px solid var(--gray-200);
    border-top: 3px solid var(--r);
    background: var(--t);
  }
  .pal-cols {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--gray-600);
    line-height: 1.35;
  }
  .fam-strip { display: flex; flex-wrap: wrap; gap: 4px; }
  .fam-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--c);
    border: 1px solid rgba(20,20,19,0.12);
  }
  .pal-back {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 5px 7px 8px;
    text-align: left;
  }
  .pal-back:hover { color: var(--slate); }
  .pal-back .arrow { color: var(--clay); font-size: 13px; }

  /* ---------- board ---------- */
  .board {
    display: grid;
    /* waiting · hairline · backlog · now · accomplished */
    grid-template-columns: 1fr 1px repeat(3, 1fr);
    gap: 16px;
    align-items: start;
  }
  /* Waiting for holds what is not yours to move, so it is set off from the three
     doing-columns rather than sitting flush with them. A gap-width hairline,
     faded at both ends, stretched to the tallest column in the row. */
  .col-divider {
    align-self: stretch;
    width: 1px;
    background: linear-gradient(
      to bottom,
      transparent 0,
      var(--gray-200) 14%,
      var(--gray-200) 86%,
      transparent 100%
    );
  }
  /* A column is filled with its own colour and capped with a heavier rule in it,
     and it may also name the colour its cards, their text and its own heading
     wear. All of it is written onto the element as custom properties, so the
     notes window can dress itself as the column its card sits in by taking the
     same set. */
  .col {
    background: var(--fill, var(--ivory));
    border: 1.5px solid var(--gray-200);
    border-top: 3px solid var(--rule, var(--gray-200));
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 200px;
  }
  .col.dragover {
    outline: 2px dashed var(--clay);
    outline-offset: -6px;
    /* layered over the fill so the column keeps its own colour while dragging */
    background-image: linear-gradient(rgba(217, 119, 87, 0.10), rgba(217, 119, 87, 0.10));
  }
  .col-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 14px 14px 10px;
    border-bottom: 1.5px solid var(--col-rule);
  }
  /* the column's name, and the same name again at the head of the notes window */
  .col-head h2,
  .notes-col {
    /* full-strength ink unless the column asks to be spoken more softly */
    color: var(--head, var(--slate));
  }
  .col-head h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 17px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .col-head .count,
  .notes-head .count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-800);
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 999px;
    padding: 1px 8px;
    min-width: 26px;
    text-align: center;
  }
  .col-body {
    padding: 10px 10px 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-height: 60px;
  }
  .empty {
    font-family: var(--mono);
    font-size: 11px;
    /* purely decorative — an empty column already says it is empty */
    color: var(--gray-500);
    text-align: center;
    padding: 18px 6px;
    user-select: none;
  }
  .col-foot {
    border-top: 1.5px solid var(--col-rule);
    padding: 8px 10px 10px;
  }
  .addbtn {
    width: 100%;
    background: transparent;
    border: 1.5px dashed rgba(20, 20, 19, 0.16);
    border-radius: 8px;
    color: var(--gray-600);
    font-family: var(--mono);
    font-size: 11px;
    padding: 8px 10px;
    cursor: pointer;
    text-align: left;
  }
  .addbtn:hover { border-color: var(--clay); color: var(--clay-d); }

  /* ---------- composer ---------- */
  .composer { display: none; }
  .composer.on { display: block; }
  .composer textarea {
    min-height: 58px;
    border: 1.5px solid var(--gray-500);
    border-radius: 8px;
    padding: 9px 10px;
  }
  .composer textarea:focus { border-color: var(--clay); }
  .composer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 7px;
  }
  .composer .save {
    background: var(--slate);
    color: var(--ivory);
    border: 1.5px solid var(--slate);
    padding: 5px 12px;
  }
  .composer .save:hover { background: var(--gray-800); }
  .composer .cancel { padding: 5px 2px; }
  .composer .keyhint {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--gray-600);
  }

  /* ---------- clear column ---------- */
  .clear-row { margin-top: 7px; }
  .clear-row.off { display: none; }
  .clearbtn {
    display: block;
    margin-left: auto;
  }
  .clearbtn:hover { color: var(--clay-d); }
  .clear-ask {
    display: none;
    align-items: center;
    gap: 8px;
  }
  .clear-ask.on { display: flex; }
  .clear-ask .q {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-800);
  }
  /* outlined, not filled: --clay-d reaches 4.5:1 as ink on white, but only
     4.3:1 as a background under ivory text */
  .clear-ask .yes {
    margin-left: auto;
    background: var(--white);
    color: var(--clay-d);
    border: 1.5px solid var(--clay-d);
  }
  /* thickens the ring rather than tinting the fill — any tint behind --clay-d
     drops it back under 4.5:1 */
  .clear-ask .yes:hover { box-shadow: 0 0 0 1.5px var(--clay-d); }

  /* ---------- card ---------- */
  .card {
    /* white unless the column names a colour of its own for its cards */
    background: var(--card, var(--white));
    border: 1.5px solid var(--gray-200);
    border-radius: 8px;
    padding: 10px 11px 8px;
    cursor: grab;
    /* a card separates from the fill behind it by 1.3:1 at the very most, and by
       1.04:1 on Waiting for, so it gets a lift as well as a border */
    box-shadow: 0 1px 2px rgba(20,20,19,0.05);
    transition: border-color 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
  }
  .card:hover { border-color: var(--gray-500); box-shadow: 0 2px 5px rgba(20,20,19,0.09); }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .4; }
  .ctext {
    font-size: 13px;
    line-height: 1.35;
    /* near-black unless the column names a colour of its own for its text */
    color: var(--text, var(--slate));
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 7px;
  }
  .ctext code {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gray-800);
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: 4px;
    padding: 0 3px;
    /* a chip is taller than the run of text it sits in, so hold its own line
       tight to stop it prising the card's lines apart */
    line-height: 1.15;
  }
  /* An address is marked by its underline rather than by a colour of its own, so
     it keeps whatever ink the column set for its text and reads at full strength
     wherever card text goes — a white card, and the notes window's tinted line. */
  .ctext a {
    color: inherit;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
    /* an address is one long word and a column is narrow */
    overflow-wrap: anywhere;
  }
  /* the underline takes the clay and thickens, rather than the words taking it:
     --clay-d is 4.5:1 as ink on a white card but only 3.4:1 on the darkest fill
     a palette makes, and that fill is what the notes window's line sits on. As a
     line rather than a letter it has 3:1 to clear, and clears it on all of them. */
  .ctext a:hover {
    text-decoration-color: var(--clay-d);
    text-decoration-thickness: 2px;
  }
  /* the darker clay, as the underline uses: this ring is the only one on the
     board that can come to rest on a column's fill rather than on white, and
     --clay itself is 2.3:1 on the darkest of those */
  .ctext a:focus-visible {
    outline: 2px solid var(--clay-d);
    outline-offset: 1px;
    border-radius: 2px;
  }
  /* The blocks a card's lines fall into. Every block sits flush with the card and
     a gap only ever falls between two of them, so the first and last lines of a
     card keep the padding the card set and nothing else. */
  .ctext > * { margin: 0; }
  .ctext > * + * { margin-top: 7px; }
  /* a heading stays near the size of the line it heads: a card is 13px in a narrow
     column, and the browser's own h1 would take a third of one */
  .ctext h1, .ctext h2, .ctext h3,
  .ctext h4, .ctext h5, .ctext h6 {
    font-weight: 600;
    font-size: 13px;
    line-height: 1.25;
  }
  .ctext h1 { font-size: 16px; }
  .ctext h2 { font-size: 15px; }
  .ctext h3 { font-size: 14px; }
  .ctext strong { font-weight: 600; }
  /* a quote is marked by the bar at its edge rather than by paler ink: ink pale
     enough to read as quoted drops under 4.5:1 on the fills a palette makes */
  .ctext blockquote {
    border-left: 2px solid var(--gray-500);
    padding-left: 8px;
  }
  .ctext hr {
    border: 0;
    border-top: 1px solid var(--gray-200);
  }
  .ctext ul, .ctext ol { padding-left: 18px; }
  .ctext li::marker { color: var(--gray-600); }
  .card textarea {
    min-height: 52px;
    border: 1.5px solid var(--clay);
    border-radius: 6px;
    padding: 7px 8px;
    margin-bottom: 7px;
  }
  .card-bot {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .date { color: var(--gray-800); }
  /* the one sign a card carries notes while the actions are still hidden */
  .notemark {
    color: var(--gray-600);
    margin-left: 6px;
  }
  .card-actions {
    margin-left: auto;
    display: flex;
    gap: 3px;
    opacity: 0;
    transition: opacity 120ms ease;
  }
  .card:hover .card-actions,
  .card:focus-within .card-actions,
  /* the button has to stay while the list it opened is standing, or it fades out
     from under a pointer that has left the card to reach the list */
  .card.menuopen .card-actions { opacity: 1; }
  @media (hover: none) { .card-actions { opacity: 1; } }

  /* ---------- a card's actions ---------- */
  /* A card is mostly its words, and the line its date sits on is short, so
     everything a card can be told to do is kept behind the one button and opened
     as a list. The list hangs off the page rather than off the card: a column
     hides what overflows it and the notes window scrolls, and either would cut
     the list off. placeMenu() puts it under the button it belongs to. */
  .card-menu {
    position: fixed;
    /* over the notes window, under the undo toast — deleting a note from the
       list has to leave its Undo reachable */
    z-index: 35;
    /* One width for both lists, so a note's two words and a card's four stand as
       the same object, and no wider than the longest of them needs: the words are
       what the panel is for, and air to the right of them is air the panel does
       not need. */
    min-width: 140px;
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    padding: 6px;
    /* a near line to sit the panel off the page and a far one to cast it, so the
       edge reads on a column's fill as well as on the page */
    box-shadow: 0 1px 2px rgba(20,20,19,0.04), 0 8px 24px rgba(20,20,19,0.10);
    display: none;
    flex-direction: column;
    gap: 1px;
  }
  .card-menu.on { display: flex; }
  /* The words in the list are read rather than scanned, so they take the reading
     face — the mono the rest of a card's furniture wears is for dates and marks,
     not for sentences. They are read a step under the card's own words: the list
     stands over the board it belongs to, and nothing on top of a card may speak
     as loudly as the card. A step and no more, or they fall to the size of the
     date line and stop outranking it. Each row stands as tall as something meant
     to be pressed, not as tall as its text. */
  .card-menu button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 5px 10px;
    background: transparent;
    border: none;
    border-radius: 8px;
    color: var(--slate);
    font-family: var(--sans);
    font-size: 12px;
    line-height: 1.15;
    text-align: left;
    cursor: pointer;
  }
  .card-menu button:hover { background: var(--gray-50); }
  .card-menu button:focus-visible { outline: 2px solid var(--clay); outline-offset: -2px; }
  /* The one row that takes something off the board stands apart from the rows
     that only open it, and wears the warning colour at rest rather than waiting
     for a pointer. The line is drawn as a mark above the row and not as a border
     on it, so the hover ground stops short of the line instead of meeting it. */
  .card-menu button.del {
    position: relative;
    margin-top: 6px;
    /* the darker clay, and the same one at rest as under the pointer: this row
       hovers to the --gray-50 ground the other rows do, and --clay-d holds 3.9:1
       on it while this holds 4.9:1. One colour in both states, so the row reads
       as the same warning whether it is pointed at or not. */
    color: var(--clay-dd);
  }
  .card-menu button.del::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: -3px;
    border-top: 1px solid var(--col-rule);
  }
  /* A drawn mark rather than a character, so it keeps to the row's height and not
     the font's, and takes the row's own colour — which makes the mark on the
     delete row as red as the word beside it. Sized off the word it stands beside,
     a shade larger, so it holds its share of the row at whatever size the row is
     read at. */
  .card-menu .glyph {
    display: flex;
    flex: none;
    width: 14px;
    height: 14px;
  }
  .card-menu .glyph svg {
    width: 14px;
    height: 14px;
  }

  /* ---------- notes window ---------- */
  /* A card's notes open in the middle of the page over a scrim. The panel is
     painted with everything the card's column wears, and its body and foot reuse
     the column's own classes, so a note reads as the same card one level in. */
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(20, 20, 19, 0.30);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .scrim.on { display: flex; }
  .notes {
    width: 620px;
    max-width: 100%;
    /* a floor as well as a ceiling: a card with one note should still open a
       panel worth looking at, and .col-body takes up the slack */
    min-height: min(460px, 84vh);
    max-height: 84vh;
    background: var(--fill, var(--ivory));
    border: 1.5px solid var(--gray-200);
    border-top: 3px solid var(--rule, var(--gray-200));
    border-radius: 12px;
    box-shadow: 0 16px 44px rgba(20, 20, 19, 0.22);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .notes .col-body { overflow-y: auto; }
  .notes-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px 14px 11px;
    border-bottom: 1.5px solid var(--col-rule);
  }
  .notes-of { flex: 1; min-width: 0; }
  .notes-col { margin-bottom: 4px; }
  /* the card's own text, read-only here — it is still edited on the board */
  .notes-what {
    font-size: 14px;
    margin-bottom: 0;
  }
  .notes-close {
    flex: none;
    --side: 22px;
    font-size: 13px;
  }

  /* ---------- undo toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(12px);
    background: var(--slate);
    color: var(--ivory);
    border-radius: 999px;
    padding: 9px 10px 9px 18px;
    font-family: var(--mono);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 140ms ease, transform 140ms ease;
    /* above the scrim: deleting a note has to leave its Undo reachable */
    z-index: 40;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button {
    background: transparent;
    color: var(--clay);
    border: 1.5px solid var(--gray-800);
  }
  .toast button:hover { border-color: var(--clay); }

  /* below four-across the columns no longer sit in one row, so the hairline has
     nothing to divide and goes away */
  @media (max-width: 940px) {
    .board { grid-template-columns: repeat(2, 1fr); }
    .col-divider { display: none; }
    .wrap { padding: 32px 20px 56px; }
  }
  @media (max-width: 560px) {
    .board { grid-template-columns: 1fr; }
    .toolbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">personal / board</div>
    <h1>Personal Board</h1>
    <div class="hintline">click “+ add” in a column &nbsp;·&nbsp; drag cards between columns &nbsp;·&nbsp; click a card to edit</div>
  </header>

  <div class="toolbar">
    <div class="summary" id="summary"></div>
    <div class="spacer"></div>
    <span class="palette-wrap">
      <button class="ghost" id="paletteBtn" aria-expanded="false" aria-haspopup="true">Palette</button>
      <div class="palette-panel" id="palettePanel"></div>
    </span>
    <button class="ghost" id="importBtn">Import</button>
    <button class="ghost" id="exportBtn">Export</button>
    <input type="file" id="fileInput" accept="application/json,.json" hidden />
  </div>

  <div class="board" id="board"></div>

</div>

<div class="toast" id="toast">
  <span id="toastMsg"></span>
  <button id="undoBtn">Undo</button>
</div>

<div class="scrim" id="scrim">
  <section class="notes" id="notes" role="dialog" aria-modal="true" aria-labelledby="notesWhat">
    <div class="notes-head">
      <div class="notes-of">
        <div class="notes-col" id="notesCol"></div>
        <div class="notes-what ctext" id="notesWhat"></div>
      </div>
      <span class="count" id="notesCount"></span>
      <button class="notes-close" id="notesClose" type="button" aria-label="Close notes">×</button>
    </div>
    <div class="col-body" id="notesBody"></div>
    <!-- the add button and its box are built by makeComposer(), the same pair a
         column foot gets -->
    <div class="col-foot" id="notesFoot"></div>
  </section>
</div>

<script>
  // ---------- config ----------
  // Everything a column is. A new column is one more entry here and nothing else.
  //   add        what the add button says, where the label will not do
  //   divider    draw the hairline that sets a column apart, after this one
  //   clearable  offer "clear column" in the footer
  //   palette    take a colour from the picker, in the order the columns are listed
  //   fill/rule  the colour to wear when the palette does not dress it
  //   card       the colour its cards wear
  //   text       the colour its card text wears
  //   head       the colour its name is written in
  var COLUMNS = [
    { key: 'waiting', label: 'Waiting for', prompt: 'Who or what are you waiting on?',
      add: 'waiting', divider: true,
      // Waiting for holds what is not yours to move, so it is set apart rather
      // than coloured: the page's own background, with white cards standing on
      // it. What it says is quietened instead of tinted. Grey card text reads at
      // 6.1:1 on that white, and the column's name comes down one shade from
      // full ink, both still well clear of the pale ground they sit on.
      fill: 'var(--ivory)', rule: 'var(--gray-200)', card: 'var(--white)',
      text: 'var(--gray-600)', head: 'var(--gray-800)' },
    { key: 'backlog', label: 'Backlog', prompt: 'What needs doing?', palette: true },
    { key: 'now', label: 'Now', prompt: "What's underway?", palette: true },
    { key: 'accomplished', label: 'Accomplished', prompt: 'What got done?',
      clearable: true, palette: true }
  ];
  var KEYS = COLUMNS.map(function (c) { return c.key; });
  var PAL_COLUMNS = COLUMNS.filter(function (c) { return c.palette; });

  var STORE = 'personal.board.v1';
  var PAL_KEY = 'personal.palette.v1';
  // earlier names for the same two things, newest first; readCarried() moves the
  // first hit over
  var OLD_STORES = ['todo.board.v1', 'backlog.board.v1'];
  var OLD_PAL_KEYS = ['todo.palette.v1', 'backlog.palette.v1'];
  var GONE_KEY = 'cut';                 // the removed fourth column, see load()

  // ---------- small helpers ----------
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function textBtn(cls, label) {
    var b = el('button', cls, label);
    b.type = 'button';
    return b;
  }

  // The marks the list wears beside its words. Drawn as lines on a 24 grid and
  // shown at 16px, so a mark is a mark at any size and never a character the
  // reader's font gets to reinterpret. Every one takes its colour from the row it
  // sits in, so nothing here says what colour it is.
  var MARKS = {
    pencil: 'M17 3a2.83 2.83 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z M15 5l4 4',
    page: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z '
        + 'M14 2v6h6 M9 13h6 M9 17h6',
    send: 'M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8 M16 6l-4-4-4 4 M12 2v13',
    bin: 'M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6 '
       + 'M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2'
  };

  function icon(name) {
    var box = el('span', 'glyph');
    box.setAttribute('aria-hidden', 'true');
    box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
      + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="' + MARKS[name] + '"/></svg>';
    return box;
  }

  function iconBtn(label, title, cls) {
    var b = textBtn(cls, label);
    b.title = title;
    b.setAttribute('aria-label', title);
    return b;
  }

  function pick(list, test) {
    for (var i = 0; i < list.length; i++) {
      if (test(list[i])) return list[i];
    }
    return null;
  }

  function indexOfId(list, id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) return i;
    }
    return -1;
  }

  function plural(n, word) {
    return n + ' ' + word + (n === 1 ? '' : 's');
  }

  function colOf(key) {
    return pick(COLUMNS, function (c) { return c.key === key; });
  }

  function uid() {
    return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function fmtDate(ms) {
    return new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // ---------- storage ----------
  // Storage is not always there to be written to — private browsing, a full
  // quota, a browser with it switched off. None of that is worth an error
  // thrown at the page, so every read and write goes through these three.
  function lsGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  function lsSet(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (e) {
      console.warn('Could not save to localStorage:', e);
    }
  }

  function lsDel(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  // The board and the palette have each been stored under two earlier names, so
  // both are read through here: what `key` holds, or what an earlier name does.
  function readCarried(key, olds) {
    var current = lsGet(key);
    if (current != null) return current;
    // Nothing under the name in use, so fall back through the earlier ones,
    // newest first. Whatever turns up moves over, and every old name is dropped
    // rather than only the one it came from — an older copy left behind would
    // otherwise be waiting to come back the next time the board is emptied.
    var carried = null;
    olds.forEach(function (old) {
      if (carried == null) carried = lsGet(old);
      lsDel(old);
    });
    if (carried != null) lsSet(key, carried);
    return carried;
  }

  // ---------- state ----------
  // state.cols = { waiting: [card], backlog: [...], now: [...], accomplished: [...] }
  // card = { id, text, created, notes: [note] }; a note has the same shape
  var state = load();
  // the one card being dragged: { id, level }. The level says what may receive
  // it — a 'card' lands in a column, a 'note' only in the notes window.
  var drag = null;
  // { col, index, cards } for one card or a whole cleared column, or
  // { noteOf, index, cards } for notes taken off the card with that id
  var lastDeleted = null;
  var toastTimer = null;

  function blank() {
    var cols = {};
    KEYS.forEach(function (k) { cols[k] = []; });
    return { cols: cols };
  }

  function load() {
    var fresh = blank();
    try {
      var raw = readCarried(STORE, OLD_STORES);
      if (!raw) return fresh;
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.cols) return fresh;
      var cols = parsed.cols;
      // the Accomplished column used to be keyed "later" — carry those cards over
      if (Array.isArray(cols.later) && !Array.isArray(cols.accomplished)) {
        cols.accomplished = cols.later;
      }
      KEYS.forEach(function (k) {
        fresh.cols[k] = normalize(cols[k]);
      });
      // the board used to have a fourth "Cut" column. It is gone, but its cards
      // are not thrown away — they land at the end of Backlog to be kept or deleted.
      fresh.cols.backlog = fresh.cols.backlog.concat(normalize(cols[GONE_KEY]));
    } catch (e) { /* corrupt storage — start clean */ }
    return fresh;
  }

  // A note has a card's shape, so the same pass cleans both, however deep a file
  // happens to go. Nothing below the first level of notes is ever shown, but it
  // is not thrown away either.
  function normalize(list) {
    if (!Array.isArray(list)) return [];
    return list.filter(function (c) {
      return c && typeof c.text === 'string';
    }).map(function (c) {
      return {
        id: c.id || uid(),
        text: c.text,
        created: typeof c.created === 'number' ? c.created : Date.now(),
        notes: normalize(c.notes)
      };
    });
  }

  // Cards and notes are made the same way, so neither can be born missing a
  // field the other has.
  function newItem(text) {
    return { id: uid(), text: text, created: Date.now(), notes: [] };
  }

  function save() {
    lsSet(STORE, JSON.stringify(state));
  }

  // every change to the board ends the same way
  function commit() {
    save();
    render();
  }

  function find(id) {
    for (var i = 0; i < KEYS.length; i++) {
      var list = state.cols[KEYS[i]];
      var at = indexOfId(list, id);
      if (at >= 0) return { col: KEYS[i], index: at, card: list[at] };
    }
    return null;
  }

  // ---------- composer ----------
  // A "+ add" button and the box it opens: one in every column foot, one in the
  // notes window. The box stays open after each entry so a run of cards can be
  // typed one after another. spec.onAdd(text) puts the text where it belongs.
  function makeComposer(host, spec) {
    var add = textBtn('addbtn', spec.add);
    var box = el('div', 'composer');
    var ta = el('textarea');
    ta.rows = 2;
    ta.placeholder = spec.placeholder;
    var saveBtn = textBtn('save', 'Add');
    var cancelBtn = textBtn('cancel', 'cancel');
    var row = el('div', 'composer-row');
    row.appendChild(saveBtn);
    row.appendChild(cancelBtn);
    row.appendChild(el('span', 'keyhint', '⏎ add · esc close'));
    box.appendChild(ta);
    box.appendChild(row);
    host.appendChild(add);
    host.appendChild(box);

    function open() {
      closeComposers();
      box.classList.add('on');
      add.style.display = 'none';
      ta.focus();
    }

    function close() {
      box.classList.remove('on');
      add.style.display = '';
      ta.value = '';
    }

    function submit() {
      var text = ta.value.trim();
      if (!text) { close(); return; }
      ta.value = '';
      spec.onAdd(text);
      ta.focus();
    }

    // how closeComposers() reaches an open box through the DOM
    box.close = close;

    add.addEventListener('click', open);
    saveBtn.addEventListener('click', submit);
    cancelBtn.addEventListener('click', close);
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submit();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        // the notes window closes on Escape too, so a box inside it stops the key
        if (spec.inner) e.stopPropagation();
        close();
        add.focus();
      }
    });

    return { open: open, close: close };
  }

  function closeComposers() {
    document.querySelectorAll('.composer.on').forEach(function (box) {
      if (box.close) box.close();
    });
  }

  // ---------- clear a whole column ----------
  // Emptying a column is the one action that can lose a lot at once, so it asks
  // in the footer first — and is still undoable after that.
  function makeClearRow(c) {
    var row = el('div', 'clear-row');
    var open = textBtn('clearbtn', 'clear column');
    open.setAttribute('aria-label', 'Clear the ' + c.label + ' column');

    var ask = el('div', 'clear-ask');
    var question = el('span', 'q');
    var yes = textBtn('yes', 'clear');
    var no = textBtn('no', 'cancel');
    ask.appendChild(question);
    ask.appendChild(yes);
    ask.appendChild(no);

    row.appendChild(open);
    row.appendChild(ask);

    function closeAsk() {
      ask.classList.remove('on');
      open.style.display = '';
    }
    row.closeAsk = closeAsk;

    open.addEventListener('click', function () {
      var n = state.cols[c.key].length;
      if (!n) return;
      var what = plural(n, 'card');
      question.textContent = 'clear ' + what + '?';
      yes.setAttribute('aria-label', 'Yes, clear ' + what + ' from ' + c.label);
      open.style.display = 'none';
      ask.classList.add('on');
      yes.focus();
    });
    no.addEventListener('click', function () {
      closeAsk();
      open.focus();
    });
    yes.addEventListener('click', function () {
      closeAsk();
      clearColumn(c.key);
    });

    return row;
  }

  function closeClearAsks() {
    KEYS.forEach(function (k) {
      if (views[k].clear) views[k].clear.closeAsk();
    });
  }

  // ---------- build the board ----------
  var board = document.getElementById('board');
  var views = {};        // key -> the parts of that column that get redrawn

  COLUMNS.forEach(function (c) {
    var column = el('section', 'col');
    column.dataset.col = c.key;

    var head = el('div', 'col-head');
    head.appendChild(el('h2', null, c.label));
    var count = el('span', 'count');
    head.appendChild(count);

    var body = el('div', 'col-body');
    var foot = el('div', 'col-foot');

    makeComposer(foot, {
      add: '+ add to ' + (c.add || c.label.toLowerCase()),
      placeholder: c.prompt,
      onAdd: function (text) {
        state.cols[c.key].push(newItem(text));
        commit();
      }
    });

    var clear = c.clearable ? makeClearRow(c) : null;
    if (clear) foot.appendChild(clear);

    column.appendChild(head);
    column.appendChild(body);
    column.appendChild(foot);
    board.appendChild(column);

    if (c.divider) {
      var rule = el('div', 'col-divider');
      rule.setAttribute('aria-hidden', 'true');
      board.appendChild(rule);
    }

    wireDrop(column, body, {
      level: 'card',
      onDrop: function (id, at) { moveCard(id, c.key, at); }
    });

    views[c.key] = { el: column, body: body, count: count, clear: clear };
  });

  // ---------- dragging ----------
  function wireDrag(card, id, level) {
    card.addEventListener('dragstart', function (e) {
      // a list is placed where its button was standing, and a card on the move
      // takes its button with it
      closeMenu();
      drag = { id: id, level: level };
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', id);
    });
    card.addEventListener('dragend', function () {
      drag = null;
      card.classList.remove('dragging');
      document.querySelectorAll('.dragover').forEach(function (zone) {
        zone.classList.remove('dragover');
      });
    });
  }

  // what is being dragged, if this level is allowed to receive it
  function dragged(level) {
    return drag && drag.level === level ? drag.id : null;
  }

  // A zone takes cards of one level and lays them where they were dropped. It
  // marks itself while one is over it; only a column has a look for that, so on
  // the notes window the mark is carried and styled by nothing.
  function wireDrop(zone, body, spec) {
    zone.addEventListener('dragover', function (e) {
      if (!dragged(spec.level)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      zone.classList.add('dragover');
    });
    zone.addEventListener('dragleave', function (e) {
      if (!zone.contains(e.relatedTarget)) zone.classList.remove('dragover');
    });
    zone.addEventListener('drop', function (e) {
      e.preventDefault();
      zone.classList.remove('dragover');
      var id = dragged(spec.level);
      if (id) spec.onDrop(id, insertIndex(body, e.clientY));
    });
  }

  // where in the target list should the dragged card land?
  function insertIndex(body, y) {
    var cards = [].slice.call(body.querySelectorAll('.card:not(.dragging)'));
    for (var i = 0; i < cards.length; i++) {
      var box = cards[i].getBoundingClientRect();
      if (y < box.top + box.height / 2) return i;
    }
    return cards.length;
  }

  // ---------- moving and removing ----------
  // Cards and notes sit in plain arrays, so one move and one removal serve the
  // board and the notes window alike.
  function moveItem(from, to, id, at) {
    var i = indexOfId(from, id);
    if (i < 0) return;
    // `at` already excludes the dragged card (insertIndex skips .dragging), so
    // no index adjustment is needed when reordering within one list.
    var item = from.splice(i, 1)[0];
    if (at == null || at > to.length) at = to.length;
    to.splice(at, 0, item);
    commit();
  }

  function moveCard(id, toCol, at) {
    var found = find(id);
    if (found) moveItem(state.cols[found.col], state.cols[toCol], id, at);
  }

  function moveNote(id, at) {
    var list = notesList();
    if (list) moveItem(list, list, id, at);
  }

  // Everything that takes cards out of a list ends here, so one Undo covers a
  // card, a note, and a whole cleared column alike. `rec` says where they were.
  function discard(rec, msg) {
    lastDeleted = rec;
    commit();
    showToast(msg);
  }

  function removeCard(id) {
    var found = find(id);
    if (!found) return;
    state.cols[found.col].splice(found.index, 1);
    discard({ col: found.col, index: found.index, cards: [found.card] }, 'Card deleted');
  }

  function removeNote(id) {
    var list = notesList();
    if (!list) return;
    var i = indexOfId(list, id);
    if (i < 0) return;
    discard({ noteOf: openCardId, index: i, cards: list.splice(i, 1) }, 'Note deleted');
  }

  function clearColumn(key) {
    var taken = state.cols[key];
    if (!taken.length) return;
    state.cols[key] = [];
    discard({ col: key, index: 0, cards: taken }, plural(taken.length, 'card') + ' cleared');
  }

  // ---------- toast ----------
  var toast = document.getElementById('toast');

  function showToast(msg) {
    document.getElementById('toastMsg').textContent = msg;
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove('on');
      lastDeleted = null;
    }, 6000);
  }

  function hideToast() {
    clearTimeout(toastTimer);
    toast.classList.remove('on');
  }

  // where the undone cards go back to: a column, or the notes of one card. That
  // card may itself have been deleted in the meantime, in which case there is
  // nowhere to put them and the toast just goes away.
  function undoList(rec) {
    if (!rec.noteOf) return state.cols[rec.col];
    var found = find(rec.noteOf);
    return found ? found.card.notes : null;
  }

  document.getElementById('undoBtn').addEventListener('click', function () {
    if (!lastDeleted) return;
    var list = undoList(lastDeleted);
    if (list) {
      var at = Math.min(lastDeleted.index, list.length);
      list.splice.apply(list, [at, 0].concat(lastDeleted.cards));
    }
    lastDeleted = null;
    hideToast();
    commit();
  });

  // ---------- a card's actions ----------
  // What a card can be told to do is shown as a list of words, opened by the one
  // button the card carries. There is a single list for the whole board, moved to
  // whichever button asked for it: only one can be open at a time, so only one
  // needs to exist, and hanging it off the page rather than off the card keeps it
  // clear of everything that would otherwise clip or scroll it.
  var menu = el('div', 'card-menu');
  menu.setAttribute('role', 'menu');
  document.body.appendChild(menu);
  var menuOwner = null;      // the button the open list belongs to, if any

  function makeMenuButton(card, actions) {
    var button = iconBtn('≡', 'actions', 'menubtn');
    button.setAttribute('aria-haspopup', 'true');
    button.setAttribute('aria-expanded', 'false');
    button.addEventListener('click', function (e) {
      e.stopPropagation();
      // a second press on the same button puts the list away again
      var mine = menuOwner === button;
      closeMenu();
      if (!mine) openMenu(card, button, actions);
    });
    return button;
  }

  function openMenu(card, button, actions) {
    menu.innerHTML = '';
    actions.forEach(function (a) {
      var row = textBtn(a.cls);
      row.setAttribute('role', 'menuitem');
      // the mark is for the eye to find the row by; the word beside it is the
      // whole of what the row is called, so the mark is hidden from a reader
      row.appendChild(icon(a.icon));
      row.appendChild(document.createTextNode(a.title));
      row.addEventListener('click', function (e) {
        e.stopPropagation();
        closeMenu();
        a.onClick();
      });
      menu.appendChild(row);
    });
    menuOwner = button;
    button.setAttribute('aria-expanded', 'true');
    card.classList.add('menuopen');
    // shown before it is placed: a list with no size to it cannot be aimed
    menu.classList.add('on');
    placeMenu(button);
    menu.firstChild.focus();
  }

  // Says whether it had anything to put away, so Escape can be spent on the list
  // and go no further. Never moves the focus itself — a click on one of the words
  // closes the list on its way to doing what it says, and pulling the focus back
  // to the card would take it off whatever the action opened.
  function closeMenu() {
    if (!menuOwner) return false;
    menuOwner.setAttribute('aria-expanded', 'false');
    var card = menuOwner.closest('.card');
    if (card) card.classList.remove('menuopen');
    menuOwner = null;
    menu.classList.remove('on');
    return true;
  }

  // Hung under the button it belongs to and pulled back onto the page at either
  // edge, or thrown above the button when there is no room left below it.
  function placeMenu(button) {
    var at = button.getBoundingClientRect();
    var box = menu.getBoundingClientRect();
    var left = Math.min(at.right - box.width, window.innerWidth - box.width - 8);
    var top = at.bottom + 6;
    if (top + box.height > window.innerHeight - 8) top = at.top - box.height - 6;
    menu.style.left = Math.round(Math.max(8, left)) + 'px';
    menu.style.top = Math.round(Math.max(8, top)) + 'px';
  }

  menu.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    var rows = [].slice.call(menu.children);
    var at = rows.indexOf(document.activeElement);
    rows[(at + (e.key === 'ArrowDown' ? 1 : rows.length - 1)) % rows.length].focus();
  });

  // The list is placed where the button was when it opened, so anything that
  // moves the button underneath it puts it away rather than leaving it stranded.
  // Capture, since it is the notes window that scrolls and not the page.
  window.addEventListener('scroll', function () { closeMenu(); }, true);
  window.addEventListener('resize', function () { closeMenu(); });

  // ---------- card ----------
  // A board card and a note are the same object wearing the same furniture: text
  // that opens for editing on a click, a date, and the button that opens the rest.
  // `spec` is the little that differs between the two.
  //   level    which drag this card belongs to
  //   redraw   what to run after an edit — the board, or the notes list
  //   mark     an optional word after the date
  //   buttons  what the list offers, in order: { icon, title, cls, onClick },
  //            where icon names a mark in MARKS
  function makeItem(item, spec) {
    var card = el('article', 'card');
    card.draggable = true;
    card.dataset.id = item.id;

    var text = el('div', 'ctext');
    renderText(text, item.text);
    text.addEventListener('click', function (e) {
      // a click on an address follows it rather than opening the card around it
      if (e.target.closest('a')) return;
      editItem(card, text, item, spec.redraw);
    });

    var bot = el('div', 'card-bot');
    bot.appendChild(el('span', 'date', fmtDate(item.created)));
    if (spec.mark) bot.appendChild(el('span', 'notemark', spec.mark));

    // Editing heads the list for every card, not only the ones that need it: a
    // click on the text is the usual way in, but a link takes that click for
    // itself, and a card that is nothing but a link would have nowhere to press.
    var actions = el('div', 'card-actions');
    actions.appendChild(makeMenuButton(card, [
      { icon: 'pencil', title: 'Edit',
        onClick: function () { editItem(card, text, item, spec.redraw); } }
    ].concat(spec.buttons)));
    bot.appendChild(actions);

    card.appendChild(text);
    card.appendChild(bot);
    wireDrag(card, item.id, spec.level);
    return card;
  }

  // Swap the text for a box holding it. Enter and leaving the box keep the
  // change, Escape drops it, and an empty box counts as no change at all.
  function editItem(card, text, item, redraw) {
    // the ✎ action outlives the text it opens, so a second press has nothing
    // left to swap out
    if (text.parentNode !== card) return;
    var ta = el('textarea');
    ta.value = item.text;
    card.draggable = false;
    card.replaceChild(ta, text);
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);

    var done = false;
    function finish(keep) {
      if (done) return;
      done = true;
      card.draggable = true;
      if (keep) {
        var v = ta.value.trim();
        if (v) { item.text = v; save(); }
      }
      redraw();
    }

    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
    ta.addEventListener('blur', function () { finish(true); });
  }

  // Split raw card text into the segments it displays as, in order. A run between
  // two backticks is code; everything else is plain. So 'run `npm test` now' gives
  // [{text: 'run ', code: false}, {text: 'npm test', code: true},
  //  {text: ' now', code: false}]. A code segment's text drops the backticks that
  // marked it.
  // A span has to hold at least one character and stay on one line, so '``' and a
  // stray backtick are left as the characters they are, and a tick opened on one
  // line cannot swallow the ones below it. split keeps the capture, which lands the
  // code runs on the odd indices.
  function codeSpans(s) {
    return s.split(/`([^`\n]+)`/).map(function (part, i) {
      return { text: part, code: i % 2 === 1 };
    }).filter(function (seg) {
      return seg.text !== '';
    });
  }

  // The two shapes an address is written in: a bare one, and [what it is](where),
  // for when the address is far too long to read on a card. Both stop at the first
  // space, and neither may hold the brackets that delimit it. One capture group
  // wrapping the pair, so split lands the addresses on the odd indices, the same
  // way codeSpans does.
  var LINK_RE = /(\[[^\[\]\n]+\]\([^()\s]+\)|https?:\/\/[^\s<>]+|mailto:[^\s<>]+)/i;
  var LABELLED = /^\[([^\[\]\n]+)\]\(([^()\s]+)\)$/;
  // What the board will open. Everything else — a javascript: or a data: among
  // them — is not a link here and stays the characters it was typed as.
  var OPENABLE = /^(https?:\/\/|mailto:)/i;

  function safeHref(url) {
    return OPENABLE.test(url) ? url : null;
  }

  // An address runs to the first space, so the punctuation of the sentence it
  // sits in gets swept up with it. Give back what hangs off the end and reads as
  // prose rather than address — and a closing bracket only when nothing opened it.
  // The brackets are tallied once and the tally walked back down, rather than
  // counted afresh for every character given up: a card holding thousands of them
  // is a paste gone wrong, and it should cost the board no more than a glance.
  function trimTail(url) {
    var opens = 0;
    var closes = 0;
    var end = url.length;
    var i;
    for (i = 0; i < url.length; i++) {
      if (url.charAt(i) === '(') opens++;
      else if (url.charAt(i) === ')') closes++;
    }
    while (end) {
      var last = url.charAt(end - 1);
      if ('.,;:!?\'"'.indexOf(last) >= 0) end--;
      else if (last === ')' && closes > opens) { closes--; end--; }
      else break;
    }
    return url.slice(0, end);
  }

  // Pick the addresses out of a run of plain text. A link segment carries the
  // href to open and the text to show for it, which for a bare address are the
  // same thing.
  function linkSpans(s) {
    var out = [];
    s.split(LINK_RE).forEach(function (part, i) {
      if (!part) return;
      if (i % 2 === 0) { out.push({ text: part, code: false }); return; }
      var m = LABELLED.exec(part);
      var shown = m ? m[1] : trimTail(part);
      var href = safeHref(m ? m[2] : shown);
      // an address this board will not open is not one, and neither is a label
      // with nothing in it to click — both stay as they were written
      if (!href || !shown.trim()) { out.push({ text: part, code: false }); return; }
      out.push({ text: shown, href: href });
      // whatever trimTail handed back follows the link as the prose it is
      if (!m && part.length > shown.length) {
        out.push({ text: part.slice(shown.length), code: false });
      }
    });
    return out;
  }

  // Pick the marked runs out of a run of plain text: **bold**, *italic* and
  // ~~struck through~~. A marked run carries the tag it displays as — 'strong',
  // 'em' or 'del' — and everything else carries none.
  // The rule a code chip goes by holds here too: a run has to have text in it and
  // stay on one line, so '**' and a mark left open are the characters they were
  // typed as, and a mark opened on one line cannot swallow the lines below it.
  // In the order they are read, which is what settles '**bold**' against
  // '*italic*': the pair is taken first, so the single one never sees it. Italic
  // holds no star of its own, so it cannot reach across a bold mark to close.
  // One capture each, so split lands the marked runs on the odd indices.
  var EMPHASIS = [
    { tag: 'strong', re: /\*\*([^\n]+?)\*\*/ },
    { tag: 'em', re: /\*([^*\n]+)\*/ },
    { tag: 'del', re: /~~([^\n]+?)~~/ }
  ];

  function emphasisSpans(s) {
    return markSpans(s, 0);
  }

  // Read the mark at `at` over the text, then hand what is left of it plain to
  // the mark after that one. A run that carries a mark is finished with, so the
  // marks do not nest: the text of a bold run is the characters it holds.
  function markSpans(s, at) {
    if (at === EMPHASIS.length) return s === '' ? [] : [{ text: s, code: false }];
    var mark = EMPHASIS[at];
    var out = [];
    s.split(mark.re).forEach(function (part, i) {
      if (part === '') return;
      if (i % 2 === 1) out.push({ text: part, tag: mark.tag });
      else markSpans(part, at + 1).forEach(function (seg) { out.push(seg); });
    });
    return out;
  }

  // Everything a line of a card's text displays as, in order. Backticks are read
  // first, so an address inside them is code and stays on the card as the address
  // it is, and an address is read before the emphasis marks, so a '*' inside one
  // stays part of the address.
  function inlineSpans(s) {
    var out = [];
    codeSpans(s).forEach(function (seg) {
      if (seg.code) { out.push(seg); return; }
      linkSpans(seg.text).forEach(function (part) {
        if (part.href) { out.push(part); return; }
        emphasisSpans(part.text).forEach(function (bit) { out.push(bit); });
      });
    });
    return out;
  }

  // The marks that take a whole line. Each sits at the head of its line, under
  // three spaces at the most, and what it opens runs to the end of that line.
  var RULE = /^ {0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/;
  var HEADING = /^ {0,3}(#{1,6})\s+(.*)$/;
  var QUOTE = /^ {0,3}>\s?(.*)$/;
  var BULLET = /^ {0,3}[-*+]\s+(.*)$/;
  var NUMBER = /^ {0,3}(\d+)[.)]\s+(.*)$/;

  // Group the lines of a card into the blocks they display as, in order. A line
  // wearing a line mark is the block that mark names; every other line is prose,
  // and a run of prose lines is one paragraph. A blank line closes whatever is
  // open, and a quote or a list takes as many lines in a row as it is given.
  //   {kind: 'para', text}            {kind: 'quote', text}
  //   {kind: 'heading', level, text}  {kind: 'list', ordered, start, items}
  //   {kind: 'rule'}
  // A rule is read before a bullet, so '---' is the line it draws rather than an
  // item with two dashes for its text.
  function blocks(s) {
    var out = [];
    var open = null;    // the block the line above left open, if it left one
    function start(b) { out.push(b); open = b; }
    s.split('\n').forEach(function (line) {
      var m;
      if (RULE.test(line)) { out.push({ kind: 'rule' }); open = null; return; }
      if ((m = HEADING.exec(line))) {
        out.push({ kind: 'heading', level: m[1].length, text: m[2] });
        open = null;
        return;
      }
      if ((m = QUOTE.exec(line))) {
        if (open && open.kind === 'quote') open.text += '\n' + m[1];
        else start({ kind: 'quote', text: m[1] });
        return;
      }
      var bullet = BULLET.exec(line);
      m = bullet || NUMBER.exec(line);
      if (m) {
        // a numbered list under a bulleted one is a list of its own, and the
        // other way about
        var ordered = !bullet;
        if (open && open.kind === 'list' && open.ordered === ordered) {
          open.items.push(ordered ? m[2] : m[1]);
        } else {
          start({ kind: 'list', ordered: ordered, start: ordered ? Number(m[1]) : 1,
            items: [ordered ? m[2] : m[1]] });
        }
        return;
      }
      if (!line.trim()) { open = null; return; }
      if (open && open.kind === 'para') open.text += '\n' + line;
      else start({ kind: 'para', text: line });
    });
    return out;
  }

  function makeCard(card) {
    return makeItem(card, {
      level: 'card',
      redraw: render,
      mark: noteMark(card),
      buttons: [
        { icon: 'page', title: 'Notes',
          onClick: function () { openNotes(card.id); } },
        { icon: 'send', title: 'Export this card',
          onClick: function () { exportCard(card.id); } },
        { icon: 'bin', title: 'Delete', cls: 'del',
          onClick: function () { removeCard(card.id); } }
      ]
    });
  }

  function makeNote(note) {
    return makeItem(note, {
      level: 'note',
      redraw: redrawNotes,
      buttons: [
        { icon: 'bin', title: 'Delete note', cls: 'del',
          onClick: function () { removeNote(note.id); } }
      ]
    });
  }

  // What a board card says about its notes, in the small line after its date.
  // The actions row is hidden until the card is hovered, so this is the only
  // standing sign that a card holds anything. Return '' to say nothing.
  function noteMark(card) {
    return card.notes.length ? '· ' + plural(card.notes.length, 'note') : '';
  }

  // Draw a list of items into a body, or the one line that stands in for an
  // empty one. Columns and the notes window are both filled this way.
  function fillBody(body, items, emptyText, make) {
    body.innerHTML = '';
    if (!items.length) {
      body.appendChild(el('div', 'empty', emptyText));
      return;
    }
    items.forEach(function (item) { body.appendChild(make(item)); });
  }

  // The element a block displays as, holding the marked runs of its own text.
  function makeBlock(b) {
    if (b.kind === 'rule') return document.createElement('hr');
    if (b.kind === 'list') {
      var list = document.createElement(b.ordered ? 'ol' : 'ul');
      // a list that starts at 3 counts from 3
      if (b.ordered && b.start !== 1) list.start = b.start;
      b.items.forEach(function (text) {
        var li = document.createElement('li');
        fillInline(li, text);
        list.appendChild(li);
      });
      return list;
    }
    var box = document.createElement(b.kind === 'heading' ? 'h' + b.level
      : b.kind === 'quote' ? 'blockquote' : 'p');
    fillInline(box, b.text);
    return box;
  }

  // Fill el with the card's text: the blocks its lines fall into, and inside each
  // of them the chips, addresses and marked runs its characters ask for. The
  // stored text keeps every mark it was typed with, so editing a card shows them
  // again. Built from text nodes throughout, so card text never passes through
  // innerHTML.
  function renderText(el, s) {
    el.textContent = '';
    blocks(s).forEach(function (b) { el.appendChild(makeBlock(b)); });
  }

  // One block's worth of text, each code segment as a <code> chip, each address
  // as a link, and each marked run as the tag it named.
  function fillInline(el, s) {
    inlineSpans(s).forEach(function (seg) {
      if (seg.href) {
        var a = document.createElement('a');
        a.href = seg.href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        // what drags is the card, not the address written on it
        a.draggable = false;
        a.textContent = seg.text;
        // a labelled link says nothing about where it goes, so it says it here
        if (seg.text !== seg.href) a.title = seg.href;
        el.appendChild(a);
      } else if (seg.code) {
        var code = document.createElement('code');
        code.textContent = seg.text;
        el.appendChild(code);
      } else if (seg.tag) {
        var mark = document.createElement(seg.tag);
        mark.textContent = seg.text;
        el.appendChild(mark);
      } else {
        el.appendChild(document.createTextNode(seg.text));
      }
    });
  }

  // ---------- notes window ----------
  // A card's notes are cards themselves and live on the card, so a deleted card
  // takes its notes with it and Undo brings back the lot. The window borrows the
  // column's own body and foot, and wears the colour of the column its card is in.
  var scrim = document.getElementById('scrim');
  var notesPanel = document.getElementById('notes');
  var notesBody = document.getElementById('notesBody');
  var notesClose = document.getElementById('notesClose');
  var openCardId = null;    // the card whose notes are showing, if any

  var notesComposer = makeComposer(document.getElementById('notesFoot'), {
    add: '+ add a note',
    placeholder: 'What is worth remembering?',
    inner: true,
    onAdd: function (text) {
      var list = notesList();
      if (!list) return;
      list.push(newItem(text));
      commit();
    }
  });

  function notesList() {
    var found = openCardId ? find(openCardId) : null;
    return found ? found.card.notes : null;
  }

  function openNotes(cardId) {
    closeComposers();
    openCardId = cardId;
    scrim.classList.add('on');
    redrawNotes();
    notesClose.focus();
  }

  function closeNotes() {
    if (!openCardId) return;
    notesComposer.close();
    // the board is redrawn on every change, so hand focus back by id, not by
    // holding on to the button that opened the window — and it goes back to the
    // card's own button, since the one that was pressed was in a list that has
    // since been put away
    var back = document.querySelector('.card[data-id="' + openCardId + '"] .menubtn');
    openCardId = null;
    scrim.classList.remove('on');
    if (back) back.focus();
  }

  function redrawNotes() {
    if (!openCardId) return;
    var found = find(openCardId);
    // the card went away under the window — another tab, or an import
    if (!found) { closeNotes(); return; }

    paint(notesPanel, found.col);
    document.getElementById('notesCol').textContent = colOf(found.col).label;
    renderText(document.getElementById('notesWhat'), found.card.text);
    document.getElementById('notesCount').textContent = found.card.notes.length;
    fillBody(notesBody, found.card.notes, 'no notes yet', makeNote);
  }

  notesClose.addEventListener('click', closeNotes);
  // a click on the panel itself is not a click outside it
  scrim.addEventListener('click', function (e) { if (e.target === scrim) closeNotes(); });
  wireDrop(notesBody, notesBody, { level: 'note', onDrop: moveNote });

  // ---------- render ----------
  function render() {
    // every card is built anew below, and an open list belongs to a button that
    // is about to stop existing
    closeMenu();
    COLUMNS.forEach(function (c) {
      var list = state.cols[c.key];
      var view = views[c.key];
      fillBody(view.body, list, 'nothing here', makeCard);
      view.count.textContent = list.length;
      if (view.clear) {
        // any state change drops a pending confirmation — it was asked about a
        // count that may no longer hold
        view.clear.closeAsk();
        view.clear.classList.toggle('off', !list.length);
      }
    });
    renderSummary();
    // an open notes window is another view of the same state, so it redraws too
    redrawNotes();
  }

  function renderSummary() {
    var out = document.getElementById('summary');
    out.textContent = '';
    COLUMNS.forEach(function (c, i) {
      if (i) out.appendChild(el('span', 'dot', '·'));
      out.appendChild(el('b', null, String(state.cols[c.key].length)));
      // a hard space, so a count never wraps away from the word it counts
      out.appendChild(document.createTextNode('\u00a0' + c.key));
    });
  }

  // ---------- export / import ----------
  // Two shapes leave the board and come back. A whole board is { cols: ... } and
  // replaces what is here. One card is { card: ..., col: ... } and joins what is
  // here, which is how a card is passed to someone else. Import is given a file
  // and tells the two apart by which of the fields it carries.
  function download(name, data) {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name + '-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // A card's notes live on the card, so a card is already whole on its own and
  // goes out as it stands. The column travels with it so it can land in the same
  // one on the other side.
  function exportCard(id) {
    var found = find(id);
    if (!found) return;
    download('personal-board-card', { card: found.card, col: found.col });
  }

  document.getElementById('exportBtn').addEventListener('click', function () {
    download('personal-board', state);
  });

  function importBoard(parsed) {
    var total = 0;
    // an older export may still carry a Cut column; load() folds it into Backlog
    KEYS.concat(GONE_KEY).forEach(function (k) {
      if (Array.isArray(parsed.cols[k])) total += parsed.cols[k].length;
    });
    if (!confirm('Replace the current board with ' + total + ' card(s) from this file?')) return;
    lsSet(STORE, JSON.stringify(parsed));
    state = load();
    commit();
  }

  // A card arrives with the ids it wore on the board it left, and the same file
  // may be imported twice. find() answers by id, so the card and every note
  // under it is given a fresh one on the way in.
  function reid(item) {
    return {
      id: uid(),
      text: item.text,
      created: item.created,
      notes: item.notes.map(reid)
    };
  }

  // One shared card joins the board. Nothing already here is disturbed.
  function importCard(parsed) {
    var arriving = normalize([parsed.card]);
    if (!arriving.length) throw new Error('bad shape');
    var card = reid(arriving[0]);
    // it was exported from a column, but a card made elsewhere may name one this
    // board does not have, or none at all. Anything unplaced belongs in Backlog.
    var col = colOf(parsed.col) || colOf('backlog');
    var brought = card.notes.length ? ' and ' + plural(card.notes.length, 'note') : '';
    var says = card.text.length > 60 ? card.text.slice(0, 60) + '...' : card.text;
    if (!confirm('Add this card' + brought + ' to ' + col.label + '?\n\n' + says)) return;
    // the newest card sits at the bottom of a column, the same as one written here
    state.cols[col.key].push(card);
    commit();
  }

  var fileInput = document.getElementById('fileInput');
  document.getElementById('importBtn').addEventListener('click', function () {
    fileInput.click();
  });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed) throw new Error('bad shape');
        if (parsed.card) importCard(parsed);
        else if (parsed.cols) importBoard(parsed);
        else throw new Error('bad shape');
      } catch (e) {
        alert("That file doesn't look like a personal board export.");
      }
      fileInput.value = '';
    };
    reader.readAsText(f);
  });

  // ---------- palettes ----------
  // Four-colour combinations from Sanzo Wada's Haishoku Sokan (1933) — the source
  // of Seigensha's Color Scheme Dictionary. Numbers are the book's own; hexes come
  // from the mattdesl/dictionary-of-colour-combinations digitisation of its CMYK.
  // The board has three columns, so each entry keeps the first three of the book's
  // four colours — the dropped one is the colour the removed Cut column wore. That
  // cut is safe for the picker: in all 38 combinations the two colours the book
  // names the combination after, and the lead colour its family is grouped by, sit
  // within those first three.
  // Each column takes its colour at 12% over ivory, exactly like the default.
  // The colours go to the columns marked `palette` in COLUMNS, in the order they
  // are listed there. Waiting for takes none of them.
  var TINT = 0.12;
  // the page's own background, read off the stylesheet so the tint arithmetic
  // and the icon do not each keep a copy of it
  var IVORY = getComputedStyle(document.documentElement).getPropertyValue('--ivory').trim();

  var FAMILIES = [
    { id: 'studio', name: 'Studio', note: 'the original three', palettes: [
      { id: 'studio', name: 'Olive & Clay', num: null,

  var PALETTES = [];
  FAMILIES.forEach(function (f) {
    f.palettes.forEach(function (p) { p.family = f; PALETTES.push(p); });
  });

  function rgbOf(hex) {
    var h = hex.replace('#', '');
    return [0, 1, 2].map(function (i) { return parseInt(h.substr(i * 2, 2), 16); });
  }

  // a colour laid over the page at TINT strength — what a column is filled with
  function tintOf(hex) {
    var under = rgbOf(IVORY);
    return '#' + rgbOf(hex).map(function (v, i) {
      var m = Math.round(v * TINT + under[i] * (1 - TINT));
      return ('0' + m.toString(16)).slice(-2);
    }).join('').toUpperCase();
  }

  // the icon is the board itself: one bar per palette column, in the palette's
  // colours. The tints are too pale to survive 16px, so the bars run solid.
  // Waiting for takes no palette colour, so it gets no bar.
  function setFavicon(colors) {
    var link = document.getElementById('favicon');
    if (!link) return;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
      '<rect width="32" height="32" rx="7" fill="' + IVORY + '"/>';
    colors.forEach(function (c, i) {
      svg += '<rect x="' + (4 + i * 9) + '" y="5" width="6" height="22" rx="2" fill="' + c + '"/>';
    });
    link.href = 'data:image/svg+xml,' + encodeURIComponent(svg + '</svg>');
  }

  // What each column is wearing now: its own colour, or the one the palette
  // handed it. Written onto the elements that show it.
  var tone = {};
  COLUMNS.forEach(function (c) { tone[c.key] = { fill: c.fill, rule: c.rule }; });

  function paint(target, key) {
    target.style.setProperty('--fill', tone[key].fill);
    target.style.setProperty('--rule', tone[key].rule);
    // cleared rather than left standing, since the notes window is repainted for
    // whichever column its card came from
    ['card', 'text', 'head'].forEach(function (name) {
      var own = colOf(key)[name];
      if (own) target.style.setProperty('--' + name, own);
      else target.style.removeProperty('--' + name);
    });
  }

  function applyPalette(id) {
    var p = pick(PALETTES, function (x) { return x.id === id; }) || PALETTES[0];
    currentPal = p.id;
    PAL_COLUMNS.forEach(function (c, i) {
      tone[c.key] = { fill: tintOf(p.colors[i]), rule: p.colors[i] };
    });
    KEYS.forEach(function (k) { paint(views[k].el, k); });
    // the notes window is wearing one of these colours too, if it is open
    redrawNotes();
    setFavicon(p.colors);
    lsSet(PAL_KEY, p.id);
  }

  var palPanel = document.getElementById('palettePanel');
  var palBtn = document.getElementById('paletteBtn');
  var palView = null;      // null = the family list, otherwise a family id
  var currentPal = 'studio';

  // One button shape serves both views of the panel: a name with a number to its
  // right, a strip of colour beneath, and a line of small print under that.
  function palButton(spec) {
    var b = textBtn('pal');
    var top = el('span', 'pal-top');
    top.appendChild(el('span', 'pal-name', spec.name));
    top.appendChild(el('span', 'pal-num', spec.num));
    b.appendChild(top);
    b.appendChild(spec.strip);
    b.appendChild(el('span', 'pal-cols', spec.note));
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      spec.onClick();
    });
    return b;
  }

  // one bar per column the palette dresses, tinted as that column will be
  function palBars(p) {
    var bars = el('span', 'pal-bars');
    p.colors.forEach(function (c) {
      var bar = el('span', 'pal-bar');
      bar.style.setProperty('--r', c);
      bar.style.setProperty('--t', tintOf(c));
      bars.appendChild(bar);
    });
    return bars;
  }

  // one dot per palette in the family, each showing that palette's lead colour —
  // the one the family is named for. So the strip previews count and character.
  function famDots(f) {
    var dots = el('span', 'fam-strip');
    f.palettes.forEach(function (p) {
      var dot = el('span', 'fam-dot');
      dot.style.setProperty('--c', p.lead);
      dots.appendChild(dot);
    });
    return dots;
  }

  function renderPanel() {
    palPanel.innerHTML = '';
    if (palView) renderFamily(pick(FAMILIES, function (f) { return f.id === palView; }));
    else renderFamilies();
  }

  function renderFamilies() {
    palPanel.appendChild(el('div', 'cap', 'Sanzo Wada · 38 combinations, trimmed to three'));
    FAMILIES.forEach(function (f) {
      var b = palButton({
        name: f.name,
        num: String(f.palettes.length),
        strip: famDots(f),
        note: f.note,
        onClick: function () { palView = f.id; renderPanel(); }
      });
      b.dataset.fam = f.id;
      if (pick(f.palettes, function (p) { return p.id === currentPal; })) b.classList.add('on');
      palPanel.appendChild(b);
    });
  }

  function renderFamily(f) {
    var back = textBtn('pal-back');
    back.appendChild(el('span', 'arrow', '‹'));
    back.appendChild(document.createTextNode(' all families · ' + f.name));
    back.addEventListener('click', function (e) {
      e.stopPropagation();
      palView = null;
      renderPanel();
    });
    palPanel.appendChild(back);

    f.palettes.forEach(function (p) {
      var b = palButton({
        name: p.name,
        num: p.num ? 'no. ' + p.num : 'default',
        strip: palBars(p),
        note: p.names,
        onClick: function () {
          applyPalette(p.id);
          // stay open so several palettes can be tried in a row — the panel only
          // closes on a click outside or Escape. Move the marker in place rather
          // than re-rendering, which would throw away the scroll position.
          palPanel.querySelectorAll('.pal').forEach(function (other) {
            other.classList.toggle('on', other.dataset.pal === p.id);
          });
        }
      });
      b.dataset.pal = p.id;
      if (p.id === currentPal) b.classList.add('on');
      palPanel.appendChild(b);
    });
  }

  function openPalette() {
    palView = null;
    renderPanel();
    palPanel.classList.add('on');
    palBtn.setAttribute('aria-expanded', 'true');
  }
  function closePalette() {
    palPanel.classList.remove('on');
    palBtn.setAttribute('aria-expanded', 'false');
  }
  palBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (palPanel.classList.contains('on')) closePalette(); else openPalette();
  });
  document.addEventListener('click', function (e) {
    if (!palPanel.contains(e.target) && e.target !== palBtn) closePalette();
    // a press on a card's own button never reaches here, and one on a word in the
    // list puts it away itself on the way to doing what the word says
    if (!menu.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    // a list standing over a card takes the key before the window under it does
    var owner = menuOwner;
    if (closeMenu()) { owner.focus(); return; }
    closePalette();
    closeClearAsks();
    closeNotes();
  });

  // applyPalette writes the choice back under the current key
  applyPalette(readCarried(PAL_KEY, OLD_PAL_KEYS) || 'studio');

  // keep two tabs of the same board in sync
  window.addEventListener('storage', function (e) {
    if (e.key !== STORE) return;
    state = load();
    render();
  });

  render();
