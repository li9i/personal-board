<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Personal Board</title>
<!-- setFavicon() draws this from the current palette, and draws it again when the
     palette changes, so there is one copy of the colours -->
<link id="favicon" rel="icon" type="image/svg+xml" />
<style>
  :root {
    --ivory: #FCFBF7;
    --slate: #141413;
    --clay: #D97757;
    --clay-d: #B85C3E;
    /* A darker clay again. --clay-d reaches 4.5:1 as text on white with very
       little margin, so any tint behind it costs it the ratio. This colour is
       for red words that come to rest on a tint and not on white. */
    --clay-dd: #A85033;
    --oat: #E3DACC;
    --olive: #788C5D;
    --gray-50: #F0EEE6;
    --gray-200: #D1CFC5;
    --gray-500: #87867F;
    --gray-600: #63625C;   /* text on a column tint, never less than 4.5:1 on any tint */
    --gray-800: #3D3D3A;
    --white: #ffffff;
    /* a quarter of the way from white to the page, for cards that sit on the
       page with no column tint under them */
    --ivory-50: #FEFEFD;

    /* Each column has its own --fill and --rule. The palette panel writes them
       onto the column from the COLUMNS list. This file does not need the number
       of the columns or their names. */
    --col-rule: rgba(20, 20, 19, 0.07);
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--ivory);
    color: var(--slate);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 1440px;
    margin: 0 auto;
    padding: 48px 32px 64px;
  }

  /* ---------- shapes used in more than one place ----------
     Each rule below sets what the shape has in common. The sections after this
     one add what is different for one use of it. */

  /* Equal padding above and below a word does not put the word in the middle.
     A font keeps room under the baseline for the tails of p and y, and a word
     with no tail leaves that room empty, so the letters land above the centre
     of the shape. Every button that holds a word therefore takes a little off
     the bottom padding and gives it to the top, which brings the band from the
     top of the letters down to the baseline into the middle. The two numbers
     still add up to what they did, so no button changes height. The amount is
     what the face gives back at that size, measured: half a pixel at 10px and
     11px, a whole one at 12px. */

  /* a pill: Add and cancel, the yes of a confirmation, Undo */
  .composer .save,
  .composer .cancel,
  .clear-ask .yes,
  .toast button {
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    padding: 4.5px 12px 3.5px;
    cursor: pointer;
  }

  /* a word on its own. It is grey until the pointer moves over it */
  .clear-ask .no,
  .clearbtn {
    background: transparent;
    border: none;
    color: var(--gray-600);
    font-family: var(--mono);
    font-size: 11px;
    padding: 4.5px 2px 3.5px;
    cursor: pointer;
  }
  .clear-ask .no:hover { color: var(--slate); }

  /* a small square holding one character */
  .card-actions button,
  .notes-close,
  .tips-close {
    --side: 20px;
    width: var(--side);
    height: var(--side);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1;
    color: var(--gray-800);
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 4px;
    cursor: pointer;
  }
  .card-actions button:hover,
  .notes-close:hover,
  .tips-close:hover { border-color: var(--gray-500); color: var(--slate); }

  /* a box for text: the two composers, and a card that is open for an edit */
  .composer textarea,
  .card textarea {
    width: 100%;
    resize: vertical;
    background: var(--white);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.35;
    color: var(--slate);
    outline: none;
  }

  /* small print in capitals */
  .palette-panel .cap,
  .pal-back,
  .notes-col {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--gray-600);
  }

  /* the small print on a card's bottom row */
  .date,
  .notemark {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.02em;
  }

  /* ---------- header ---------- */
  /* The stack of buttons on the right ends at the bottom of the header and the
     pair below it begins at the top of the toolbar, so the header gives away its
     margin and the two rows sit as close as the rows inside the stack. */
  header { margin-bottom: 0; }
  /* The right of the header holds every button the board has. They stand there,
     against the bottom of the header, so the foot of the stack and the hint line
     make one line across the page. */
  .head-of {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-500);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 6px 0 4px;
  }
  .hintline {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-500);
    margin-top: 10px;
  }
  .hintline::before {
    content: "›";
    color: var(--clay);
    margin-right: 6px;
  }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--ivory);
    /* The counts and the pair that hands a file over share the row, one at each
       end of it, and the middle of the pills sits on the middle of the counts. */
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 0 11px;
    margin-bottom: 14px;
    border-bottom: 1.5px solid var(--gray-200);
  }
  .summary {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gray-800);
    letter-spacing: 0.01em;
  }
  .summary b { color: var(--slate); font-weight: 600; }
  .summary .dot { color: var(--gray-200); margin: 0 4px; }
  /* A dot holds the words of the hint line apart. */
  .toolsep {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-200);
  }
  /* These are the few things the board does that the board itself cannot show.
     Each is a shape you press and not a word in a line. Three rows stand at the
     right of the page, the last of them below the rule with the counts, and they
     hold one width between them so the stack has one straight edge down each
     side. The width is the one the pair at the foot needs: two words of six
     letters, and the padding and border of a pill around each. The two rules
     name the font the ch is measured in, and nothing else uses them. */
  .tools,
  .toolpair {
    font-family: var(--mono);
    font-size: 11px;
    width: calc(12ch + 36px);
  }
  .tools {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }
  .pill {
    width: 100%;
    background: transparent;
    border: 1.5px solid var(--gray-200);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-800);
    padding: 6px 16px 5px;
    text-align: center;
    cursor: pointer;
  }
  .pill:hover,
  .pill[aria-expanded="true"] { border-color: var(--gray-500); }
  /* the ring the browser draws around a focused button is a hard blue box that
     belongs to no other part of the page, so the button shows the focus the way
     it shows the pointer, in its own colours */
  .pill:focus-visible {
    outline: none;
    border-color: var(--clay);
    color: var(--clay-d);
  }
  /* A file going out and a file coming in are one thing, so the two of them
     share the last row of the stack and half its width each. They are held in
     close at the sides, because two words in the room of one leaves no more. */
  .toolpair {
    flex: none;
    display: flex;
    gap: 6px;
  }
  .toolpair .pill {
    flex: 1;
    padding-left: 6px;
    padding-right: 6px;
  }

  /* ---------- palette picker ---------- */
  .palette-wrap { position: relative; }
  .palette-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 20;
    width: 268px;
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 10px;
    padding: 7px;
    box-shadow: 0 6px 22px rgba(20,20,19,0.10);
    display: none;
    flex-direction: column;
    gap: 1px;
    max-height: 72vh;
    overflow-y: auto;
  }
  .palette-panel.on { display: flex; }
  .palette-panel .cap { padding: 5px 7px 7px; }
  .pal {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    padding: 7px;
    border: 1.5px solid transparent;
    border-radius: 7px;
    background: transparent;
    cursor: pointer;
    text-align: left;
  }
  .pal:hover { background: var(--gray-50); }
  .pal:focus-visible { outline: 2px solid var(--clay); outline-offset: -2px; }
  .pal.on { border-color: var(--clay); }
  .pal-top { display: flex; align-items: baseline; gap: 8px; }
  .pal-name { font-size: 12px; color: var(--slate); }
  .pal-num {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--gray-600);
    font-variant-numeric: tabular-nums;
  }
  .pal-bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .pal-bar {
    height: 24px;
    border-radius: 3px;
    border: 1px solid var(--gray-200);
    border-top: 3px solid var(--r);
    background: var(--t);
  }
  .pal-cols {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--gray-600);
    line-height: 1.35;
  }
  .fam-strip { display: flex; flex-wrap: wrap; gap: 4px; }
  .fam-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--c);
    border: 1px solid rgba(20,20,19,0.12);
  }
  .pal-back {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 5px 7px 8px;
    text-align: left;
  }
  .pal-back:hover { color: var(--slate); }
  .pal-back .arrow { color: var(--clay); font-size: 13px; }

  /* ---------- board ---------- */
  .board {
    display: grid;
    /* remember · hairline · backlog · now · accomplished */
    grid-template-columns: 1fr 1px repeat(3, 1fr);
    gap: 16px;
    align-items: start;
  }
  /* Remember holds what you must keep in mind and not what you are working on,
     so a hairline separates it from the other three columns. The hairline is as
     wide as the gap. It fades at each end and is as tall as the tallest column
     in the row. */
  .col-divider {
    align-self: stretch;
    width: 1px;
    background: linear-gradient(
      to bottom,
      transparent 0,
      var(--gray-200) 14%,
      var(--gray-200) 86%,
      transparent 100%
    );
  }
  /* A column has its own fill colour and a thicker rule at the top in the same
     colour. It can also set the colour of its cards, of their text and of its
     own heading. All of these go onto the element as custom properties. The
     notes window reads the same properties, so it can show the colours of the
     column that holds its card. */
  .col {
    background: var(--fill, var(--ivory));
    border: 1.5px solid var(--gray-200);
    border-top: 3px solid var(--rule, var(--gray-200));
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 200px;
  }
  .col.dragover {
    outline: 2px dashed var(--drop, var(--gray-500));
    outline-offset: -6px;
    /* The column keeps its corners by clipping what is inside it, and the drop
       line has to reach past its edge to be seen. Nothing else in the column
       comes near the edge, so the clip is lifted while a card is over it. */
    overflow: visible;
    /* layered over the fill, so the column keeps its own colour during a drag */
    background-image: linear-gradient(rgba(217, 119, 87, 0.10), rgba(217, 119, 87, 0.10));
  }
  .col-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 14px 14px 10px;
    border-bottom: 1.5px solid var(--col-rule);
  }
  /* the column's name, and the same name again at the head of the notes window */
  .col-head h2,
  .notes-col {
    /* the full text colour, unless the column sets a lighter one */
    color: var(--head, var(--slate));
  }
  .col-head h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 17px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  /* The count is a word in a heading, so it would take the line height of the
     heading and land on a half pixel. It sets its own, the same as the burst
     ring, and the pill comes out whole. */
  .col-head .count,
  .notes-head .count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1;
    color: var(--gray-800);
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 999px;
    padding: 4px 8px 3px;
    min-width: 26px;
    text-align: center;
  }
  .col-add {
    padding: 10px 10px 0;
  }
  .col-body {
    padding: 6px 10px 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-height: 60px;
    /* the line that shows where a dragged card will land is placed against this */
    position: relative;
  }
  /* The line fills the space the card would open: between two cards, above the
     first, or below the last. It is out of the flow, so showing it moves nothing
     in the column. */
  .dropline {
    position: absolute;
    /* The card that the pointer carries covers the middle of the line, so the
       ends are what shows during a drag. They reach out of the column and stop
       halfway across the gap to the next one, well clear of it. */
    left: -18px;
    right: -18px;
    height: 1px;
    /* the top that showDropline sets is the middle of the line, not its edge */
    transform: translateY(-50%);
    background: var(--drop, var(--gray-500));
    border-radius: 1px;
    pointer-events: none;
  }
  .empty {
    font-family: var(--mono);
    font-size: 11px;
    /* decoration only. An empty column already shows that it is empty */
    color: var(--gray-500);
    text-align: center;
    padding: 18px 6px;
    user-select: none;
  }
  .col-foot {
    border-top: 1.5px solid var(--col-rule);
    padding: 8px 10px 10px;
  }
  .addbtn {
    width: 100%;
    background: transparent;
    border: 1.5px dashed rgba(20, 20, 19, 0.16);
    border-radius: 8px;
    color: var(--gray-600);
    font-family: var(--mono);
    font-size: 11px;
    padding: 8.5px 10px 7.5px;
    cursor: pointer;
    text-align: center;
  }
  .addbtn:hover { border-color: var(--clay); color: var(--clay-d); }
  /* This button takes the focus back when its box closes, and the ring that the
     browser draws around a focused button is a hard blue box that belongs to no
     other part of the page. So the button shows the focus the way it shows the
     pointer, in its own colours. */
  .addbtn:focus-visible {
    outline: none;
    border-color: var(--clay);
    color: var(--clay-d);
  }

  /* ---------- composer ---------- */
  .composer { display: none; }
  .composer.on { display: block; }
  .composer textarea {
    min-height: 58px;
    border: 1.5px solid var(--gray-500);
    border-radius: 8px;
    padding: 9px 10px;
  }
  .composer textarea:focus { border-color: var(--clay); }
  .composer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 7px;
  }
  /* Add and cancel are one pair, so both take the width of the wider word. The
     button that keeps the card is then never the smaller of the two to hit. */
  .composer-acts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .composer .save,
  .composer .cancel { padding: 5.5px 12px 4.5px; }
  .composer .save {
    background: var(--slate);
    color: var(--ivory);
    border: 1.5px solid var(--slate);
  }
  .composer .save:hover { background: var(--gray-800); }
  /* Cancel takes the shape of Add in a ring, so the two read as one pair. The
     ring is light enough that Add is still the one that leads. */
  .composer .cancel {
    background: transparent;
    color: var(--gray-600);
    border: 1.5px solid var(--gray-200);
  }
  .composer .cancel:hover { border-color: var(--gray-500); color: var(--slate); }
  /* Each button carries its own key, so the hint sits on the thing it works. The
     key is a shade back from the word, so the word is read first. */
  .composer .key {
    margin-left: 6px;
    opacity: 0.6;
  }
  /* Off, a dashed ring holds the burst switch, the same dash as the add button,
     so it is a button and not a word. On, the ring closes and turns clay, so its
     state is plain for as long as the box is open. The tips window shows the
     switch too, so the look is here and the box adds only where it stands.
     In the box it is a button and in the window it is a word in a sentence, and
     the two would take a different line height and come out different heights.
     So the ring sets its own, and the shape is the same in both places. */
  .burst {
    background: transparent;
    border: 1.5px dashed rgba(20, 20, 19, 0.16);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1;
    color: var(--gray-600);
    padding: 4px 8px 3px;
  }
  .burst.on {
    border-style: solid;
    border-color: var(--clay);
    color: var(--clay-d);
  }
  /* The switch stands apart at the far end of the row, away from the two buttons
     that act on what is typed. */
  .composer .burst {
    margin-left: auto;
    cursor: pointer;
  }
  /* the pointer lifts the ring only while the switch is off, because an open ring
     in clay is the switch saying that it is on */
  .composer .burst:not(.on):hover { border-color: var(--gray-500); color: var(--slate); }

  /* ---------- clear column ---------- */
  .clear-row { margin-top: 7px; }
  .clear-row.off { display: none; }
  .clearbtn {
    display: block;
    margin-left: auto;
  }
  .clearbtn:hover { color: var(--clay-d); }
  .clear-ask {
    display: none;
    align-items: center;
    gap: 8px;
  }
  .clear-ask.on { display: flex; }
  .clear-ask .q {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-800);
  }
  /* This button has an outline and no fill. --clay-d reaches 4.5:1 as text on
     white, but only 4.3:1 as a background below ivory text. */
  .clear-ask .yes {
    margin-left: auto;
    background: var(--white);
    color: var(--clay-d);
    border: 1.5px solid var(--clay-d);
  }
  /* The ring gets thicker and the fill stays clear. Any tint behind --clay-d
     takes it back to less than 4.5:1. */
  .clear-ask .yes:hover { box-shadow: 0 0 0 1.5px var(--clay-d); }

  /* ---------- card ---------- */
  .card {
    /* white unless the column names a colour of its own for its cards */
    background: var(--card, var(--white));
    border: 1.5px solid var(--gray-200);
    border-radius: 8px;
    padding: 10px 11px 8px;
    cursor: grab;
    /* The contrast between a card and the fill behind it is 1.3:1 at the most,
       and 1.01:1 on Remember. A shadow helps the border to show the edge. */
    box-shadow: 0 1px 2px rgba(20,20,19,0.05);
    transition: border-color 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
  }
  .card:hover { border-color: var(--gray-500); box-shadow: 0 2px 5px rgba(20,20,19,0.09); }
  .card:active { cursor: grabbing; }
  /* A pinned card takes the accent of its column, the same --rule a column
     already puts along its own top edge. */
  .card.pinned { border-color: var(--rule, var(--gray-200)); }
  .card.dragging { opacity: .4; }
  .ctext {
    font-size: 13px;
    line-height: 1.35;
    /* near-black unless the column names a colour of its own for its text */
    color: var(--text, var(--slate));
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 7px;
  }
  .ctext code {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gray-800);
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: 4px;
    padding: 0 3px;
    /* A chip is taller than the run of text around it. Its own line height
       stays tight, so it does not push the lines of the card apart. */
    line-height: 1.15;
  }
  /* An underline marks an address, and not a colour of its own. So the address
     keeps the text colour that the column set. It stays readable everywhere card
     text goes: a white card, and the tinted line in the notes window. */
  .ctext a {
    color: inherit;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
    /* an address is one long word and a column is narrow */
    overflow-wrap: anywhere;
  }
  /* The underline takes the clay colour and gets thicker, and the words keep
     their own colour. --clay-d is 4.5:1 as text on a white card, but only 3.4:1
     on the darkest fill that a palette makes. The line in the notes window sits
     on that fill. A line needs only 3:1, and it reaches that on every fill. */
  .ctext a:hover {
    text-decoration-color: var(--clay-d);
    text-decoration-thickness: 2px;
  }
  /* The darker clay, the same colour as the underline. This is the only ring on
     the board that can come to rest on the fill of a column and not on white.
     --clay is only 2.3:1 on the darkest of those fills. */
  .ctext a:focus-visible {
    outline: 2px solid var(--clay-d);
    outline-offset: 1px;
    border-radius: 2px;
  }
  /* The blocks that hold the lines of a card. Every block is flush with the
     card, and a gap comes only between two blocks. So the first and last lines
     of a card keep the padding that the card set, and nothing more. */
  .ctext > * { margin: 0; }
  .ctext > * + * { margin-top: 7px; }
  /* A heading stays near the size of the line below it. A card is 13px in a
     narrow column, and the h1 of the browser would fill a third of a card. */
  .ctext h1, .ctext h2, .ctext h3,
  .ctext h4, .ctext h5, .ctext h6 {
    font-weight: 600;
    font-size: 13px;
    line-height: 1.25;
  }
  .ctext h1 { font-size: 16px; }
  .ctext h2 { font-size: 15px; }
  .ctext h3 { font-size: 14px; }
  .ctext strong { font-weight: 600; }
  /* The bar at the edge marks a quote, and not a lighter text colour. Text that
     is light enough to read as a quote gives less than 4.5:1 on a palette fill */
  .ctext blockquote {
    border-left: 2px solid var(--gray-500);
    padding-left: 8px;
  }
  /* A callout is a quote that opens with a noun. The bar at its edge and its
     head take the colour of the noun, and everything below the head is card
     text and keeps the colour of the card. */
  .ctext .callout {
    border-left: 3px solid var(--c);
    padding-left: 9px;
  }
  .ctext .callout-head {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--c);
    font-weight: 600;
    line-height: 1.3;
  }
  .ctext .callout-head .glyph { display: flex; flex: none; }
  .ctext .callout-head svg { width: 14px; height: 14px; }
  /* The blocks of the body carry the gaps of a card, one step tighter. The rule
     that spaces a card reaches only the blocks directly inside it, so the body
     sets its own. */
  .ctext .callout-body { margin-top: 4px; }
  .ctext .callout-body > * { margin: 0; }
  .ctext .callout-body > * + * { margin-top: 5px; }
  /* The colour of each noun. Every one of them is at least 4.5:1 on a white card
     and on the darkest fill that a palette makes, which is where card text comes
     to rest in the head of the notes window. */
  .ctext .callout.note,
  .ctext .callout.info,
  .ctext .callout.todo { --c: #466683; }
  .ctext .callout.abstract { --c: #2C6D68; }
  .ctext .callout.success,
  .ctext .callout.tip { --c: #4C6B3A; }
  .ctext .callout.question,
  .ctext .callout.warning { --c: #7F5D14; }
  .ctext .callout.failure,
  .ctext .callout.danger,
  .ctext .callout.bug { --c: #A6433B; }
  .ctext .callout.example { --c: #6B5487; }
  .ctext .callout.quote { --c: var(--gray-600); }
  .ctext hr {
    border: 0;
    border-top: 1px solid var(--gray-200);
  }
  .ctext ul, .ctext ol { padding-left: 18px; }
  .ctext li::marker { color: var(--gray-600); }
  /* An item that opens with a box drops the marker that the list gives it. The
     box keeps its size while the words beside it wrap, and it rests on the first
     of those lines. */
  .ctext li.task {
    list-style: none;
    display: flex;
    align-items: flex-start;
  }
  /* The box stands where the marker of the item would be, so a box and a bullet
     in one list are in the same place and the words after them line up. The list
     indents by 18px and the box is 14px wide, which leaves 4px to the words. */
  .ctext li.task .tickbox {
    margin-left: -18px;
    margin-right: 4px;
  }
  /* the words of the item are one box beside the box of the task, so a long
     address in them shortens the words and does not widen the card */
  .task-what { min-width: 0; }
  /* The box of one task: the small square of the card actions, made as tall as a
     line of card text. It takes the colour behind it while it is open, so it
     reads on a white card and on the tint of the notes window. A box that is
     done fills with the clay and holds the tick. */
  .tickbox {
    flex: none;
    width: 14px;
    height: 14px;
    /* the line is 13px at 1.35, so this rests the box on the middle of it */
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    color: var(--white);
    background: none;
    border: 1.5px solid var(--gray-500);
    border-radius: 4px;
    cursor: pointer;
  }
  .tickbox:hover { border-color: var(--slate); }
  .tickbox[aria-checked="true"] {
    background: var(--clay-d);
    border-color: var(--clay-d);
  }
  /* the same ring as an address on a card, and for the same reason: the box can
     come to rest on the fill of a column and not on white */
  .tickbox:focus-visible {
    outline: 2px solid var(--clay-d);
    outline-offset: 1px;
  }
  .tickbox .glyph { display: flex; }
  /* The mark is small, so it needs a thicker line than the menu gives it. A
     stroke set here wins over the one on the element. */
  .tickbox svg {
    width: 11px;
    height: 11px;
    stroke-width: 3.5;
  }
  /* A fenced block is the box of a chip, made large enough for whole lines. It
     takes the same text colour, fill and border as a chip. Only the shape
     changes. */
  .ctext pre {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gray-800);
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: 4px;
    padding: 6px 7px;
    line-height: 1.35;
    /* A code line is as long as you typed it, a column is narrow, and a browser
       keeps the lines of a <pre> unbroken. So a long line wraps, the same as the
       prose around it. You read a card at a glance, and a line that hides past
       the right edge is a line you lose. A scroll bar would keep the shape of
       the code, but it puts a sideways drag inside a card that also drags. */
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  /* the <code> inside a block takes the box of the block and not of a chip */
  .ctext pre code {
    font-size: inherit;
    line-height: inherit;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
  }
  .card textarea {
    min-height: 52px;
    border: 1.5px solid var(--clay);
    border-radius: 6px;
    padding: 7px 8px;
    margin-bottom: 7px;
  }
  .card-bot {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  /* The sign that a card is pinned. A pinned card holds the top of its column
     and nothing below it can pass, so the mark stays while the pointer is away.
     It is drawn and not a character, the same as the marks in the menu.
     The row puts the mark in the middle of its own height, and the letters of
     the date do not fill that height, so the mark takes a little room under it
     and rises to the middle of the word instead. */
  .card-bot > .glyph {
    display: flex;
    flex: none;
    width: 11px;
    height: 11px;
    margin-bottom: 1px;
    color: var(--gray-600);
  }
  .card-bot > .glyph svg {
    width: 11px;
    height: 11px;
  }
  .date { color: var(--gray-800); }
  /* The sign that a card has notes, and the way to open them. */
  .notemark {
    color: var(--gray-600);
    margin-left: 6px;
    cursor: pointer;
  }
  /* The dot only holds the words apart from the date. It is not one of them, so
     the underline starts after it. */
  .notemark:hover { color: var(--slate); }
  .notemark:hover .words {
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }
  /* A card with no notes has no count to show, so it offers to add the first
     note in the same place. It comes with the actions, while the pointer is on
     the card. A board of empty cards must not show the same line on each of
     them. */
  .notemark.add {
    opacity: 0;
    transition: opacity 120ms ease;
  }
  .card:hover .notemark.add,
  .card:focus-within .notemark.add { opacity: 1; }
  @media (hover: none) { .notemark.add { opacity: 1; } }
  .card-actions {
    margin-left: auto;
    display: flex;
    gap: 3px;
    opacity: 0;
    transition: opacity 120ms ease;
  }
  .card:hover .card-actions,
  .card:focus-within .card-actions,
  /* The button must stay while its menu is open. If not, it fades away below a
     pointer that left the card to reach the menu. */
  .card.menuopen .card-actions { opacity: 1; }
  @media (hover: none) { .card-actions { opacity: 1; } }

  /* ---------- a card's actions ---------- */
  /* A card is mostly its words, and the row that holds its date is short. So one
     button holds every action for the card, and opens them as a menu. The menu
     attaches to the page and not to the card. A column hides what overflows it
     and the notes window scrolls, and each of these would hide part of the menu.
     placeMenu() puts the menu below the button that owns it. */
  .card-menu {
    position: fixed;
    /* above the notes window and below the undo toast. A note deleted from the
       menu must leave its Undo within reach */
    z-index: 35;
    /* One width for the two menus, so the rows of a note and the rows of a card
       show as the same object. The width is no more than the longest of them
       needs, which is the three words of Export this card. The words are the
       purpose of the panel, and space to the right of them is space the panel
       does not need. */
    min-width: 140px;
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    padding: 6px;
    /* a near shadow to lift the panel off the page, and a far one to cast it.
       So the edge shows on the fill of a column and on the page */
    box-shadow: 0 1px 2px rgba(20,20,19,0.04), 0 8px 24px rgba(20,20,19,0.10);
    display: none;
    flex-direction: column;
    gap: 1px;
  }
  .card-menu.on { display: flex; }
  /* You read the words in the menu, so they take the reading face. The mono face
     on the rest of a card is for dates and marks, and not for sentences. The
     words are one step smaller than the words of the card. The menu stands over
     the board, and nothing above a card may draw more attention than the card.
     One step and no more, or they fall to the size of the date row and
     lose their rank over it. Each row is as tall as a control that you press,
     and not as tall as its text. */
  .card-menu button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 5.5px 10px 4.5px;
    background: transparent;
    border: none;
    border-radius: 8px;
    color: var(--slate);
    font-family: var(--sans);
    font-size: 12px;
    line-height: 1.15;
    text-align: left;
    cursor: pointer;
  }
  .card-menu button:hover { background: var(--gray-50); }
  .card-menu button:focus-visible { outline: 2px solid var(--clay); outline-offset: -2px; }
  /* The one row that removes something from the board stands apart from the rows
     that only open it. It shows the warning colour at rest, and does not wait for
     a pointer. The line above the row is a separate mark and not a border on the
     row. So the hover background stops before the line and does not meet it. */
  .card-menu button.del {
    position: relative;
    margin-top: 6px;
    /* The darker clay, and the same colour at rest and below the pointer. This
       row hovers to the same --gray-50 background as the other rows. --clay-d
       holds 3.9:1 on it, and this colour holds 4.9:1. One colour in the two
       states, so the row shows the same warning at all times. */
    color: var(--clay-dd);
  }
  .card-menu button.del::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: -3px;
    border-top: 1px solid var(--col-rule);
  }
  /* The menu of a note offers the one row. A line above it would separate it from
     nothing, and the space above it would be space the panel does not need. */
  .card-menu button.del:first-child { margin-top: 0; }
  .card-menu button.del:first-child::before { content: none; }
  /* A drawn mark and not a character, so it keeps the height of the row and not
     the height of the font. It takes the colour of the row, which makes the mark
     on the delete row as red as the word next to it. Its size comes from that
     word and is a little larger. So it keeps its share of the row at every size
     the row is read at. */
  .card-menu .glyph {
    display: flex;
    flex: none;
    width: 14px;
    height: 14px;
    /* the same lift as the mark on a card, and for the same reason */
    margin-bottom: 1px;
  }
  .card-menu .glyph svg {
    width: 14px;
    height: 14px;
  }

  /* ---------- notes window ---------- */
  /* The notes of a card open in the middle of the page, over a scrim. The panel
     takes every colour of the column that holds the card. Its body and foot use
     the classes of the column, so a note shows as the same card one level down. */
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(20, 20, 19, 0.30);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .scrim.on { display: flex; }
  .notes {
    width: 620px;
    max-width: 100%;
    /* a minimum as well as a maximum. A card with one note must still open a
       panel of a useful size, and .col-body fills the extra space */
    min-height: min(460px, 84vh);
    max-height: 84vh;
    background: var(--fill, var(--ivory));
    border: 1.5px solid var(--gray-200);
    border-top: 3px solid var(--rule, var(--gray-200));
    border-radius: 12px;
    box-shadow: 0 16px 44px rgba(20, 20, 19, 0.22);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .notes .col-body { overflow-y: auto; }
  /* The list of notes scrolls, so it clips what reaches past its edge and would
     scroll sideways to follow it. The line stops at the edge here. */
  .notes .dropline { left: 0; right: 0; }
  /* the head of the notes window, and the head of the tips window with it */
  .notes-head,
  .tips-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px 14px 11px;
    border-bottom: 1.5px solid var(--col-rule);
  }
  .notes-of { flex: 1; min-width: 0; }
  .notes-col { margin-bottom: 4px; }
  /* the text of the card. It is read-only here, and you edit it on the board */
  .notes-what {
    font-size: 14px;
    margin-bottom: 0;
  }
  .notes-close,
  .tips-close {
    flex: none;
    --side: 22px;
    font-size: 13px;
  }

  /* ---------- tips window ---------- */
  /* Tips belong to the board and not to one column, so no palette reaches this
     window. It rests on the page background, with the oat along its top edge
     where a column would show its own rule. */
  .tips {
    width: 560px;
    max-width: 100%;
    max-height: 84vh;
    background: var(--ivory);
    border: 1.5px solid var(--gray-200);
    border-top: 3px solid var(--oat);
    border-radius: 12px;
    box-shadow: 0 16px 44px rgba(20, 20, 19, 0.22);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tips-title {
    flex: 1;
    min-width: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: 17px;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .tips-body {
    padding: 12px 14px 14px;
    overflow-y: auto;
  }
  /* What opens a section is how to write the thing it describes, so it is the
     characters you would type, over the lines you would type them on, in the
     shape of a code chip. */
  .tips-syntax {
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--gray-800);
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: 4px;
    padding: 6px 8px;
    overflow-x: auto;
    white-space: pre;
  }
  .tips-syntax b { color: var(--clay-dd); font-weight: 600; }
  /* The break between two sections is the rule that a card draws for '---', held
     short and in the middle, in the oat of the top edge of the window. So it
     parts the sections without cutting the window in two, and a heading reads as
     the start of something and not as one more line. */
  .tips-body .tips-rule {
    width: 56px;
    margin: 16px auto;
    border-top-color: var(--oat);
  }
  /* The switch as the add box shows it, next to what that state leaves behind. It
     is the same ring here, so a reader knows what to look for in the box. */
  .tips-burst {
    display: flex;
    align-items: baseline;
    gap: 9px;
  }
  .tips-burst .burst { flex: none; }
  /* A group of nouns is a callout with no text of its own, so it takes the bar
     and the colour that a card gives those nouns. The nouns that share a colour
     stand on the one bar, so the bars are the number of colours and not the
     number of nouns. */
  .tips-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 14px;
    color: var(--c);
    font-weight: 600;
  }
  /* a group stands further from the group below it than its own two lines stand
     from each other, so the pairs read as pairs */
  .tips-body .callout + .callout { margin-top: 11px; }
  .tips-noun { display: flex; align-items: center; gap: 5px; }
  .tips-noun svg { width: 14px; height: 14px; }
  .tips-hex {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 400;
    color: var(--gray-500);
  }
  /* the other ways to write the nouns above, in the order the nouns stand in */
  .tips-alias {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--gray-600);
    margin-top: 3px;
  }

  /* ---------- undo toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(12px);
    background: var(--slate);
    color: var(--ivory);
    border-radius: 999px;
    padding: 9px 10px 9px 18px;
    font-family: var(--mono);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 140ms ease, transform 140ms ease;
    /* above the scrim. A note deleted here must leave its Undo within reach */
    z-index: 40;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button {
    background: transparent;
    color: var(--clay);
    border: 1.5px solid var(--gray-800);
  }
  .toast button:hover { border-color: var(--clay); }

  /* ---------- build mark ----------
     The commit this copy of the page came from. It sits under the board, quiet
     enough to pass over and dark enough to read when looked for. */
  .build {
    margin-top: 32px;
    text-align: right;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
  }
  .build a {
    color: var(--gray-500);
    text-decoration: none;
  }
  .build a:hover { text-decoration: underline; }
  .build a:focus-visible {
    outline: 2px solid var(--gray-500);
    outline-offset: 2px;
    border-radius: 2px;
  }

  /* With fewer than four columns across, the columns do not sit in one row. The
     hairline has nothing to separate, so it is hidden. */
  @media (max-width: 940px) {
    .board { grid-template-columns: repeat(2, 1fr); }
    .col-divider { display: none; }
    .wrap { padding: 32px 20px 56px; }
  }
  @media (max-width: 560px) {
    .board { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="head-of">
      <div>
        <div class="eyebrow">personal / board</div>
        <h1>Personal Board</h1>
        <div class="hintline">drag cards between columns <span class="toolsep">·</span> double-click a card to edit <span class="toolsep">·</span> hover for more options</div>
      </div>
      <div class="tools">
        <button class="pill" id="tipsBtn" type="button" aria-haspopup="dialog">tips</button>
        <span class="palette-wrap">
          <button class="pill" id="paletteBtn" aria-expanded="false" aria-haspopup="true">palette</button>
          <div class="palette-panel" id="palettePanel"></div>
        </span>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="summary" id="summary"></div>
    <div class="toolpair">
      <button class="pill" id="importBtn" type="button">import</button>
      <button class="pill" id="exportBtn" type="button">export</button>
    </div>
    <input type="file" id="fileInput" accept="application/json,.json" hidden />
  </div>

  <div class="board" id="board"></div>

  <!-- The commit this copy of the page came from. The post-commit hook rewrites
       the line below every time a commit is made, so the file on disk names the
       commit that holds its content and the copy in the repository names the
       one before it. The hook replaces the whole line, so keep it on one line. -->
  <footer class="build"><a href="https://github.com/li9i/personal-board/commit/bc014cac3c846dc4caefca48c4b2ef390014d4d1" target="_blank" rel="noreferrer">bc014ca</a></footer>

</div>

<div class="toast" id="toast">
  <span id="toastMsg"></span>
  <button id="undoBtn">Undo</button>
</div>

<div class="scrim" id="scrim">
  <section class="notes" id="notes" role="dialog" aria-modal="true" aria-labelledby="notesWhat">
    <div class="notes-head">
      <div class="notes-of">
        <div class="notes-col" id="notesCol"></div>
        <div class="notes-what ctext" id="notesWhat"></div>
      </div>
      <span class="count" id="notesCount"></span>
      <button class="notes-close" id="notesClose" type="button" aria-label="Close notes">×</button>
    </div>
    <div class="col-body" id="notesBody"></div>
    <!-- makeComposer() builds the add button and its box, the same pair that a
         column's col-add gets -->
    <div class="col-foot" id="notesFoot"></div>
  </section>
</div>

<div class="scrim" id="tipsScrim">
  <section class="tips" id="tips" role="dialog" aria-modal="true" aria-labelledby="tipsTitle">
    <div class="tips-head">
      <h2 class="tips-title" id="tipsTitle">Tips</h2>
      <button class="tips-close" id="tipsClose" type="button" aria-label="Close tips">×</button>
    </div>
    <!-- buildTips() fills this. It is card text, so the callouts in it take the
         colours that a card gives them -->
    <div class="tips-body ctext" id="tipsBody"></div>
  </section>
</div>

<script>
  // ---------- config ----------
  // Everything a column is. A new column is one more entry here and nothing else.
  //   divider    draw the hairline after this column
  //   clearable  offer "clear column" in the footer
  //   palette    take a colour from the panel, in the order the columns are listed
  //   fill/rule  the colour to use when no palette sets one
  //   drop       the colour of its drop marks, when no palette sets one
  //   card       the colour of its cards
  //   text       the colour of the text on its cards
  //   head       the colour of its name
  var COLUMNS = [
    { key: 'remember', label: 'Remember', prompt: 'What must you not forget?',
      divider: true,
      // Remember holds what you must keep in mind: a card that someone else has
      // to move, and a note to yourself that is not work at all. It is set apart
      // and not coloured: the background of the page, with cards a short step
      // above it. Its text is lighter in place of a tint. Grey card text gives
      // 6.0:1 on that card, and the name of the column is one shade lighter than
      // the full text colour. The two are still well above the pale background.
      // This column carries no colour of its own, so it marks a drop in the grey
      // that its rule would be if it were darker.
      fill: 'var(--ivory)', rule: 'var(--gray-200)', drop: 'var(--gray-500)',
      card: 'var(--ivory-50)', text: 'var(--gray-600)', head: 'var(--gray-800)' },
    { key: 'backlog', label: 'Backlog', prompt: 'What needs doing?', palette: true },
    { key: 'now', label: 'Now', prompt: "What's underway?", palette: true },
    { key: 'accomplished', label: 'Accomplished', prompt: 'What got done?',
      clearable: true, palette: true }
  ];
  var KEYS = COLUMNS.map(function (c) { return c.key; });
  var PAL_COLUMNS = COLUMNS.filter(function (c) { return c.palette; });

  var STORE = 'personal.board.v1';
  var PAL_KEY = 'personal.palette.v1';
  // whether Backlog and Now hold each other's colour. Its own key, so a board
  // written before turning existed still opens
  var TURN_KEY = 'personal.palturn.v1';
  // whether an add box stays open after each entry, see makeComposer()
  var BURST_KEY = 'personal.burst.v1';
  // earlier names for the same two things, newest first. readCarried() moves
  // the first one it finds
  var OLD_STORES = ['todo.board.v1', 'backlog.board.v1'];
  var OLD_PAL_KEYS = ['todo.palette.v1', 'backlog.palette.v1'];
  var GONE_KEY = 'cut';                 // the removed fourth column, see load()

  // ---------- small helpers ----------
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function textBtn(cls, label) {
    var b = el('button', cls, label);
    b.type = 'button';
    return b;
  }

  // The marks that the menu shows next to its words, and the one that each
  // callout draws. Each one is a set of lines on a 24 grid, shown at 16px in the
  // menu and at 14px in a card, so a mark is the same mark at every size and is
  // never a character that the font of the reader can change. Each mark takes
  // the colour of the row it sits in, so nothing here sets a colour.
  var MARKS = {
    send: 'M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8 M16 6l-4-4-4 4 M12 2v13',
    bin: 'M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6 '
       + 'M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2',
    pin: 'M12 17v5 M9 4.5V10a3 3 0 0 1-1.66 2.68l-1.68.84A2 2 0 0 0 4.5 15.3V17h15v-1.7'
       + 'a2 2 0 0 0-1.16-1.82l-1.68-.84A3 3 0 0 1 15 10V4.5 M8 2h8',
    tick: 'M20 6L9 17l-5-5',
    note: 'M12 20h9 M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z',
    abstract: 'M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2 '
       + 'M9 2h6a1 1 0 0 1 1 1v2H8V3a1 1 0 0 1 1-1Z M8 12h8 M8 16h5',
    info: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M12 16v-5 M12 8h.01',
    todo: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M8 12l3 3 5-6',
    tip: 'M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 '
       + '2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5Z',
    success: 'M20 6 9 17l-5-5',
    question: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M9.1 9.5a3 3 0 0 1 5.8 1c0 2-3 3-3 3 '
       + 'M12 17h.01',
    warning: 'M10.3 3.6 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z '
       + 'M12 9v4 M12 17h.01',
    failure: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M15 9l-6 6 M9 9l6 6',
    danger: 'M13 2 3 14h9l-1 8 10-12h-9l1-8Z',
    bug: 'M12 20a6 6 0 0 0 6-6v-3a6 6 0 0 0-12 0v3a6 6 0 0 0 6 6Z M8.5 3 10 4.6 '
       + 'M15.5 3 14 4.6 M3 9h3 M18 9h3 M3 15.5h3 M18 15.5h3 M12 8v12',
    example: 'M8 6h13 M8 12h13 M8 18h13 M3.5 6h.01 M3.5 12h.01 M3.5 18h.01',
    quote: 'M6 17h3l2-4V7H5v6h3Z M14 17h3l2-4V7h-6v6h3Z'
  };

  function icon(name) {
    var box = el('span', 'glyph');
    box.setAttribute('aria-hidden', 'true');
    box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
      + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="' + MARKS[name] + '"/></svg>';
    return box;
  }

  function iconBtn(label, title, cls) {
    var b = textBtn(cls, label);
    b.title = title;
    b.setAttribute('aria-label', title);
    return b;
  }

  function pick(list, test) {
    for (var i = 0; i < list.length; i++) {
      if (test(list[i])) return list[i];
    }
    return null;
  }

  function indexOfId(list, id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) return i;
    }
    return -1;
  }

  function plural(n, word) {
    return n + ' ' + word + (n === 1 ? '' : 's');
  }

  function colOf(key) {
    return pick(COLUMNS, function (c) { return c.key === key; });
  }

  function uid() {
    return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function fmtDate(ms) {
    return new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // ---------- storage ----------
  // Storage is not always available: private browsing, a full quota, a browser
  // with storage switched off. None of these must throw an error at the page,
  // so every read and every write goes through these three functions.
  function lsGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  function lsSet(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (e) {
      console.warn('Could not save to localStorage:', e);
    }
  }

  function lsDel(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  // Two earlier names hold the board, and two hold the palette, so the two of
  // them come through here. This reads `key`, or an earlier name if `key` is empty.
  function readCarried(key, olds) {
    var current = lsGet(key);
    if (current != null) return current;
    // The current name holds nothing, so try the earlier names, newest first.
    // The first value found moves to the current name. Every earlier name is
    // deleted, and not only the one that supplied the value. An older copy left
    // in place would return the next time the board is empty.
    var carried = null;
    olds.forEach(function (old) {
      if (carried == null) carried = lsGet(old);
      lsDel(old);
    });
    if (carried != null) lsSet(key, carried);
    return carried;
  }

  // ---------- state ----------
  // state.cols = { remember: [card], backlog: [...], now: [...], accomplished: [...] }
  // card = { id, text, created, pinned, notes: [note] }. A note has the same shape.
  var state = load();
  // the one card in a drag: { id, level, pinned }. The level says what can
  // receive it. A 'card' lands in a column, a 'note' only in the notes window.
  // The pin says which side of the pinned group the card may land on.
  var drag = null;
  // { col, index, cards } for one card or a whole cleared column, or
  // { noteOf, index, cards } for notes removed from the card with that id
  var lastDeleted = null;
  var toastTimer = null;

  function blank() {
    var cols = {};
    KEYS.forEach(function (k) { cols[k] = []; });
    return { cols: cols };
  }

  function load() {
    var fresh = blank();
    try {
      var raw = readCarried(STORE, OLD_STORES);
      if (!raw) return fresh;
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.cols) return fresh;
      var cols = parsed.cols;
      // the Accomplished column had the key "later". Move those cards to it.
      if (Array.isArray(cols.later) && !Array.isArray(cols.accomplished)) {
        cols.accomplished = cols.later;
      }
      // the Remember column had the key "waiting". Move those cards to it.
      if (Array.isArray(cols.waiting) && !Array.isArray(cols.remember)) {
        cols.remember = cols.waiting;
      }
      KEYS.forEach(function (k) {
        fresh.cols[k] = normalize(cols[k]);
      });
      // The board used to have a fourth "Cut" column. The column is gone, but
      // its cards stay. They go to the end of Backlog, to keep or to delete.
      fresh.cols.backlog = fresh.cols.backlog.concat(normalize(cols[GONE_KEY]));
      // a stored board can hold a pinned card below an unpinned one, if it was
      // written by hand or by an older page
      orderPinned(fresh.cols);
    } catch (e) { /* corrupt storage. Start clean */ }
    return fresh;
  }

  // A note has the shape of a card, so one pass cleans the two of them, at every
  // depth in a file. The board never shows anything below the first level of
  // notes, but it keeps it.
  function normalize(list) {
    if (!Array.isArray(list)) return [];
    return list.filter(function (c) {
      return c && typeof c.text === 'string';
    }).map(function (c) {
      return {
        id: c.id || uid(),
        text: c.text,
        created: typeof c.created === 'number' ? c.created : Date.now(),
        pinned: c.pinned === true,
        notes: normalize(c.notes)
      };
    });
  }

  // Cards and notes are made the same way, so neither one can start without a
  // field that the other has. A note is never pinned, but it carries the field.
  function newItem(text) {
    return { id: uid(), text: text, created: Date.now(), pinned: false, notes: [] };
  }

  // Pinned cards hold the top of a column. Every path that changes a column ends
  // at commit(), so this one pass keeps them there: a drop, a pin, a card from
  // an import, an Undo. filter keeps the order inside each of the two groups, so
  // nothing else about a column moves.
  function orderPinned(cols) {
    KEYS.forEach(function (k) {
      var list = cols[k];
      cols[k] = list.filter(function (c) { return c.pinned; })
        .concat(list.filter(function (c) { return !c.pinned; }));
    });
  }

  function save() {
    lsSet(STORE, JSON.stringify(state));
  }

  // every change to the board ends the same way
  function commit() {
    orderPinned(state.cols);
    save();
    render();
  }

  function find(id) {
    for (var i = 0; i < KEYS.length; i++) {
      var list = state.cols[KEYS[i]];
      var at = indexOfId(list, id);
      if (at >= 0) return { col: KEYS[i], index: at, card: list[at] };
    }
    return null;
  }

  // ---------- composer ----------
  // A "+ add" button and the box it opens: one in every column foot, one in the
  // notes window. spec.onAdd(text) puts the text where it belongs.
  //
  // Burst mode decides what an entry leaves behind. Off, the box closes on each
  // card, which is one card at a time. On, it stays open and empty, so you can
  // type several cards one after another. One setting serves every box on the
  // page, it holds between visits, and it starts off on a board that has never
  // set it. Its switch is in the box, so it is there only while you are adding.
  var burst = lsGet(BURST_KEY) === '1';

  function makeComposer(host, spec) {
    var add = textBtn('addbtn', spec.add);
    var box = el('div', 'composer');
    var ta = el('textarea');
    ta.rows = 2;
    ta.placeholder = spec.placeholder;
    var saveBtn = textBtn('save', 'Add');
    saveBtn.appendChild(el('span', 'key', '⏎'));
    var cancelBtn = textBtn('cancel', 'cancel');
    cancelBtn.appendChild(el('span', 'key', 'esc'));
    var burstBtn = textBtn('burst', 'burst');
    var row = el('div', 'composer-row');
    var acts = el('div', 'composer-acts');
    acts.appendChild(saveBtn);
    acts.appendChild(cancelBtn);
    row.appendChild(acts);
    row.appendChild(burstBtn);
    box.appendChild(ta);
    box.appendChild(row);
    host.appendChild(add);
    host.appendChild(box);

    function open() {
      closeComposers();
      showBurst();
      box.classList.add('on');
      add.style.display = 'none';
      ta.focus();
    }

    function close() {
      box.classList.remove('on');
      add.style.display = '';
      ta.value = '';
    }

    // Every box shares the one setting, so each one shows it again as it opens
    // and any box can turn it round.
    function showBurst() {
      burstBtn.classList.toggle('on', burst);
      burstBtn.setAttribute('aria-pressed', burst ? 'true' : 'false');
      burstBtn.title = burst
        ? 'Burst mode on: the box stays open for the next card'
        : 'Burst mode off: the box closes once the card is in';
    }

    function submit() {
      var text = ta.value.trim();
      if (!text) { close(); return; }
      ta.value = '';
      spec.onAdd(text);
      if (burst) { ta.focus(); return; }
      // the box is about to go, so the button that opens it takes the focus back
      close();
      add.focus();
    }

    // how closeComposers() reaches an open box through the DOM
    box.close = close;

    add.addEventListener('click', open);
    saveBtn.addEventListener('click', submit);
    cancelBtn.addEventListener('click', close);
    burstBtn.addEventListener('click', function () {
      burst = !burst;
      lsSet(BURST_KEY, burst ? '1' : '0');
      showBurst();
      // the switch is pressed in the middle of typing, so the box keeps the focus
      ta.focus();
    });
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submit();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        // the notes window closes on Escape too, so a box inside it stops the key
        if (spec.inner) e.stopPropagation();
        close();
        add.focus();
      }
    });

    return { open: open, close: close };
  }

  function closeComposers() {
    document.querySelectorAll('.composer.on').forEach(function (box) {
      if (box.close) box.close();
    });
  }

  // ---------- clear a whole column ----------
  // A clear of a column is the one action that can lose many cards at once. So
  // it asks in the footer first, and an Undo is still available after that.
  function makeClearRow(c) {
    var row = el('div', 'clear-row');
    var open = textBtn('clearbtn', 'clear column');
    open.setAttribute('aria-label', 'Clear the ' + c.label + ' column');

    var ask = el('div', 'clear-ask');
    var question = el('span', 'q');
    var yes = textBtn('yes', 'clear');
    var no = textBtn('no', 'cancel');
    ask.appendChild(question);
    ask.appendChild(yes);
    ask.appendChild(no);

    row.appendChild(open);
    row.appendChild(ask);

    function closeAsk() {
      ask.classList.remove('on');
      open.style.display = '';
    }
    row.closeAsk = closeAsk;

    open.addEventListener('click', function () {
      var n = state.cols[c.key].length;
      if (!n) return;
      var what = plural(n, 'card');
      question.textContent = 'clear ' + what + '?';
      yes.setAttribute('aria-label', 'Yes, clear ' + what + ' from ' + c.label);
      open.style.display = 'none';
      ask.classList.add('on');
      yes.focus();
    });
    no.addEventListener('click', function () {
      closeAsk();
      open.focus();
    });
    yes.addEventListener('click', function () {
      closeAsk();
      clearColumn(c.key);
    });

    return row;
  }

  function closeClearAsks() {
    KEYS.forEach(function (k) {
      if (views[k].clear) views[k].clear.closeAsk();
    });
  }

  // ---------- build the board ----------
  var board = document.getElementById('board');
  var views = {};        // key -> the parts of that column that get redrawn

  COLUMNS.forEach(function (c) {
    var column = el('section', 'col');
    column.dataset.col = c.key;

    var head = el('div', 'col-head');
    head.appendChild(el('h2', null, c.label));
    var count = el('span', 'count');
    head.appendChild(count);

    var addWrap = el('div', 'col-add');
    var body = el('div', 'col-body');

    makeComposer(addWrap, {
      add: '+',
      placeholder: c.prompt,
      onAdd: function (text) {
        state.cols[c.key].unshift(newItem(text));
        commit();
      }
    });

    var clear = c.clearable ? makeClearRow(c) : null;
    var foot = null;
    if (clear) {
      foot = el('div', 'col-foot');
      foot.appendChild(clear);
    }

    column.appendChild(head);
    column.appendChild(addWrap);
    column.appendChild(body);
    if (foot) column.appendChild(foot);
    board.appendChild(column);

    if (c.divider) {
      var rule = el('div', 'col-divider');
      rule.setAttribute('aria-hidden', 'true');
      board.appendChild(rule);
    }

    wireDrop(column, body, {
      level: 'card',
      onDrop: function (id, at) { moveCard(id, c.key, at); }
    });

    views[c.key] = { el: column, body: body, count: count, clear: clear };
  });

  // ---------- dragging ----------
  function wireDrag(card, id, level) {
    card.addEventListener('dragstart', function (e) {
      // a menu sits where its button was, and a card in a drag takes its button
      // with it
      closeMenu();
      // the drag carries the pin, because the place a card can land depends on
      // which side of the pinned group it belongs to
      drag = { id: id, level: level, pinned: card.classList.contains('pinned') };
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', id);
    });
    card.addEventListener('dragend', function () {
      drag = null;
      card.classList.remove('dragging');
      hideDropline();
      document.querySelectorAll('.dragover').forEach(function (zone) {
        zone.classList.remove('dragover');
      });
    });
  }

  // what the drag holds, if this level can receive it
  function dragged(level) {
    return drag && drag.level === level ? drag.id : null;
  }

  // A zone takes cards of one level and puts them where the drop happened. It
  // marks itself while a card is over it, and draws a line at the place the card
  // would take. Only a column has a style for the mark, so on the notes window
  // the mark carries no style.
  function wireDrop(zone, body, spec) {
    zone.addEventListener('dragover', function (e) {
      if (!dragged(spec.level)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      zone.classList.add('dragover');
      showDropline(body, e.clientY);
    });
    zone.addEventListener('dragleave', function (e) {
      if (zone.contains(e.relatedTarget)) return;
      zone.classList.remove('dragover');
      hideDropline();
    });
    zone.addEventListener('drop', function (e) {
      e.preventDefault();
      zone.classList.remove('dragover');
      hideDropline();
      var id = dragged(spec.level);
      if (id) spec.onDrop(id, insertIndex(body, e.clientY));
    });
  }

  // Where the dragged card lands in the target list. Pinned cards hold the top
  // of a column, so a card lands on its own side of the line between the two
  // groups: an unpinned card no higher, a pinned card no lower. A note is never
  // pinned, so the line sits at zero there and nothing is held back.
  function insertIndex(body, y) {
    var cards = [].slice.call(body.querySelectorAll('.card:not(.dragging)'));
    var at = cards.length;
    for (var i = 0; i < cards.length; i++) {
      var box = cards[i].getBoundingClientRect();
      if (y < box.top + box.height / 2) { at = i; break; }
    }
    var line = body.querySelectorAll('.card.pinned:not(.dragging)').length;
    return drag && drag.pinned ? Math.min(at, line) : Math.max(at, line);
  }

  // The line that shows where the dragged card will land. Only one zone can be
  // under the pointer, so one line serves the board and the notes window.
  var dropline = null;

  function hideDropline() {
    if (dropline && dropline.parentNode) dropline.parentNode.removeChild(dropline);
  }

  // The line reads off the same index as the drop, so it never says one thing
  // and the drop another. An empty list gets no line, since there is no card
  // there to land above or below.
  //
  // It goes in the middle of the space the card would open: halfway between the
  // two cards it comes between, and half a gap clear of the first or the last
  // card at the ends. The gap comes off the column, so this and the stylesheet
  // do not each keep a copy of it.
  function showDropline(body, y) {
    var cards = [].slice.call(body.querySelectorAll('.card:not(.dragging)'));
    if (!cards.length) return hideDropline();
    var at = insertIndex(body, y);
    var half = (parseFloat(getComputedStyle(body).rowGap) || 0) / 2;
    var mid;
    if (at === 0) {
      mid = cards[0].getBoundingClientRect().top - half;
    } else if (at < cards.length) {
      mid = (cards[at - 1].getBoundingClientRect().bottom +
             cards[at].getBoundingClientRect().top) / 2;
    } else {
      mid = cards[cards.length - 1].getBoundingClientRect().bottom + half;
    }
    if (!dropline) dropline = el('div', 'dropline');
    if (dropline.parentNode !== body) body.appendChild(dropline);
    dropline.style.top = (mid - body.getBoundingClientRect().top + body.scrollTop) + 'px';
  }

  // ---------- moving and removing ----------
  // Cards and notes sit in plain arrays, so one move function and one remove
  // function serve the board and the notes window.
  function moveItem(from, to, id, at) {
    var i = indexOfId(from, id);
    if (i < 0) return;
    // `at` already excludes the dragged card (insertIndex skips .dragging), so
    // the index needs no adjustment for a reorder within one list.
    var item = from.splice(i, 1)[0];
    if (at == null || at > to.length) at = to.length;
    to.splice(at, 0, item);
    commit();
  }

  function moveCard(id, toCol, at) {
    var found = find(id);
    if (found) moveItem(state.cols[found.col], state.cols[toCol], id, at);
  }

  function moveNote(id, at) {
    var list = notesList();
    if (list) moveItem(list, list, id, at);
  }

  // A pin sends a card to the foot of the pinned group at the top of its column,
  // and taking it off sends the card to the head of the rest. orderPinned() in
  // commit() does the move, so this only turns the field over.
  function togglePin(id) {
    var found = find(id);
    if (!found) return;
    found.card.pinned = !found.card.pinned;
    commit();
  }

  // Everything that removes cards from a list ends here, so one Undo covers a
  // card, a note and a whole cleared column. `rec` says where they were.
  function discard(rec, msg) {
    lastDeleted = rec;
    commit();
    showToast(msg);
  }

  function removeCard(id) {
    var found = find(id);
    if (!found) return;
    state.cols[found.col].splice(found.index, 1);
    discard({ col: found.col, index: found.index, cards: [found.card] }, 'Card deleted');
  }

  function removeNote(id) {
    var list = notesList();
    if (!list) return;
    var i = indexOfId(list, id);
    if (i < 0) return;
    discard({ noteOf: openCardId, index: i, cards: list.splice(i, 1) }, 'Note deleted');
  }

  function clearColumn(key) {
    var taken = state.cols[key];
    if (!taken.length) return;
    state.cols[key] = [];
    discard({ col: key, index: 0, cards: taken }, plural(taken.length, 'card') + ' cleared');
  }

  // ---------- toast ----------
  var toast = document.getElementById('toast');

  function showToast(msg) {
    document.getElementById('toastMsg').textContent = msg;
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove('on');
      lastDeleted = null;
    }, 6000);
  }

  function hideToast() {
    clearTimeout(toastTimer);
    toast.classList.remove('on');
  }

  // where the undone cards return to: a column, or the notes of one card. A
  // delete can remove that card first. Then there is no place for the notes,
  // and the toast closes.
  function undoList(rec) {
    if (!rec.noteOf) return state.cols[rec.col];
    var found = find(rec.noteOf);
    return found ? found.card.notes : null;
  }

  document.getElementById('undoBtn').addEventListener('click', function () {
    if (!lastDeleted) return;
    var list = undoList(lastDeleted);
    if (list) {
      var at = Math.min(lastDeleted.index, list.length);
      list.splice.apply(list, [at, 0].concat(lastDeleted.cards));
    }
    lastDeleted = null;
    hideToast();
    commit();
  });

  // ---------- a card's actions ----------
  // The menu shows the actions for a card as a list of words. The one button on
  // the card opens it. The board has a single menu, and it moves to the button
  // that opens it, because only one menu can be open at a time. The menu attaches
  // to the page and not to the card, which keeps it clear of every element that
  // would clip it or scroll it.
  var menu = el('div', 'card-menu');
  menu.setAttribute('role', 'menu');
  document.body.appendChild(menu);
  var menuOwner = null;      // the button that owns the open menu, if any

  function makeMenuButton(card, actions) {
    var button = iconBtn('≡', 'actions', 'menubtn');
    button.setAttribute('aria-haspopup', 'true');
    button.setAttribute('aria-expanded', 'false');
    button.addEventListener('click', function (e) {
      e.stopPropagation();
      // a second press on the same button closes the menu again
      var mine = menuOwner === button;
      closeMenu();
      if (!mine) openMenu(card, button, actions);
    });
    return button;
  }

  function openMenu(card, button, actions) {
    menu.innerHTML = '';
    actions.forEach(function (a) {
      var row = textBtn(a.cls);
      row.setAttribute('role', 'menuitem');
      // the mark helps the eye to find the row. The word next to it is the full
      // name of the row, so a screen reader does not get the mark
      row.appendChild(icon(a.icon));
      row.appendChild(document.createTextNode(a.title));
      row.addEventListener('click', function (e) {
        e.stopPropagation();
        closeMenu();
        a.onClick();
      });
      menu.appendChild(row);
    });
    menuOwner = button;
    button.setAttribute('aria-expanded', 'true');
    card.classList.add('menuopen');
    // shown before it is placed, because you cannot aim a menu with no size
    menu.classList.add('on');
    placeMenu(button);
    menu.firstChild.focus();
  }

  // Returns whether there was a menu to close, so Escape can stop at the menu.
  // This function never moves the focus. A click on one of the words closes the
  // menu before it runs the action, and a move of the focus back to the card
  // would take it away from whatever the action opened.
  function closeMenu() {
    if (!menuOwner) return false;
    menuOwner.setAttribute('aria-expanded', 'false');
    var card = menuOwner.closest('.card');
    if (card) card.classList.remove('menuopen');
    menuOwner = null;
    menu.classList.remove('on');
    return true;
  }

  // The menu goes below the button that owns it. It moves back onto the page at
  // either edge, and it goes above the button when there is no room below it.
  function placeMenu(button) {
    var at = button.getBoundingClientRect();
    var box = menu.getBoundingClientRect();
    var left = Math.min(at.right - box.width, window.innerWidth - box.width - 8);
    var top = at.bottom + 6;
    if (top + box.height > window.innerHeight - 8) top = at.top - box.height - 6;
    menu.style.left = Math.round(Math.max(8, left)) + 'px';
    menu.style.top = Math.round(Math.max(8, top)) + 'px';
  }

  menu.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    var rows = [].slice.call(menu.children);
    var at = rows.indexOf(document.activeElement);
    rows[(at + (e.key === 'ArrowDown' ? 1 : rows.length - 1)) % rows.length].focus();
  });

  // The menu sits where the button was at the moment it opened. So anything that
  // moves the button below it closes the menu, and does not leave it stranded.
  // Capture, because the notes window scrolls and the page does not.
  window.addEventListener('scroll', function () { closeMenu(); }, true);
  window.addEventListener('resize', function () { closeMenu(); });

  // ---------- card ----------
  // A board card and a note are the same object with the same parts: its text,
  // a date, and the button that opens the rest. `spec` holds the small number of
  // differences between the two.
  //   level    which drag this card belongs to
  //   redraw   what to run after an edit: the board, or the notes list
  //   mark     optional words after the date, which arrive after a dot
  //   markCls  an extra class for those words, if they need one
  //   onMark   what a click on those words does, if it does anything
  //   pinned   whether this card holds the top of its column. A note has none
  //   buttons  what the menu offers, in order: { icon, title, cls, onClick },
  //            where icon names a mark in MARKS
  function makeItem(item, spec) {
    var card = el('article', 'card');
    card.draggable = true;
    card.dataset.id = item.id;

    var text = el('div', 'ctext');
    renderText(text, item.text, function (at) { toggleTask(item, at); });

    var bot = el('div', 'card-bot');
    // The mark for a pinned card comes before its date, and the class is what
    // the drag reads to hold the card among the pinned ones.
    if (spec.pinned) {
      card.classList.add('pinned');
      bot.appendChild(icon('pin'));
    }
    bot.appendChild(el('span', 'date', fmtDate(item.created)));
    if (spec.mark) {
      var cls = spec.markCls ? 'notemark ' + spec.markCls : 'notemark';
      var mark = el('span', cls);
      mark.appendChild(el('span', 'dot', '· '));
      mark.appendChild(el('span', 'words', spec.mark));
      if (spec.onMark) mark.addEventListener('click', spec.onMark);
      bot.appendChild(mark);
    }

    // The menu holds the actions that open something else. An edit stays on the
    // card, and a double-click is the way to it.
    var actions = el('div', 'card-actions');
    actions.appendChild(makeMenuButton(card, spec.buttons));
    bot.appendChild(actions);

    card.appendChild(text);
    card.appendChild(bot);
    wireDrag(card, item.id, spec.level);

    // The parts of a card that answer a press of their own keep it. A link opens,
    // the note mark opens the notes, the button opens the menu, and none of them
    // opens the box. Inside the box itself a double-click picks a word, and
    // editItem() has nothing left to replace by then.
    card.addEventListener('dblclick', function (e) {
      if (e.target.closest('a, button, .notemark')) return;
      editItem(card, text, item, spec.redraw);
    });
    return card;
  }

  // Replace the text with a box that holds it. Enter keeps the change, and so
  // does a move of the focus out of the box. Escape drops the change, and an
  // empty box counts as no change.
  function editItem(card, text, item, redraw) {
    // the box has taken the place of the text already, so there is nothing left
    // here to replace
    if (text.parentNode !== card) return;
    var ta = el('textarea');
    ta.value = item.text;
    card.draggable = false;
    card.replaceChild(ta, text);

    // The box shows the whole text with no scroll, on open and after every
    // keystroke. scrollHeight leaves out the border, so the border goes back on.
    function fit() {
      ta.style.height = 'auto';
      ta.style.height = (ta.scrollHeight + ta.offsetHeight - ta.clientHeight) + 'px';
    }
    ta.addEventListener('input', fit);
    fit();

    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);

    var done = false;
    function finish(keep) {
      if (done) return;
      done = true;
      card.draggable = true;
      if (keep) {
        var v = ta.value.trim();
        if (v) { item.text = v; save(); }
      }
      redraw();
    }

    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
    ta.addEventListener('blur', function () { finish(true); });
  }

  // Split raw card text into the segments that it displays as, in order. A run
  // between two backticks is code, and everything else is plain. So
  // 'run `npm test` now' gives
  // [{text: 'run ', code: false}, {text: 'npm test', code: true},
  //  {text: ' now', code: false}]. The text of a code segment drops the backticks
  // that marked it.
  // A span must hold at least one character and stay on one line. So '``' and a
  // stray backtick stay as the characters they are, and a backtick opened on one
  // line cannot take in the lines below it. split keeps the capture, which puts
  // the code runs on the odd indices.
  function codeSpans(s) {
    return s.split(/`([^`\n]+)`/).map(function (part, i) {
      return { text: part, code: i % 2 === 1 };
    }).filter(function (seg) {
      return seg.text !== '';
    });
  }

  // The two shapes for an address: a bare one, and [what it is](where), for an
  // address that is too long to read on a card. Each shape stops at the first
  // space, and neither one can hold the brackets that delimit it. One capture
  // group holds the pair, so split puts the addresses on the odd indices, the
  // same as codeSpans does.
  var LINK_RE = /(\[[^\[\]\n]+\]\([^()\s]+\)|https?:\/\/[^\s<>]+|mailto:[^\s<>]+)/i;
  var LABELLED = /^\[([^\[\]\n]+)\]\(([^()\s]+)\)$/;
  // What the board will open. Everything else is not a link here, among them a
  // javascript: or a data: address, and it stays as the characters you typed.
  var OPENABLE = /^(https?:\/\/|mailto:)/i;

  function safeHref(url) {
    return OPENABLE.test(url) ? url : null;
  }

  // An address runs to the first space, so it collects the punctuation of the
  // sentence around it. Return the characters at the end that read as prose and
  // not as address, and a closing bracket only when nothing opened it.
  // The count of the brackets happens once, and the count then decreases. It is
  // not made again for every character returned. A card with thousands of
  // brackets is a paste that went wrong, and it must cost the board very little.
  function trimTail(url) {
    var opens = 0;
    var closes = 0;
    var end = url.length;
    var i;
    for (i = 0; i < url.length; i++) {
      if (url.charAt(i) === '(') opens++;
      else if (url.charAt(i) === ')') closes++;
    }
    while (end) {
      var last = url.charAt(end - 1);
      if ('.,;:!?\'"'.indexOf(last) >= 0) end--;
      else if (last === ')' && closes > opens) { closes--; end--; }
      else break;
    }
    return url.slice(0, end);
  }

  // Find the addresses in a run of plain text. A link segment holds the href to
  // open and the text to show for it. For a bare address the two are the same.
  function linkSpans(s) {
    var out = [];
    s.split(LINK_RE).forEach(function (part, i) {
      if (!part) return;
