<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Personal board</title>
<!-- the three palette columns; setFavicon() redraws it when the palette changes.
     Waiting for is left out — a white bar on an ivory tile reads as nothing at 16px. -->
<link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23FAF9F5%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%225%22%20width%3D%226%22%20height%3D%2222%22%20rx%3D%222%22%20fill%3D%22%23788C5D%22%2F%3E%3Crect%20x%3D%2213%22%20y%3D%225%22%20width%3D%226%22%20height%3D%2222%22%20rx%3D%222%22%20fill%3D%22%23D97757%22%2F%3E%3Crect%20x%3D%2222%22%20y%3D%225%22%20width%3D%226%22%20height%3D%2222%22%20rx%3D%222%22%20fill%3D%22%2387867F%22%2F%3E%3C%2Fsvg%3E" />
<style>
  :root {
    --ivory: #FAF9F5;
    --slate: #141413;
    --clay: #D97757;
    --clay-d: #B85C3E;
    --oat: #E3DACC;
    --olive: #788C5D;
    --gray-50: #F0EEE6;
    --gray-200: #D1CFC5;
    --gray-500: #87867F;
    --gray-600: #63625C;   /* text sitting on a column tint — 5.1:1 on all three */
    --gray-800: #3D3D3A;
    --white: #ffffff;

    /* column fills: each column's colour at 12% over ivory.
       Both sets are rewritten by the palette picker. */
    --fill-backlog: #EAECE3;
    --fill-now: #F6E9E2;
    --fill-accomplished: #ECEBE7;
    --rule-backlog: #788C5D;
    --rule-now: #D97757;
    --rule-accomplished: #87867F;
    /* Waiting for sits outside the palette — plain white in every scheme, so the
       picker leaves this pair alone */
    --fill-waiting: var(--white);
    --rule-waiting: var(--gray-200);
    --col-rule: rgba(20, 20, 19, 0.07);
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--ivory);
    color: var(--slate);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 1140px;
    margin: 0 auto;
    padding: 48px 32px 64px;
  }

  /* ---------- header ---------- */
  header { margin-bottom: 22px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-500);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 6px 0 4px;
  }
  .hintline {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-500);
    margin-top: 10px;
  }
  .hintline::before {
    content: "›";
    color: var(--clay);
    margin-right: 6px;
  }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--ivory);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 0 12px;
    margin-bottom: 14px;
    border-bottom: 1.5px solid var(--gray-200);
  }
  .summary {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gray-800);
    letter-spacing: 0.01em;
  }
  .summary b { color: var(--slate); font-weight: 600; }
  .summary .dot { color: var(--gray-200); margin: 0 4px; }
  .spacer { flex: 1; }
  button.ghost {
    background: transparent;
    color: var(--gray-800);
    border: 1.5px solid var(--gray-200);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 12px;
    padding: 9px 16px;
    cursor: pointer;
  }
  button.ghost:hover { border-color: var(--gray-500); }
  button.ghost[aria-expanded="true"] { border-color: var(--gray-500); }

  /* ---------- palette picker ---------- */
  .palette-wrap { position: relative; }
  .palette-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 20;
    width: 268px;
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 10px;
    padding: 7px;
    box-shadow: 0 6px 22px rgba(20,20,19,0.10);
    display: none;
    flex-direction: column;
    gap: 1px;
    max-height: 72vh;
    overflow-y: auto;
  }
  .palette-panel.on { display: flex; }
  .palette-panel .cap {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--gray-600);
    padding: 5px 7px 7px;
  }
  .pal {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    padding: 7px;
    border: 1.5px solid transparent;
    border-radius: 7px;
    background: transparent;
    cursor: pointer;
    text-align: left;
  }
  .pal:hover { background: var(--gray-50); }
  .pal:focus-visible { outline: 2px solid var(--clay); outline-offset: -2px; }
  .pal.on { border-color: var(--clay); }
  .pal-top { display: flex; align-items: baseline; gap: 8px; }
  .pal-name { font-size: 12px; color: var(--slate); }
  .pal-num {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--gray-600);
    font-variant-numeric: tabular-nums;
  }
  .pal-bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .pal-bar {
    height: 24px;
    border-radius: 3px;
    border: 1px solid var(--gray-200);
    border-top: 3px solid var(--r);
    background: var(--t);
  }
  .pal-cols {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--gray-600);
    line-height: 1.35;
  }
  .fam-strip { display: flex; flex-wrap: wrap; gap: 4px; }
  .fam-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--c);
    border: 1px solid rgba(20,20,19,0.12);
  }
  .pal-back {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--gray-600);
    padding: 5px 7px 8px;
    text-align: left;
  }
  .pal-back:hover { color: var(--slate); }
  .pal-back .arrow { color: var(--clay); font-size: 13px; }

  /* ---------- board ---------- */
  .board {
    display: grid;
    /* waiting · hairline · backlog · now · accomplished */
    grid-template-columns: 1fr 1px repeat(3, 1fr);
    gap: 16px;
    align-items: start;
  }
  /* Waiting for holds what is not yours to move, so it is set off from the three
     doing-columns rather than sitting flush with them. A gap-width hairline,
     faded at both ends, stretched to the tallest column in the row. */
  .col-divider {
    align-self: stretch;
    width: 1px;
    background: linear-gradient(
      to bottom,
      transparent 0,
      var(--gray-200) 14%,
      var(--gray-200) 86%,
      transparent 100%
    );
  }
  .col {
    background: var(--fill);
    border: 1.5px solid var(--gray-200);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 200px;
  }
  .col[data-col="waiting"]      { --fill: var(--fill-waiting);      border-top: 3px solid var(--rule-waiting); }
  .col[data-col="backlog"]      { --fill: var(--fill-backlog);      border-top: 3px solid var(--rule-backlog); }
  .col[data-col="now"]          { --fill: var(--fill-now);          border-top: 3px solid var(--rule-now); }
  .col[data-col="accomplished"] { --fill: var(--fill-accomplished); border-top: 3px solid var(--rule-accomplished); }
  .col.dragover {
    outline: 2px dashed var(--clay);
    outline-offset: -6px;
    /* layered over the fill so the column keeps its own colour while dragging */
    background-image: linear-gradient(rgba(217, 119, 87, 0.10), rgba(217, 119, 87, 0.10));
  }
  .col-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 14px 14px 10px;
    border-bottom: 1.5px solid var(--col-rule);
  }
  .col-head h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 17px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .col-head .count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-800);
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 999px;
    padding: 1px 8px;
    min-width: 26px;
    text-align: center;
  }
  .col-body {
    padding: 10px 10px 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-height: 60px;
  }
  .empty {
    font-family: var(--mono);
    font-size: 11px;
    /* purely decorative — an empty column already says it is empty */
    color: var(--gray-500);
    text-align: center;
    padding: 18px 6px;
    user-select: none;
  }
  .col-foot {
    border-top: 1.5px solid var(--col-rule);
    padding: 8px 10px 10px;
  }
  .addbtn {
    width: 100%;
    background: transparent;
    border: 1.5px dashed rgba(20, 20, 19, 0.16);
    border-radius: 8px;
    color: var(--gray-600);
    font-family: var(--mono);
    font-size: 11px;
    padding: 8px 10px;
    cursor: pointer;
    text-align: left;
  }
  .addbtn:hover { border-color: var(--clay); color: var(--clay-d); }

  /* ---------- composer ---------- */
  .composer { display: none; }
  .composer.on { display: block; }
  .composer textarea {
    width: 100%;
    resize: vertical;
    min-height: 58px;
    background: var(--white);
    border: 1.5px solid var(--gray-500);
    border-radius: 8px;
    padding: 9px 10px;
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.35;
    color: var(--slate);
    outline: none;
  }
  .composer textarea:focus { border-color: var(--clay); }
  .composer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 7px;
  }
  .composer .save {
    background: var(--slate);
    color: var(--ivory);
    border: 1.5px solid var(--slate);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .composer .save:hover { background: var(--gray-800); }
  .composer .cancel {
    background: transparent;
    border: none;
    color: var(--gray-600);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    padding: 5px 2px;
  }
  .composer .cancel:hover { color: var(--slate); }
  .composer .keyhint {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--gray-600);
  }

  /* ---------- clear column ---------- */
  .clear-row { margin-top: 7px; }
  .clear-row.off { display: none; }
  .clearbtn {
    display: block;
    margin-left: auto;
    background: transparent;
    border: none;
    color: var(--gray-600);
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 2px;
    cursor: pointer;
  }
  .clearbtn:hover { color: var(--clay-d); }
  .clear-ask {
    display: none;
    align-items: center;
    gap: 8px;
  }
  .clear-ask.on { display: flex; }
  .clear-ask .q {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-800);
  }
  /* outlined, not filled: --clay-d reaches 4.5:1 as ink on white, but only
     4.3:1 as a background under ivory text */
  .clear-ask .yes {
    margin-left: auto;
    background: var(--white);
    color: var(--clay-d);
    border: 1.5px solid var(--clay-d);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 12px;
    cursor: pointer;
  }
  /* thickens the ring rather than tinting the fill — any tint behind --clay-d
     drops it back under 4.5:1 */
  .clear-ask .yes:hover { box-shadow: 0 0 0 1.5px var(--clay-d); }
  .clear-ask .no {
    background: transparent;
    border: none;
    color: var(--gray-600);
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 2px;
    cursor: pointer;
  }
  .clear-ask .no:hover { color: var(--slate); }

  /* ---------- card ---------- */
  .card {
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 8px;
    padding: 10px 11px 8px;
    cursor: grab;
    /* a white card only separates from its tint by 1.19:1, so it gets a lift too */
    box-shadow: 0 1px 2px rgba(20,20,19,0.05);
    transition: border-color 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
  }
  .card:hover { border-color: var(--gray-500); box-shadow: 0 2px 5px rgba(20,20,19,0.09); }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .4; }
  .ctext {
    font-size: 13px;
    line-height: 1.35;
    color: var(--slate);
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 7px;
  }
  .ctext code {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gray-800);
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: 4px;
    padding: 0 3px;
    /* a chip is taller than the run of text it sits in, so hold its own line
       tight to stop it prising the card's lines apart */
    line-height: 1.15;
  }
  .card textarea {
    width: 100%;
    resize: vertical;
    min-height: 52px;
    background: var(--white);
    border: 1.5px solid var(--clay);
    border-radius: 6px;
    padding: 7px 8px;
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.35;
    color: var(--slate);
    outline: none;
    margin-bottom: 7px;
  }
  .card-bot {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .date {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--gray-800);
    letter-spacing: 0.02em;
  }
  .card-actions {
    margin-left: auto;
    display: flex;
    gap: 3px;
    opacity: 0;
    transition: opacity 120ms ease;
  }
  .card:hover .card-actions,
  .card:focus-within .card-actions { opacity: 1; }
  @media (hover: none) { .card-actions { opacity: 1; } }
  .card-actions button {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1;
    color: var(--gray-800);
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 4px;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .card-actions button:hover { border-color: var(--gray-500); color: var(--slate); }
  .card-actions button.del:hover { border-color: var(--clay); color: var(--clay-d); }

  /* ---------- undo toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(12px);
    background: var(--slate);
    color: var(--ivory);
    border-radius: 999px;
    padding: 9px 10px 9px 18px;
    font-family: var(--mono);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 140ms ease, transform 140ms ease;
    z-index: 20;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button {
    background: transparent;
    color: var(--clay);
    border: 1.5px solid var(--gray-800);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 12px;
    cursor: pointer;
  }
  .toast button:hover { border-color: var(--clay); }

  /* below four-across the columns no longer sit in one row, so the hairline has
     nothing to divide and goes away */
  @media (max-width: 940px) {
    .board { grid-template-columns: repeat(2, 1fr); }
    .col-divider { display: none; }
    .wrap { padding: 32px 20px 56px; }
  }
  @media (max-width: 560px) {
    .board { grid-template-columns: 1fr; }
    .toolbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">personal / board</div>
    <h1>Personal board</h1>
    <div class="hintline">click “+ add” in a column &nbsp;·&nbsp; drag cards between columns &nbsp;·&nbsp; click a card to edit</div>
  </header>

  <div class="toolbar">
    <div class="summary" id="summary"></div>
    <div class="spacer"></div>
    <span class="palette-wrap">
      <button class="ghost" id="paletteBtn" aria-expanded="false" aria-haspopup="true">Palette</button>
      <div class="palette-panel" id="palettePanel"></div>
    </span>
    <button class="ghost" id="importBtn">Import</button>
    <button class="ghost" id="exportBtn">Export</button>
    <input type="file" id="fileInput" accept="application/json,.json" hidden />
  </div>

  <div class="board" id="board"></div>

</div>

<div class="toast" id="toast">
  <span id="toastMsg"></span>
  <button id="undoBtn">Undo</button>
</div>

<script>
  // ---------- config ----------
  var COLUMNS = [
    { key: 'waiting',      label: 'Waiting for',  prompt: 'Who or what are you waiting on?',
      add: 'waiting', divider: true },
    { key: 'backlog',      label: 'Backlog',      prompt: 'What needs doing?' },
    { key: 'now',          label: 'Now',          prompt: "What's underway?" },
    { key: 'accomplished', label: 'Accomplished', prompt: 'What got done?', clearable: true }
  ];
  var KEYS = COLUMNS.map(function (c) { return c.key; });
  // the palette only dresses the three doing-columns; Waiting for stays white
  var PAL_KEYS = ['backlog', 'now', 'accomplished'];
  var STORE = 'personal.board.v1';
  // earlier names for the same board, newest first; load() carries the first hit over
  var OLD_STORES = ['todo.board.v1', 'backlog.board.v1'];
  var GONE_KEY = 'cut';                 // the removed fourth column, see load()

  // ---------- state ----------
  // state.cols = { backlog: [card], now: [...], accomplished: [...] }
  // card = { id, text, created }
  var state = load();
  var dragId = null;
  var lastDeleted = null;   // { col, index, cards } — one card, or a whole cleared column
  var toastTimer = null;

  function blank() {
    var cols = {};
    KEYS.forEach(function (k) { cols[k] = []; });
    return { cols: cols };
  }

  function load() {
    var fresh = blank();
    try {
      var raw = localStorage.getItem(STORE);
      if (raw == null) {
        // the board has been renamed twice — pick up whichever old key still holds it
        for (var i = 0; i < OLD_STORES.length && raw == null; i++) {
          raw = localStorage.getItem(OLD_STORES[i]);
        }
        if (raw != null) {
          localStorage.setItem(STORE, raw);
          OLD_STORES.forEach(function (k) { localStorage.removeItem(k); });
        }
      }
      if (!raw) return fresh;
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.cols) return fresh;
      var cols = parsed.cols;
      // the Accomplished column used to be keyed "later" — carry those cards over
      if (Array.isArray(cols.later) && !Array.isArray(cols.accomplished)) {
        cols.accomplished = cols.later;
      }
      KEYS.forEach(function (k) {
        fresh.cols[k] = normalize(cols[k]);
      });
      // the board used to have a fourth "Cut" column. It is gone, but its cards
      // are not thrown away — they land at the end of Backlog to be kept or deleted.
      fresh.cols.backlog = fresh.cols.backlog.concat(normalize(cols[GONE_KEY]));
    } catch (e) { /* corrupt or unavailable storage — start clean */ }
    return fresh;
  }

  function normalize(list) {
    if (!Array.isArray(list)) return [];
    return list.filter(function (c) {
      return c && typeof c.text === 'string';
    }).map(function (c) {
      return {
        id: c.id || uid(),
        text: c.text,
        created: typeof c.created === 'number' ? c.created : Date.now()
      };
    });
  }

  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify(state));
    } catch (e) {
      console.warn('Could not save to localStorage:', e);
    }
  }

  function uid() {
    return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function find(id) {
    for (var i = 0; i < KEYS.length; i++) {
      var list = state.cols[KEYS[i]];
      for (var j = 0; j < list.length; j++) {
        if (list[j].id === id) return { col: KEYS[i], index: j, card: list[j] };
      }
    }
    return null;
  }

  function fmtDate(ms) {
    var d = new Date(ms);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // ---------- build columns ----------
  var board = document.getElementById('board');
  var bodies = {};
  var counts = {};
  var clearRows = {};

  COLUMNS.forEach(function (c) {

    function openComposer() {
      closeComposers();

      ta.focus();
    }
    function closeComposer() {
      composer.classList.remove('on');
      addBtn.style.display = '';
      ta.value = '';
    }
    composer.close = closeComposer;

    function commit(keepOpen) {
      var text = ta.value.trim();
      if (!text) { closeComposer(); return; }
      state.cols[c.key].push({ id: uid(), text: text, created: Date.now() });
      save();
      render();
      ta.value = '';
      if (keepOpen) { ta.focus(); } else { closeComposer(); }
    }

    addBtn.addEventListener('click', openComposer);
    saveBtn.addEventListener('click', function () { commit(true); });
    cancelBtn.addEventListener('click', closeComposer);
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commit(true); }
      else if (e.key === 'Escape') { e.preventDefault(); closeComposer(); }
    });

    // ---- drop target ----
    col.addEventListener('dragover', function (e) {
      if (!dragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('dragover');
    });
    col.addEventListener('dragleave', function (e) {
      if (!col.contains(e.relatedTarget)) col.classList.remove('dragover');
    });
    col.addEventListener('drop', function (e) {
      e.preventDefault();
      col.classList.remove('dragover');
      if (!dragId) return;
      var at = insertIndex(body, e.clientY);
      moveCard(dragId, c.key, at);
    });
  });

  function closeComposers() {
    document.querySelectorAll('.composer.on').forEach(function (el) {
      if (el.close) el.close();
    });
  }

  function closeClearAsks() {
    KEYS.forEach(function (k) {
      if (clearRows[k]) clearRows[k].closeAsk();
    });
  }

  // where in the target column should the dragged card land?
  function insertIndex(body, y) {
    var cards = [].slice.call(body.querySelectorAll('.card:not(.dragging)'));
    for (var i = 0; i < cards.length; i++) {
      var box = cards[i].getBoundingClientRect();
      if (y < box.top + box.height / 2) return i;
    }
    return cards.length;
  }

  function moveCard(id, toCol, at) {
    var found = find(id);
    if (!found) return;
    // `at` already excludes the dragged card (insertIndex skips .dragging),
    // so no index adjustment is needed when reordering within a column.
    state.cols[found.col].splice(found.index, 1);
    var list = state.cols[toCol];
    if (at == null || at > list.length) at = list.length;
    list.splice(at, 0, found.card);
    save();
    render();
  }

  function removeCard(id) {
    var found = find(id);
    if (!found) return;
    state.cols[found.col].splice(found.index, 1);
    lastDeleted = { col: found.col, index: found.index, cards: [found.card] };
    save();
    render();
    showToast('Card deleted');
  }

  // emptying a column is the one action that can lose a lot at once, so it takes
  // a confirmation in the footer first — and is still undoable after that.
  function clearColumn(key) {
    var cards = state.cols[key];
    if (!cards.length) return;
    lastDeleted = { col: key, index: 0, cards: cards.slice() };
    state.cols[key] = [];
    save();
    render();
    showToast(cards.length + ' card' + (cards.length === 1 ? '' : 's') + ' cleared');
  }

  // ---------- toast ----------
  var toast = document.getElementById('toast');
  function showToast(msg) {
    document.getElementById('toastMsg').textContent = msg;
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove('on');
      lastDeleted = null;
    }, 6000);
  }
  document.getElementById('undoBtn').addEventListener('click', function () {
    if (!lastDeleted) return;
    var list = state.cols[lastDeleted.col];
    var at = Math.min(lastDeleted.index, list.length);
    list.splice.apply(list, [at, 0].concat(lastDeleted.cards));
    lastDeleted = null;
    clearTimeout(toastTimer);
    toast.classList.remove('on');
    save();
    render();
  });

  // ---------- card ----------
  // Split raw card text into the segments it displays as, in order. A run between
  // two backticks is code; everything else is plain. So 'run `npm test` now' gives
  // [{text: 'run ', code: false}, {text: 'npm test', code: true},
  //  {text: ' now', code: false}]. A code segment's text drops the backticks that
  // marked it.
  // A span has to hold at least one character and stay on one line, so '``' and a
  // stray backtick are left as the characters they are, and a tick opened on one
  // line cannot swallow the ones below it. split keeps the capture, which lands the
  // code runs on the odd indices.
  function codeSpans(s) {
    return s.split(/`([^`\n]+)`/).map(function (part, i) {
      return { text: part, code: i % 2 === 1 };
    }).filter(function (seg) {
      return seg.text !== '';
    });
  }

  function makeCard(card, colKey) {
    var el = document.createElement('article');
    el.className = 'card';
    el.draggable = true;
    el.dataset.id = card.id;

    var text = document.createElement('div');
    text.className = 'ctext';
    renderText(text, card.text);

    var bot = document.createElement('div');
    bot.className = 'card-bot';
    var date = document.createElement('span');
    date.className = 'date';
    date.textContent = fmtDate(card.created);

    var actions = document.createElement('div');
    actions.className = 'card-actions';
    var del = mkBtn('×', 'delete');
    del.className = 'del';
    actions.appendChild(del);

    bot.appendChild(date);
    bot.appendChild(actions);
    el.appendChild(text);
    el.appendChild(bot);

    del.addEventListener('click', function (e) { e.stopPropagation(); removeCard(card.id); });

    // ---- inline edit ----
    text.addEventListener('click', function () {
      var ta = document.createElement('textarea');
      ta.value = card.text;
      el.draggable = false;
      el.replaceChild(ta, text);
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);

      var done = false;
      function finish(keep) {
        if (done) return;
        done = true;
        el.draggable = true;
        if (keep) {
          var v = ta.value.trim();
          if (v) { card.text = v; save(); }
        }
        render();
      }
      ta.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); finish(true); }
        else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      });
      ta.addEventListener('blur', function () { finish(true); });
    });

    el.addEventListener('dragstart', function (e) {
      dragId = card.id;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', card.id);
    });
    el.addEventListener('dragend', function () {
      dragId = null;
      el.classList.remove('dragging');
      document.querySelectorAll('.col.dragover').forEach(function (c) {
        c.classList.remove('dragover');
      });
    });

    return el;
  }

  function mkBtn(label, title) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.title = title;
    b.setAttribute('aria-label', title);
    return b;
  }

  // Fill el with the card's text, each code segment as a <code> chip. The stored
  // text keeps its backticks, so editing a card shows them again. Built from text
  // nodes throughout, so card text never passes through innerHTML.
  function renderText(el, s) {
    el.textContent = '';
    codeSpans(s).forEach(function (seg) {
      if (seg.code) {
        var code = document.createElement('code');
        code.textContent = seg.text;
        el.appendChild(code);
      } else {
        el.appendChild(document.createTextNode(seg.text));
      }
    });
  }

  // ---------- render ----------
  function render() {
    COLUMNS.forEach(function (c) {
      var body = bodies[c.key];
      body.innerHTML = '';
      var list = state.cols[c.key];
      if (!list.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'nothing here';
        body.appendChild(empty);
      } else {
        list.forEach(function (card) { body.appendChild(makeCard(card, c.key)); });
      }
      counts[c.key].textContent = list.length;

      var clearRow = clearRows[c.key];
      if (clearRow) {
        // any state change drops a pending confirmation — it was asked about a
        // count that may no longer hold
        clearRow.closeAsk();
        clearRow.classList.toggle('off', !list.length);
      }
    });

    document.getElementById('summary').innerHTML = COLUMNS.map(function (c) {
      return '<b>' + state.cols[c.key].length + '</b>&nbsp;' + c.key;
    }).join('<span class="dot">·</span>');
  }

  // ---------- export / import ----------
  document.getElementById('exportBtn').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'personal-board-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  var fileInput = document.getElementById('fileInput');
  document.getElementById('importBtn').addEventListener('click', function () {
    fileInput.click();
  });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || !parsed.cols) throw new Error('bad shape');
        var total = 0;
        // an older export may still carry a Cut column; load() folds it into Backlog
        KEYS.concat(GONE_KEY).forEach(function (k) {
          if (Array.isArray(parsed.cols[k])) total += parsed.cols[k].length;
        });
        if (!confirm('Replace the current board with ' + total + ' card(s) from this file?')) return;
        localStorage.setItem(STORE, JSON.stringify(parsed));
        state = load();
        save();
        render();
      } catch (e) {
        alert("That file doesn't look like a personal board export.");
      }
      fileInput.value = '';
    };
    reader.readAsText(f);
  });

        lead: '#FDC57E',
        names: 'Deep Lyons Blue · Cinnamon Buff · Black' },
      { id: 'w329', name: "Cream Yellow & Slate Color", num: 329,
        colors: ['#501345', '#FDBF68', '#34454C'],
        lead: '#FDBF68',
        names: 'Cotinga Purple · Cream Yellow · Slate Color' },
      { id: 'w324', name: "Pompeian Red & Neutral Gray", num: 324,
        colors: ['#A36AA5', '#AB2439', '#B6BFC1'],
        lead: '#AB2439',
        names: 'Aconite Violet · Pompeian Red · Neutral Gray' }
    ] }
  ];

  var PALETTES = [];
  FAMILIES.forEach(function (f) {
    f.palettes.forEach(function (p) { p.family = f; PALETTES.push(p); });
  });

  function tintOf(hex) {
    var h = hex.replace('#', '');
    var out = '#';
    for (var i = 0; i < 3; i++) {
      var v = parseInt(h.substr(i * 2, 2), 16);
      var m = Math.round(v * TINT + IVORY_RGB[i] * (1 - TINT));
      out += ('0' + m.toString(16)).slice(-2);
    }
    return out.toUpperCase();
  }

  // the icon is the board itself: three bars, one per palette column, in the
  // palette's colours. The tints are too pale to survive 16px, so the bars run
  // solid — which is also why white Waiting for gets no bar.
  function setFavicon(colors) {
    var link = document.getElementById('favicon');
    if (!link) return;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
      '<rect width="32" height="32" rx="7" fill="#FAF9F5"/>';
    [4, 13, 22].forEach(function (x, i) {
      svg += '<rect x="' + x + '" y="5" width="6" height="22" rx="2" fill="' + colors[i] + '"/>';
    });
    link.href = 'data:image/svg+xml,' + encodeURIComponent(svg + '</svg>');
  }

  function applyPalette(id) {
    var p = PALETTES.filter(function (x) { return x.id === id; })[0] || PALETTES[0];
    var root = document.documentElement;
    currentPal = p.id;
    PAL_KEYS.forEach(function (k, i) {
      root.style.setProperty('--fill-' + k, tintOf(p.colors[i]));
      root.style.setProperty('--rule-' + k, p.colors[i]);
    });
    setFavicon(p.colors);
    try { localStorage.setItem(PAL_KEY, p.id); } catch (e) {}
  }

  var palPanel = document.getElementById('palettePanel');
  var palBtn = document.getElementById('paletteBtn');
  var palView = null;      // null = family list, otherwise a family id
  var currentPal = 'studio';

  function palBars(p) {
    return '<span class="pal-bars">' + p.colors.map(function (c) {
      return '<span class="pal-bar" style="--r:' + c + ';--t:' + tintOf(c) + '"></span>';
    }).join('') + '</span>';
  }

  function renderPanel() {
    palPanel.innerHTML = '';

    if (palView) {
      var fam = FAMILIES.filter(function (f) { return f.id === palView; })[0];
      var back = document.createElement('button');
      back.type = 'button';
      back.className = 'pal-back';
      back.innerHTML = '<span class="arrow">&lsaquo;</span> all families · ' + fam.name;
      back.addEventListener('click', function (e) {
        e.stopPropagation();
        palView = null;
        renderPanel();
      });
      palPanel.appendChild(back);

      fam.palettes.forEach(function (p) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'pal';
        b.dataset.pal = p.id;
        if (p.id === currentPal) b.classList.add('on');
        b.innerHTML =
          '<span class="pal-top"><span class="pal-name">' + p.name + '</span>' +
          '<span class="pal-num">' + (p.num ? 'no. ' + p.num : 'default') + '</span></span>' +
          palBars(p) +
          '<span class="pal-cols">' + p.names + '</span>';
        b.addEventListener('click', function (e) {
          e.stopPropagation();
          applyPalette(p.id);
          // stay open so several palettes can be tried in a row — the panel only
          // closes on a click outside or Escape. Move the marker in place rather
          // than re-rendering, which would throw away the scroll position.
          Array.prototype.forEach.call(palPanel.querySelectorAll('.pal'), function (el) {
            el.classList.toggle('on', el.dataset.pal === p.id);
          });
        });
        palPanel.appendChild(b);
      });
      return;
    }

    var cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = 'Sanzo Wada · 38 combinations, trimmed to three';
    palPanel.appendChild(cap);

    FAMILIES.forEach(function (f) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pal';
      b.dataset.fam = f.id;
      if (f.palettes.some(function (p) { return p.id === currentPal; })) b.classList.add('on');
      // one dot per palette, each showing that palette's lead colour — the one the
      // family is named for. So the strip previews both the count and the character.
      var dots = f.palettes.map(function (p) {
        return '<span class="fam-dot" style="--c:' + p.lead + '"></span>';
      }).join('');
      b.innerHTML =
        '<span class="pal-top"><span class="pal-name">' + f.name + '</span>' +
        '<span class="pal-num">' + f.palettes.length + '</span></span>' +
        '<span class="fam-strip">' + dots + '</span>' +
        '<span class="pal-cols">' + f.note + '</span>';
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        palView = f.id;
        renderPanel();
      });
      palPanel.appendChild(b);
    });
  }

  function openPalette() {
    palView = null;
    renderPanel();
    palPanel.classList.add('on');
    palBtn.setAttribute('aria-expanded', 'true');
  }
  function closePalette() {
    palPanel.classList.remove('on');
    palBtn.setAttribute('aria-expanded', 'false');
  }
  palBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (palPanel.classList.contains('on')) closePalette(); else openPalette();
  });
  document.addEventListener('click', function (e) {
    if (!palPanel.contains(e.target) && e.target !== palBtn) closePalette();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    closePalette();
    closeClearAsks();
  });

  var savedPal = 'studio';
  try {
    // same carry-over chain as the board; applyPalette writes it back under PAL_KEY
    var pal = localStorage.getItem(PAL_KEY);
    OLD_PAL_KEYS.forEach(function (k) {
      if (pal == null) pal = localStorage.getItem(k);
      localStorage.removeItem(k);
    });
    savedPal = pal || 'studio';
  } catch (e) {}
  applyPalette(savedPal);

  // keep two tabs of the same board in sync
  window.addEventListener('storage', function (e) {
    if (e.key !== STORE) return;
    state = load();
    render();
  });

  render();
</script>
</body>
</html>
