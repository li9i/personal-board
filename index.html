<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Personal Board</title>
<link id="favicon" rel="icon" type="image/svg+xml" />
<style>
  :root {
    --ivory: #FCFBF7;
    --slate: #141413;
    --clay: #D97757;
    --clay-d: #B85C3E;
    --clay-dd: #A85033;
    --oat: #E3DACC;
    --olive: #788C5D;
    --gray-50: #F0EEE6;
    --gray-200: #D1CFC5;
    --gray-500: #87867F;
    --gray-600: #63625C;
    --gray-800: #3D3D3A;
    --white: #ffffff;
    --ivory-50: #FEFEFD;

    --col-rule: rgba(20, 20, 19, 0.07);
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--ivory);
    color: var(--slate);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 1440px;
    margin: 0 auto;
    padding: 48px 32px 64px;
  }

  .composer .save,
  .composer .cancel,
  .clear-ask .yes,
  .toast button {
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    padding: 4.5px 12px 3.5px;
    cursor: pointer;
  }

  .clear-ask .no,
  .clearbtn {
    background: transparent;
    border: none;
    color: var(--gray-600);
    font-family: var(--mono);
    font-size: 11px;
    padding: 4.5px 2px 3.5px;
    cursor: pointer;
  }
  .clear-ask .no:hover { color: var(--slate); }

  .card-actions button,
  .notes-close,
  .tips-close {
    --side: 20px;
    width: var(--side);
    height: var(--side);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1;
    color: var(--gray-800);
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 4px;
    cursor: pointer;
  }
  .card-actions button:hover,
  .notes-close:hover,
  .tips-close:hover { border-color: var(--gray-500); color: var(--slate); }

  .composer textarea,
  .card textarea,
  .notes-edit {
    width: 100%;
    resize: vertical;
    background: var(--white);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.35;
    color: var(--slate);
    outline: none;
  }

  .palette-panel .cap,
  .card-menu .cap,
  .pal-back,
  .notes-col {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--gray-600);
  }

  .date,
  .notemark {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.02em;
  }

  header { margin-bottom: 0; }
  .head-of {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-500);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 6px 0 4px;
  }
  .hintline {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-500);
    margin: 10px 0 20px;
  }
  .hintline::before {
    color: var(--clay);
    margin-right: 6px;
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--ivory);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 0 4px;
    margin-bottom: 14px;
    border-bottom: 1.5px solid var(--gray-200);
  }
  .toolbar.stuck .toolpair { visibility: hidden; }
  .summary {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gray-800);
    letter-spacing: 0.01em;
    margin-right: auto;
  }
  .summary b { color: var(--slate); font-weight: 600; }
  .summary .dot { color: var(--gray-200); margin: 0 4px; }
  .fold {
    background: transparent;
    border: none;
    padding: 0;
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1;
    color: var(--clay);
    cursor: pointer;
    transform: rotate(-90deg);
  }
  body.folded .fold { transform: rotate(90deg); }
  .fold:hover { color: var(--clay-d); }
  .fold:focus-visible {
    outline: 2px solid var(--clay);
    outline-offset: 2px;
    border-radius: 2px;
  }
  body.folded header,
  body.folded .toolpair { display: none; }
  body.folded .toolbar .pill { width: auto; }
  body.folded .wrap { padding-top: 0; }
  .toolsep {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-200);
  }
  .tools,
  .toolpair {
    font-family: var(--mono);
    font-size: 11px;
    width: calc(12ch + 36px);
  }
  .tools {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }
  .pill {
    width: 100%;
    background: transparent;
    border: 1.5px solid var(--gray-200);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-800);
    padding: 6px 16px 5px;
    text-align: center;
    cursor: pointer;
  }
  .pill:hover,
  .pill[aria-expanded="true"] { border-color: var(--gray-500); }
  .pill:focus-visible {
    outline: none;
    border-color: var(--clay);
    color: var(--clay-d);
  }
  .toolpair {
    flex: none;
    display: flex;
    gap: 6px;
  }
  .toolpair .pill {
    flex: 1;
    padding-left: 6px;
    padding-right: 6px;
  }

  .palette-wrap { position: relative; }
  .palette-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 20;
    width: 268px;
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 10px;
    padding: 7px;
    box-shadow: 0 6px 22px rgba(20,20,19,0.10);
    display: none;
    flex-direction: column;
    gap: 1px;
    max-height: 72vh;
    overflow-y: auto;
  }
  .palette-panel.on { display: flex; }
  .palette-panel .cap { padding: 5px 7px 7px; }
  .pal {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    padding: 7px;
    border: 1.5px solid transparent;
    border-radius: 7px;
    background: transparent;
    cursor: pointer;
    text-align: left;
  }
  .pal:hover { background: var(--gray-50); }
  .pal:focus-visible { outline: 2px solid var(--clay); outline-offset: -2px; }
  .pal.on { border-color: var(--clay); }
  .pal-top { display: flex; align-items: baseline; gap: 8px; }
  .pal-name { font-size: 12px; color: var(--slate); }
  .pal-num {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--gray-600);
    font-variant-numeric: tabular-nums;
  }
  .pal-bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .pal-bar {
    height: 24px;
    border-radius: 3px;
    border: 1px solid var(--gray-200);
    border-top: 3px solid var(--r);
    background: var(--t);
  }
  .pal-cols {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--gray-600);
    line-height: 1.35;
  }
  .fam-strip { display: flex; flex-wrap: wrap; gap: 4px; }
  .fam-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--c);
    border: 1px solid rgba(20,20,19,0.12);
  }
  .pal-back {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 5px 7px 8px;
    text-align: left;
  }
  .pal-back:hover { color: var(--slate); }
  .pal-back .arrow { color: var(--clay); font-size: 13px; }

  .board {
    display: grid;
    grid-template-columns: 1fr 1px repeat(3, 1fr);
    gap: 16px;
    align-items: start;
  }
  .col-divider {
    align-self: stretch;
    width: 1px;
    background: linear-gradient(
      to bottom,
      transparent 0,
      var(--gray-200) 14%,
      var(--gray-200) 86%,
      transparent 100%
    );
  }
  .col {
    background: var(--fill, var(--ivory));
    border: 1.5px solid var(--gray-200);
    border-top: 3px solid var(--rule, var(--gray-200));
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 200px;
  }
  .col.dragover {
    outline: 2px dashed var(--drop, var(--gray-500));
    outline-offset: -6px;
    overflow: visible;
    background-image: linear-gradient(rgba(217, 119, 87, 0.10), rgba(217, 119, 87, 0.10));
  }
  .col-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 14px 14px 10px;
    border-bottom: 1.5px solid var(--col-rule);
  }
  .col-head h2,
  .notes-col {
    color: var(--head, var(--slate));
  }
  .col-head .glyph {
    display: flex;
    flex: none;
    align-self: center;
    margin-top: 1px;
    color: var(--head, var(--slate));
  }
  .col-head .glyph svg { width: 16px; height: 16px; }
  .col-head h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 17px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .col-head .count,
  .notes-head .count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1;
    color: var(--gray-800);
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: 999px;
    padding: 4px 8px 3px;
    min-width: 26px;
    text-align: center;
  }
  .col-add {
    padding: 10px 10px 0;
  }
  .col-body {
    padding: 6px 10px 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-height: 60px;
    position: relative;
  }
  .dropline {
    position: absolute;
    left: -18px;
    right: -18px;
    height: 1px;
    transform: translateY(-50%);
    background: var(--drop, var(--gray-500));
    border-radius: 1px;
    pointer-events: none;
  }
  .empty {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-500);
    text-align: center;
    padding: 18px 6px;
    user-select: none;
  }
  .col-foot {
    border-top: 1.5px solid var(--col-rule);
    padding: 8px 10px 10px;
  }
  .addbtn {
    width: 100%;
    background: transparent;
    border: 1.5px dashed rgba(20, 20, 19, 0.16);
    border-radius: 8px;
    color: var(--gray-600);
    font-family: var(--mono);
    font-size: 11px;
    padding: 8.5px 10px 7.5px;
    cursor: pointer;
    text-align: left;
  }
  .addbtn:hover { border-color: var(--clay); color: var(--clay-d); }
  .addbtn:focus-visible {
    outline: none;
    border-color: var(--clay);
    color: var(--clay-d);
  }

  .composer { display: none; }
  .composer.on { display: block; }
  .composer textarea {
    min-height: 58px;
    border: 1.5px solid var(--gray-500);
    border-radius: 8px;
    padding: 9px 10px;
  }
  .composer textarea:focus { border-color: var(--clay); }
  .composer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 7px;
  }
  .composer-acts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .composer .save,
  .composer .cancel { padding: 5.5px 12px 4.5px; }
  .composer .save {
    background: var(--slate);
    color: var(--ivory);
    border: 1.5px solid var(--slate);
  }
  .composer .save:hover { background: var(--gray-800); }
  .composer .cancel {
    background: transparent;
    color: var(--gray-600);
    border: 1.5px solid var(--gray-200);
  }
  .composer .cancel:hover { border-color: var(--gray-500); color: var(--slate); }
  .composer .key {
    margin-left: 6px;
    opacity: 0.6;
  }
  .burst {
    background: transparent;
    border: 1.5px dashed rgba(20, 20, 19, 0.16);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1;
    color: var(--gray-600);
    padding: 4px 8px 3px;
  }
  .burst.on {
    border-style: solid;
    border-color: var(--clay);
    color: var(--clay-d);
  }
  .composer .burst {
    margin-left: auto;
    cursor: pointer;
  }
  .composer .burst:not(.on):hover { border-color: var(--gray-500); color: var(--slate); }

  .clear-row { margin-top: 7px; }
  .clear-row.off { display: none; }
  .clearbtn {
    display: block;
    margin-left: auto;
  }
  .clearbtn:hover { color: var(--clay-d); }
  .clear-ask {
    display: none;
    align-items: center;
    gap: 8px;
  }
  .clear-ask.on { display: flex; }
  .clear-ask .q {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gray-800);
  }
  .clear-ask .yes {
    margin-left: auto;
    background: var(--white);
    color: var(--clay-d);
    border: 1.5px solid var(--clay-d);
  }
  .clear-ask .yes:hover { box-shadow: 0 0 0 1.5px var(--clay-d); }

  .card {
    background: var(--card, var(--white));
    border: 1.5px solid var(--gray-200);
    border-radius: 8px;
    padding: 10px 11px 8px;
    cursor: grab;
    box-shadow: 0 1px 2px rgba(20,20,19,0.05);
    transition: border-color 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
  }
  .card:hover { border-color: var(--gray-500); box-shadow: 0 2px 5px rgba(20,20,19,0.09); }
  .card:active { cursor: grabbing; }
  .card.pinned { border-color: var(--rule, var(--gray-200)); }

  .card.low {
    background: rgba(255, 255, 255, 0.55);
    box-shadow: none;
    --fade: 0.42;
  }
  .card.dragging { opacity: .4; }
  .ctext {
    font-size: 13px;
    line-height: 1.35;
    color: var(--text, var(--slate));
    opacity: var(--fade, 1);
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 7px;
  }
  .ctext code {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gray-800);
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: 4px;
    padding: 0 3px;
    line-height: 1.15;
  }
  .ctext a {
    color: inherit;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
    overflow-wrap: anywhere;
  }
  .ctext a:hover {
    text-decoration-color: var(--clay-d);
    text-decoration-thickness: 2px;
  }
  .ctext a:focus-visible {
    outline: 2px solid var(--clay-d);
    outline-offset: 1px;
    border-radius: 2px;
  }
  .ctext > * { margin: 0; }
  .ctext > * + * { margin-top: 7px; }
  .ctext h1, .ctext h2, .ctext h3,
  .ctext h4, .ctext h5, .ctext h6 {
    font-weight: 600;
    font-size: 13px;
    line-height: 1.25;
  }
  .ctext h1 { font-size: 16px; }
  .ctext h2 { font-size: 15px; }
  .ctext h3 { font-size: 14px; }
  .ctext strong { font-weight: 600; }
  .ctext blockquote {
    border-left: 2px solid var(--gray-500);
    padding-left: 8px;
  }
  .ctext .callout {
    border-left: 3px solid var(--c);
    padding-left: 9px;
  }
  .ctext .callout-head {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--c);
    font-weight: 600;
    line-height: 1.3;
  }
  .ctext .callout-head .glyph { display: flex; flex: none; }
  .ctext .callout-head svg { width: 14px; height: 14px; }
  .ctext .callout-body { margin-top: 4px; }
  .ctext .callout-body > * { margin: 0; }
  .ctext .callout-body > * + * { margin-top: 5px; }
  .ctext .callout.note,
  .ctext .callout.info,
  .ctext .callout.todo { --c: #466683; }
  .ctext .callout.abstract { --c: #2C6D68; }
  .ctext .callout.success,
  .ctext .callout.tip { --c: #4C6B3A; }
  .ctext .callout.question,
  .ctext .callout.warning { --c: #7F5D14; }
  .ctext .callout.failure,
  .ctext .callout.danger,
  .ctext .callout.bug { --c: #A6433B; }
  .ctext .callout.example { --c: #6B5487; }
  .ctext .callout.quote { --c: var(--gray-600); }
  .ctext hr {
    border: 0;
    border-top: 1px solid var(--gray-200);
  }
  .ctext ul, .ctext ol { padding-left: 18px; }
  .ctext li::marker { color: var(--gray-600); }
  .ctext li.task {
    list-style: none;
    display: flex;
    align-items: flex-start;
  }
  .ctext li.task .tickbox {
    margin-left: -18px;
    margin-right: 4px;
  }
  .task-what { min-width: 0; }
  .tickbox {
    flex: none;
    width: 14px;
    height: 14px;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    color: var(--white);
    background: none;
    border: 1.5px solid var(--gray-500);
    border-radius: 4px;
    cursor: pointer;
  }
  .tickbox:hover { border-color: var(--slate); }
  .tickbox[aria-checked="true"] {
    background: var(--clay-d);
    border-color: var(--clay-d);
  }
  .tickbox:focus-visible {
    outline: 2px solid var(--clay-d);
    outline-offset: 1px;
  }
  .tickbox .glyph { display: flex; }
  .tickbox svg {
    width: 11px;
    height: 11px;
    stroke-width: 3.5;
  }
  .ctext pre {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gray-800);
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: 4px;
    padding: 6px 7px;
    line-height: 1.35;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .ctext pre code {
    font-size: inherit;
    line-height: inherit;
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
  }
  .card textarea {
    min-height: 52px;
    border: 1.5px solid var(--clay);
    border-radius: 6px;
    padding: 7px 8px;
    margin-bottom: 7px;
  }
  .card-bot {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .card-bot > .glyph {
    display: flex;
    flex: none;
    width: 11px;
    height: 11px;
    margin-bottom: 1px;
    color: var(--gray-600);
  }
  .card-bot > .glyph svg {
    width: 11px;
    height: 11px;
  }
  .lowbtn {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 18px;
    height: 18px;
    margin: -4px 0;
    padding: 0;
    background: none;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
  }
  .lowbtn:focus-visible { outline: 2px solid var(--clay); outline-offset: -1px; }
  .lowbtn:hover { background: rgba(20, 20, 19, 0.08); }
  .lowdot {
    display: flex;
    width: 16px;
    height: 16px;
    color: var(--ink, var(--gray-500));
    transition: opacity 120ms ease;
  }
  .lowdot svg {
    width: 16px;
    height: 16px;
    stroke-width: 1.8;
    stroke-linecap: butt;
  }
  .card.low .lowdot { color: var(--gray-500); }
  .card:not(.low) .lowdot { opacity: 0; }
  .card:hover .lowdot,
  .card:focus-within .lowdot { opacity: 1; }
  @media (hover: none) {
    .card:not(.low) .lowdot { opacity: 1; }
  }
  .date {
    color: var(--gray-800);
    opacity: var(--fade, 1);
  }
  .notemark {
    color: var(--gray-600);
    opacity: var(--fade, 1);
    margin-left: 6px;
    cursor: pointer;
  }
  .notemark:hover { color: var(--slate); }
  .notemark:hover .words {
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }
  .notemark.add {
    opacity: 0;
    transition: opacity 120ms ease;
  }
  .card:hover .notemark.add,
  .card:focus-within .notemark.add { opacity: var(--fade, 1); }

<script>
  var COLUMNS = [
    { key: 'remember', label: 'Remember', mark: 'rail',
      prompt: 'What must you not forget?',
      tally: 'to remember',
      divider: true,
      fill: 'var(--ivory)', rule: 'var(--gray-200)', drop: 'var(--gray-500)',
      card: 'var(--ivory-50)', text: 'var(--gray-600)', head: 'var(--gray-800)' },
    { key: 'backlog', label: 'Backlog', mark: 'mise', prompt: 'What needs doing?',
      tally: 'in backlog', low: true, palette: true },
    { key: 'now', label: 'Now', mark: 'pan', prompt: "What's underway?",
      tally: 'going on now', palette: true },
    { key: 'accomplished', label: 'Accomplished', mark: 'served',
      prompt: 'What got done?', tally: 'accomplished',
      clearable: true, palette: true }
  ];
  var KEYS = COLUMNS.map(function (c) { return c.key; });
  var PAL_COLUMNS = COLUMNS.filter(function (c) { return c.palette; });

  var STORE = 'personal.board.v1';
  var PAL_KEY = 'personal.palette.v1';
  var TURN_KEY = 'personal.palturn.v1';
  var BURST_KEY = 'personal.burst.v1';
  var OLD_STORES = ['todo.board.v1', 'backlog.board.v1'];
  var OLD_PAL_KEYS = ['todo.palette.v1', 'backlog.palette.v1'];
  var GONE_KEY = 'cut';
  var GMAIL = 'https://mail.google.com/mail/?view=cm&fs=1';

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function textBtn(cls, label) {
    var b = el('button', cls, label);
    b.type = 'button';
    return b;
  }

  var MARKS = {
    rail: 'M2.5 5h19 M7 5v9.5h4.5V5 M13.5 5v14h4.5V5',
    mise: 'M2.5 9h9a4.5 4.5 0 0 1-9 0Z M15.5 11h6a3 3 0 0 1-6 0Z',
    pan: 'M2.5 9h11v2.5a4 4 0 0 1-4 4h-3a4 4 0 0 1-4-4V9Z M13.5 10.25h8',
    served: 'M2.5 17h19 M5 17a7 7 0 0 1 14 0 M12 10V8',
    down: 'M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8 M8 11l4 4 4-4 M12 2v13',
    mail: 'M2.5 5.5h19v13h-19Z M2.5 6l9.5 7 9.5-7',
    bin: 'M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6 '
       + 'M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2',
    pin: 'M12 17v5 M9 4.5V10a3 3 0 0 1-1.66 2.68l-1.68.84A2 2 0 0 0 4.5 15.3V17h15v-1.7'
       + 'a2 2 0 0 0-1.16-1.82l-1.68-.84A3 3 0 0 1 15 10V4.5 M8 2h8',
    ring: 'M12 7.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z',
    sun: 'M12 7.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z M12 2.25v2.75 M12 19v2.75 '
       + 'M2.25 12h2.75 M19 12h2.75 M5.11 5.11l1.94 1.94 M16.95 16.95l1.94 1.94 '
       + 'M5.11 18.89l1.94-1.94 M16.95 7.05l1.94-1.94',
    tick: 'M20 6L9 17l-5-5',
    note: 'M12 20h9 M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z',
    abstract: 'M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2 '
       + 'M9 2h6a1 1 0 0 1 1 1v2H8V3a1 1 0 0 1 1-1Z M8 12h8 M8 16h5',
    info: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M12 16v-5 M12 8h.01',
    todo: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M8 12l3 3 5-6',
    tip: 'M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 '
       + '2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5Z',
    success: 'M20 6 9 17l-5-5',
    question: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M9.1 9.5a3 3 0 0 1 5.8 1c0 2-3 3-3 3 '
       + 'M12 17h.01',
    warning: 'M10.3 3.6 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z '
       + 'M12 9v4 M12 17h.01',
    failure: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M15 9l-6 6 M9 9l6 6',
    danger: 'M13 2 3 14h9l-1 8 10-12h-9l1-8Z',
    bug: 'M12 20a6 6 0 0 0 6-6v-3a6 6 0 0 0-12 0v3a6 6 0 0 0 6 6Z M8.5 3 10 4.6 '
       + 'M15.5 3 14 4.6 M3 9h3 M18 9h3 M3 15.5h3 M18 15.5h3 M12 8v12',
    example: 'M8 6h13 M8 12h13 M8 18h13 M3.5 6h.01 M3.5 12h.01 M3.5 18h.01',
    quote: 'M6 17h3l2-4V7H5v6h3Z M14 17h3l2-4V7h-6v6h3Z'
  };

  function icon(name) {
    var box = el('span', 'glyph');
    box.setAttribute('aria-hidden', 'true');
    box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
      + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="' + MARKS[name] + '"/></svg>';
    return box;
  }

  function iconBtn(label, title, cls) {
    var b = textBtn(cls, label);
    b.title = title;
    b.setAttribute('aria-label', title);
    return b;
  }

  function pick(list, test) {
    for (var i = 0; i < list.length; i++) {
      if (test(list[i])) return list[i];
    }
    return null;
  }

  function indexOfId(list, id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) return i;
    }
    return -1;
  }

  function plural(n, word) {
    return n + ' ' + word + (n === 1 ? '' : 's');
  }

  function colOf(key) {
    return pick(COLUMNS, function (c) { return c.key === key; });
  }

  function uid() {
    return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function fmtDate(ms) {
    return new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function lsGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  function lsSet(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (e) {
      console.warn('Could not save to localStorage:', e);
    }
  }

  function lsDel(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  function readCarried(key, olds) {
    var current = lsGet(key);
    if (current != null) return current;
    var carried = null;
    olds.forEach(function (old) {
      if (carried == null) carried = lsGet(old);
      lsDel(old);
    });
    if (carried != null) lsSet(key, carried);
    return carried;
  }

  var state = load();
  var drag = null;
  var lastDeleted = null;
  var toastTimer = null;

  function blank() {
    var cols = {};
    KEYS.forEach(function (k) { cols[k] = []; });
    return { cols: cols };
  }

  function load() {
    var fresh = blank();
    try {
      var raw = readCarried(STORE, OLD_STORES);
      if (!raw) return fresh;
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.cols) return fresh;
      var cols = parsed.cols;
      if (Array.isArray(cols.later) && !Array.isArray(cols.accomplished)) {
        cols.accomplished = cols.later;
      }
      if (Array.isArray(cols.waiting) && !Array.isArray(cols.remember)) {
        cols.remember = cols.waiting;
      }
      KEYS.forEach(function (k) {
        fresh.cols[k] = normalize(cols[k]);
      });
      fresh.cols.backlog = fresh.cols.backlog.concat(normalize(cols[GONE_KEY]));
      orderGroups(fresh.cols);
    } catch (e) { }
    return fresh;
  }

  function normalize(list) {
    if (!Array.isArray(list)) return [];
    return list.filter(function (c) {
      return c && typeof c.text === 'string';
    }).map(function (c) {
      return {
        id: c.id || uid(),
        text: c.text,
        created: typeof c.created === 'number' ? c.created : Date.now(),
        pinned: c.pinned === true,
        low: (c.low === true || c.swept === true) && c.pinned !== true,
        notes: normalize(c.notes)
      };
    });
  }

  function newItem(text) {
    return { id: uid(), text: text, created: Date.now(), pinned: false,
      low: false, notes: [] };
  }

  function orderGroups(cols) {
    KEYS.forEach(function (k) {
      var list = cols[k];
      if (!colOf(k).low) {
        list.forEach(function (c) { c.low = false; });
      }
      cols[k] = list.filter(function (c) { return c.pinned; })
        .concat(list.filter(function (c) { return !c.pinned && !c.low; }))
        .concat(list.filter(function (c) { return !c.pinned && c.low; }));
    });
  }

  function countOf(list) {
    var down = list.filter(function (c) { return c.low; }).length;
    return down ? (list.length - down) + '+' + down : String(list.length);
  }

  function save() {
    lsSet(STORE, JSON.stringify(state));
  }

  function commit() {
    orderGroups(state.cols);
    save();
    render();
  }

  function find(id) {
    for (var i = 0; i < KEYS.length; i++) {
      var list = state.cols[KEYS[i]];
      var at = indexOfId(list, id);
      if (at >= 0) return { col: KEYS[i], index: at, card: list[at] };
    }
    return null;
  }

  var burst = lsGet(BURST_KEY) === '1';

  function makeComposer(host, spec) {
    var add = textBtn('addbtn', spec.add);
    var box = el('div', 'composer');
    var ta = el('textarea');
    ta.rows = 2;
    ta.placeholder = spec.placeholder;
    var saveBtn = textBtn('save', 'Add');
    saveBtn.appendChild(el('span', 'key', 'ctrl ⏎'));
    var cancelBtn = textBtn('cancel', 'cancel');
    cancelBtn.appendChild(el('span', 'key', 'esc'));
    var burstBtn = textBtn('burst', 'burst');
    var row = el('div', 'composer-row');
    var acts = el('div', 'composer-acts');
    acts.appendChild(saveBtn);
    acts.appendChild(cancelBtn);
    row.appendChild(acts);
    row.appendChild(burstBtn);
    box.appendChild(ta);
    box.appendChild(row);
    host.appendChild(add);
    host.appendChild(box);

    function open() {
      closeComposers();
      showBurst();
      box.classList.add('on');
      add.style.display = 'none';
      ta.focus();
    }

    function close() {
      box.classList.remove('on');
      add.style.display = '';
      ta.value = '';
    }

    function showBurst() {
      burstBtn.classList.toggle('on', burst);
      burstBtn.setAttribute('aria-pressed', burst ? 'true' : 'false');
      burstBtn.title = burst
        ? 'Burst mode on: the box stays open for the next card'
        : 'Burst mode off: the box closes once the card is in';
    }

    function submit() {
      var text = ta.value.trim();
      if (!text) { close(); return; }
      ta.value = '';
      spec.onAdd(text);
      if (burst) { ta.focus(); return; }
      close();
      add.focus();
    }

    box.close = close;

    add.addEventListener('click', open);
    saveBtn.addEventListener('click', submit);
    cancelBtn.addEventListener('click', close);
    burstBtn.addEventListener('click', function () {
      burst = !burst;
      lsSet(BURST_KEY, burst ? '1' : '0');
      showBurst();
      ta.focus();
    });
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault();
        submit();
      } else if (e.key === 'Escape') {
        e.preventDefault();

      var box = cards[i].getBoundingClientRect();
      if (y < box.top + box.height / 2) { at = i; break; }

    var top = body.querySelectorAll('.card.pinned:not(.dragging)').length;
    var foot = cards.length - body.querySelectorAll('.card.low:not(.dragging)').length;
    if (drag && drag.pinned) return Math.min(at, top);

  function codeSpans(s) {
    return s.split(/`([^`\n]+)`/).map(function (part, i) {

  }

  var LINK_RE = /(\[[^\[\]\n]+\]\([^()\s]+\)|https?:\/\/[^\s<>]+|mailto:[^\s<>]+)/i;
  var LABELLED = /^\[([^\[\]\n]+)\]\(([^()\s]+)\)$/;
  var OPENABLE = /^(https?:\/\/|mailto:)/i;

  function safeHref(url) {
    return OPENABLE.test(url) ? url : null;
  }

  function trimTail(url) {
    var opens = 0;
    var closes = 0;
    var end = url.length;
    var i;
    for (i = 0; i < url.length; i++) {
      if (url.charAt(i) === '(') opens++;
      else if (url.charAt(i) === ')') closes++;
    }
    while (end) {
      var last = url.charAt(end - 1);
      if ('.,;:!?\'"'.indexOf(last) >= 0) end--;
      else if (last === ')' && closes > opens) { closes--; end--; }
      else break;
    }
    return url.slice(0, end);
  }

  function linkSpans(s) {
    var out = [];
    s.split(LINK_RE).forEach(function (part, i) {
      if (!part) return;
      if (i % 2 === 0) { out.push({ text: part, code: false }); return; }
      var m = LABELLED.exec(part);
      var shown = m ? m[1] : trimTail(part);
      var href = safeHref(m ? m[2] : shown);
      if (!href || !shown.trim()) { out.push({ text: part, code: false }); return; }
      out.push({ text: shown, href: href });
      if (!m && part.length > shown.length) {
        out.push({ text: part.slice(shown.length), code: false });
      }
    });
    return out;
  }

    { tag: 'strong', re: /\*\*([^\n]+?)\*\*/ },
    { tag: 'em', re: /\*([^*\n]+)\*/ },
    { tag: 'del', re: /~~([^\n]+?)~~/ }
  ];

    return markSpans(s, 0);
  }

  function markSpans(s, at) {
    if (at === EMPHASIS.length) return s === '' ? [] : [{ text: s, code: false }];
    var mark = EMPHASIS[at];
    var out = [];
    s.split(mark.re).forEach(function (part, i) {
      if (part === '') return;
      if (i % 2 === 1) out.push({ text: part, tag: mark.tag });
      else markSpans(part, at + 1).forEach(function (seg) { out.push(seg); });

  var FENCE = /^ {0,3}(`{3,})\s*([^`]*)$/;

  var HEADING = /^ {0,3}(#{1,6})\s+(.*)$/;
  var QUOTE = /^ {0,3}>\s?(.*)$/;
  var BULLET = /^ {0,3}[-*+]\s+(.*)$/;
  var NUMBER = /^ {0,3}(\d+)[.)]\s+(.*)$/;

  var CALLOUTS = {
    note: 'note',
    abstract: 'abstract', summary: 'abstract', tldr: 'abstract',
    info: 'info',
    todo: 'todo',
    tip: 'tip', hint: 'tip', important: 'tip',
    success: 'success', check: 'success', done: 'success',
    question: 'question', help: 'question', faq: 'question',
    warning: 'warning', attention: 'warning',
    failure: 'failure', fail: 'failure', missing: 'failure',
    danger: 'danger', caution: 'danger', error: 'danger',
    bug: 'bug',
    example: 'example',

  function calloutOf(s) {
    var at = s.indexOf('\n');
    var m = CALLOUT.exec(at === -1 ? s : s.slice(0, at));
    var type = m && CALLOUTS[m[1].toLowerCase()];
    if (!type) return null;
    return {
      type: type,
      title: m[2] || m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase(),
      body: at === -1 ? '' : s.slice(at + 1)
    };

  function blocks(s, from) {
    var out = [];
    var open = null;
    var lines = s.split('\n');
    var off = from || 0;
    function start(b) { out.push(b); open = b; }
    lines.forEach(function (line, i) {
      var m;
      if (open && open.kind === 'code') {
        if (closesFence(line, open.width)) { open = null; return; }
        open.lines.push(line);
        return;
      }
      if ((m = FENCE.exec(line)) && fenceCloses(lines, i, m[1].length)) {
        start({ kind: 'code', width: m[1].length, lines: [] });
        return;
      }
      if (RULE.test(line)) { out.push({ kind: 'rule' }); open = null; return; }
      if ((m = HEADING.exec(line))) {
        out.push({ kind: 'heading', level: m[1].length, text: m[2] });
        open = null;
        return;
      }
      if ((m = QUOTE.exec(line))) {
        if (open && open.kind === 'quote') open.text += '\n' + m[1];
        else start({ kind: 'quote', text: m[1], at: off + i });
        return;

      var bullet = BULLET.exec(line);

        var ordered = !bullet;

        var item = { text: task ? task[2] : (ordered ? m[2] : m[1]),
          done: task ? task[1] === 'x' : null, line: off + i };

          open.items.push(item);

          start({ kind: 'list', ordered: ordered, start: ordered ? Number(m[1]) : 1,
            items: [item] });
        }
        return;

      if (!line.trim()) { open = null; return; }
      if (open && open.kind === 'para') open.text += '\n' + line;
      else start({ kind: 'para', text: line });
    });

  }

  function closesFence(line, width) {

    var i;
    for (i = at + 1; i < lines.length; i++) {

        list.appendChild(li);
      });
      return list;
    }
    if (b.kind === 'quote') {
      var call = calloutOf(b.text);
      if (call) return makeCallout(call, b.at + 1, onToggle);
    }
    var box = document.createElement(b.kind === 'heading' ? 'h' + b.level
      : b.kind === 'quote' ? 'blockquote' : 'p');

    return box;

  function makeCallout(call, from, onToggle) {
    var box = el('div', 'callout ' + call.type);
    var head = el('div', 'callout-head');
    head.appendChild(icon(call.type));
    head.appendChild(el('span', '', call.title));
    box.appendChild(head);
    if (call.body.trim()) {
      var body = el('div', 'callout-body');
      blocks(call.body, from).forEach(function (b) {
        body.appendChild(makeBlock(b, onToggle));

    box.addEventListener('click', function () { onToggle(task.line); });
    return box;

  function unquoted(line) {
    var m;
    while ((m = QUOTE.exec(line))) line = m[1];

  function toggleTask(item, at) {
    var lines = item.text.split('\n');
    var m = TASK.exec(unquoted(lines[at]));

    lines[at] = lines[at].replace(BOX, m[1] === 'x' ? '[ ]' : '[x]');
    item.text = lines.join('\n');

        a.rel = 'noopener noreferrer';
        a.draggable = false;
        a.textContent = seg.text;
        if (seg.text !== seg.href) a.title = seg.href;
        el.appendChild(a);
      } else if (seg.code) {
        var code = document.createElement('code');
        code.textContent = seg.text;
        el.appendChild(code);
      } else if (seg.tag) {
        var mark = document.createElement(seg.tag);
        mark.textContent = seg.text;
        el.appendChild(mark);
      } else {
        el.appendChild(document.createTextNode(seg.text));
      }
    });
  }

  function anchorNotes(at) {
    var pad = getComputedStyle(whatEdit);
    var box = whatEdit.getBoundingClientRect();
    var panel = notesPanel.getBoundingClientRect();
    var dx = box.left + whatEdit.clientLeft + parseFloat(pad.paddingLeft) - panel.left;
    var dy = box.top + whatEdit.clientTop + parseFloat(pad.paddingTop) - panel.top;
    var left = Math.max(EDGE, Math.min(at.left - dx, window.innerWidth - LEAST - EDGE));
    var top = Math.max(EDGE, Math.min(at.top - dy, window.innerHeight - LEAST - EDGE));
    var wide = Math.min(panel.width, window.innerWidth - left - EDGE);
    var tall = Math.min(panel.height, window.innerHeight - top - EDGE);

    notesPanel.classList.add('placed');
    notesPanel.style.left = left + 'px';
    notesPanel.style.top = top + 'px';
    notesPanel.style.width = wide + 'px';
    notesPanel.style.height = tall + 'px';
    var deep = Math.max(90, tall - HEAD_ROOM);

  function rgbOf(hex) {
    var h = hex.replace('#', '');
    return [0, 1, 2].map(function (i) { return parseInt(h.substr(i * 2, 2), 16); });
  }

  function shadeOf(hex, k) {
    var far = k == null ? SHADE : k;
    return '#' + rgbOf(hex).map(function (v) {
      var m = Math.round(v * (1 - far));
      return ('0' + m.toString(16)).slice(-2);
    }).join('').toUpperCase();
  }

  function lumOf(hex) {
    var parts = rgbOf(hex).map(function (v) {
      var c = v / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * parts[0] + 0.7152 * parts[1] + 0.0722 * parts[2];
  }

  function ratioOf(a, b) {
    var x = lumOf(a);
    var y = lumOf(b);
    return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
  }

  function inkOf(hex) {
    var fill = tintOf(hex);
    var ink = hex;
    var far = 0;
    while (ratioOf(ink, fill) < MARK_RATIO && far < 1) {
      far += 0.01;
      ink = shadeOf(hex, far);
    }
    return ink;
  }

  function tintOf(hex) {
    var under = rgbOf(IVORY);
    return '#' + rgbOf(hex).map(function (v, i) {
      var m = Math.round(v * TINT + under[i] * (1 - TINT));
      return ('0' + m.toString(16)).slice(-2);
    }).join('').toUpperCase();
  }

  function setFavicon(colors) {
    var link = document.getElementById('favicon');
    if (!link) return;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
      '<rect width="32" height="32" rx="7" fill="' + IVORY + '"/>';
    colors.forEach(function (c, i) {
      svg += '<rect x="' + (4 + i * 9) + '" y="5" width="6" height="22" rx="2" fill="' + c + '"/>';
    });
    link.href = 'data:image/svg+xml,' + encodeURIComponent(svg + '</svg>');
  }

  var tone = {};
  COLUMNS.forEach(function (c) {
    tone[c.key] = { fill: c.fill, rule: c.rule, drop: c.drop };
  });

  function paint(target, key) {
    target.style.setProperty('--fill', tone[key].fill);
    target.style.setProperty('--rule', tone[key].rule);
    target.style.setProperty('--drop', tone[key].drop);
    if (tone[key].ink) target.style.setProperty('--ink', tone[key].ink);
    else target.style.removeProperty('--ink');
    ['card', 'text', 'head'].forEach(function (name) {
      var own = colOf(key)[name];
      if (own) target.style.setProperty('--' + name, own);
      else target.style.removeProperty('--' + name);
    });
  }

  function turned(list, n) {
    return n % 2 ? [list[1], list[0]].concat(list.slice(2)) : list.slice();
  }

  function colorsOf(p) {
    return p.id === currentPal ? turned(p.colors, palTurn) : p.colors;
  }
  function namesOf(p) {
    return turned(p.names.split(' · '), p.id === currentPal ? palTurn : 0).join(' · ');
  }

  function applyPalette(id, turn) {
    var p = pick(PALETTES, function (x) { return x.id === id; }) ||
      pick(PALETTES, function (x) { return x.id === DEFAULT_PAL; });
    currentPal = p.id;
    palTurn = ((turn || 0) % 2 + 2) % 2;
    var colors = colorsOf(p);
    PAL_COLUMNS.forEach(function (c, i) {
      tone[c.key] = {
        fill: tintOf(colors[i]), rule: colors[i], drop: shadeOf(colors[i]),
        ink: inkOf(colors[i])
      };
    });
    KEYS.forEach(function (k) { paint(views[k].el, k); });
    redrawNotes();
    setFavicon(colors);
    lsSet(PAL_KEY, p.id);
    lsSet(TURN_KEY, String(palTurn));
  }

  var palPanel = document.getElementById('palettePanel');
  var palBtn = document.getElementById('paletteBtn');
  var palView = null;
  var currentPal = DEFAULT_PAL;
  var palTurn = 0;

  function palButton(spec) {
    var b = textBtn('pal');
    var top = el('span', 'pal-top');
    top.appendChild(el('span', 'pal-name', spec.name));
    top.appendChild(el('span', 'pal-num', spec.num));
    b.appendChild(top);
    b.appendChild(spec.strip);
    b.appendChild(el('span', 'pal-cols', spec.note));
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      spec.onClick();
    });
    return b;
  }

  function palBars(colors) {
    var bars = el('span', 'pal-bars');
    colors.forEach(function (c) {
      var bar = el('span', 'pal-bar');
      bar.style.setProperty('--r', c);
      bar.style.setProperty('--t', tintOf(c));
      bars.appendChild(bar);
    });
    return bars;
  }

  function famDots(f) {
    var dots = el('span', 'fam-strip');
    f.palettes.forEach(function (p) {
      var dot = el('span', 'fam-dot');
      dot.style.setProperty('--c', p.lead);
      dots.appendChild(dot);
    });
    return dots;
  }

  function renderPanel() {
    palPanel.innerHTML = '';
    if (palView) renderFamily(pick(FAMILIES, function (f) { return f.id === palView; }));
    else renderFamilies();
  }

  function renderFamilies() {
    palPanel.appendChild(el('div', 'cap', 'Sanzo Wada · 24 combinations, each with a green'));
    FAMILIES.forEach(function (f) {
      var b = palButton({
        name: f.name,
        num: String(f.palettes.length),
        strip: famDots(f),
        note: f.note,
        onClick: function () { palView = f.id; renderPanel(); }
      });
      b.dataset.fam = f.id;
      if (pick(f.palettes, function (p) { return p.id === currentPal; })) b.classList.add('on');
      palPanel.appendChild(b);
    });
  }

  function renderFamily(f) {
    var back = textBtn('pal-back');
    back.appendChild(el('span', 'arrow', '‹'));
    back.appendChild(document.createTextNode(' all families · ' + f.name));
    back.addEventListener('click', function (e) {
      e.stopPropagation();
      palView = null;
      renderPanel();
    });
    palPanel.appendChild(back);
    palPanel.appendChild(el('div', 'cap', 'Click the one on the board again to swap Backlog and Now'));

    f.palettes.forEach(function (p) {
      var b = palButton({
        name: p.name,
        num: p.num ? 'no. ' + p.num : 'default',
        strip: palBars(colorsOf(p)),
        note: namesOf(p),
        onClick: function () {
          applyPalette(p.id, p.id === currentPal ? palTurn + 1 : 0);
          markPalettes();
        }
      });
      b.dataset.pal = p.id;
      if (p.id === currentPal) b.classList.add('on');
      palPanel.appendChild(b);
    });
  }

  function markPalettes() {
    palPanel.querySelectorAll('.pal').forEach(function (b) {
      var p = pick(PALETTES, function (x) { return x.id === b.dataset.pal; });
      if (!p) return;
      b.classList.toggle('on', p.id === currentPal);
      b.replaceChild(palBars(colorsOf(p)), b.querySelector('.pal-bars'));
      b.querySelector('.pal-cols').textContent = namesOf(p);
    });
  }

  function openPalette() {
    palView = null;
    renderPanel();
    palPanel.classList.add('on');
    palBtn.setAttribute('aria-expanded', 'true');
  }
  function closePalette() {
    palPanel.classList.remove('on');
    palBtn.setAttribute('aria-expanded', 'false');
  }
  palBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (palPanel.classList.contains('on')) closePalette(); else openPalette();
  });
  document.addEventListener('click', function (e) {
    if (!palPanel.contains(e.target) && e.target !== palBtn) closePalette();
    if (!menu.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var owner = menuOwner;
    if (closeMenu()) { owner.focus(); return; }
    closePalette();
    closeClearAsks();
    closeNotes();
    closeTips();
  });

  applyPalette(readCarried(PAL_KEY, OLD_PAL_KEYS) || DEFAULT_PAL,
    Number(lsGet(TURN_KEY)) || 0);

  var toolbar = document.getElementById('toolbar');
  var markStuck = function () {
    toolbar.classList.toggle('stuck', toolbar.getBoundingClientRect().top <= 0);
  };
  window.addEventListener('scroll', markStuck, { passive: true });
  markStuck();

  var FOLD_KEY = 'personal.fold.v1';
  var tools = document.getElementById('tools');
  var foldBtn = document.getElementById('foldBtn');
  var setFold = function (on) {
    document.body.classList.toggle('folded', on);
    foldBtn.setAttribute('aria-expanded', on ? 'false' : 'true');
    if (on) {
      closePalette();
      toolbar.appendChild(tipsBtn);
    } else {
      tools.insertBefore(tipsBtn, tools.firstChild);
    }
    markStuck();
  };
  foldBtn.addEventListener('click', function () {
    var on = !document.body.classList.contains('folded');
    lsSet(FOLD_KEY, on ? '1' : '0');
    setFold(on);
  });
  setFold(lsGet(FOLD_KEY) === '1');

  window.addEventListener('storage', function (e) {
    if (e.key !== STORE) return;
    state = load();
    render();
  });

  render();
</script>
</body>
</html>
