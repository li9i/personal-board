      if (i % 2 === 0) { out.push({ text: part, code: false }); return; }
      var m = LABELLED.exec(part);
      var shown = m ? m[1] : trimTail(part);
      var href = safeHref(m ? m[2] : shown);
      // an address that this board will not open is not an address, and neither
      // is an empty label. The two stay as you wrote them
      if (!href || !shown.trim()) { out.push({ text: part, code: false }); return; }
      out.push({ text: shown, href: href });
      // what trimTail returned follows the link as the prose that it is
      if (!m && part.length > shown.length) {
        out.push({ text: part.slice(shown.length), code: false });
      }
    });
    return out;
  }

  // Find the marked runs in a run of plain text: **bold**, *italic* and
  // ~~struck through~~. A marked run holds the tag that it displays as, one of
  // 'strong', 'em' or 'del'. Every other run holds none.
  // The same condition as a code chip holds here. A run must have text in it and
  // stay on one line, so '**' and a mark left open stay as the characters you
  // typed, and a mark opened on one line cannot take in the lines below it.
  // The order below is the order of the read, and it settles '**bold**' against
  // '*italic*'. The pair goes first, so the single star never sees it. Italic
  // holds no star of its own, so it cannot reach across a bold mark to close.
  // One capture each, so split puts the marked runs on the odd indices.
  var EMPHASIS = [
    { tag: 'strong', re: /\*\*([^\n]+?)\*\*/ },
    { tag: 'em', re: /\*([^*\n]+)\*/ },
    { tag: 'del', re: /~~([^\n]+?)~~/ }
  ];

  function emphasisSpans(s) {
    return markSpans(s, 0);
  }

  // Read the mark at `at` over the text, then give the plain remainder to the
  // next mark. A run that holds a mark is complete, so the marks do not nest.
  // The text of a bold run is the characters that it holds.
  function markSpans(s, at) {
    if (at === EMPHASIS.length) return s === '' ? [] : [{ text: s, code: false }];
    var mark = EMPHASIS[at];
    var out = [];
    s.split(mark.re).forEach(function (part, i) {
      if (part === '') return;
      if (i % 2 === 1) out.push({ text: part, tag: mark.tag });
      else markSpans(part, at + 1).forEach(function (seg) { out.push(seg); });
    });
    return out;
  }

  // Everything that a line of card text displays as, in order. Backticks come
  // first, so an address inside them is code and stays on the card as the address
  // that it is. An address comes before the emphasis marks, so a '*' inside an
  // address stays part of the address.
  function inlineSpans(s) {
    var out = [];
    codeSpans(s).forEach(function (seg) {
      if (seg.code) { out.push(seg); return; }
      linkSpans(seg.text).forEach(function (part) {
        if (part.href) { out.push(part); return; }
        emphasisSpans(part.text).forEach(function (bit) { out.push(bit); });
      });
    });
    return out;
  }

  // A fence: three or more backticks alone on a line. It is the one mark that
  // spans lines, so it holds a width to close against. The text after it on the
  // opening line, 'js' in '```js', names a language. The board does not read the
  // language and deletes the word. A closing fence holds no language, only
  // backticks.
  var FENCE = /^ {0,3}(`{3,})\s*([^`]*)$/;

  // The marks that take a whole line. Each one sits at the head of its line,
  // after three spaces at the most, and what it opens runs to the end of the line.
  var RULE = /^ {0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/;
  var HEADING = /^ {0,3}(#{1,6})\s+(.*)$/;
  var QUOTE = /^ {0,3}>\s?(.*)$/;
  var BULLET = /^ {0,3}[-*+]\s+(.*)$/;
  var NUMBER = /^ {0,3}(\d+)[.)]\s+(.*)$/;
  // A task: a bulleted item that opens with a box. The brackets hold one
  // character, a space for a box that is open and a lower case x for one that is
  // done, and a space follows them. Nothing else is a box, so '- [X] read' and
  // '- [-] read' are the items with the characters that you typed.
  var TASK = /^ {0,3}[-*+]\s+\[([ x])\]\s+(.*)$/;
  // The box in a line that TASK matched. A task opens with its bullet and its
  // box, so the first pair of brackets in the line is always the box.
  var BOX = /\[[ x]\]/;

  // The nouns that open a callout, and the one that each of them draws. A noun
  // on the left is another way to write the one on the right, the way Obsidian
  // has them, with one departure: Obsidian reads 'caution' as a warning and this
  // board reads it as a danger, in red. A word this table does not hold is not a
  // callout, so a quote that opens with one stays the quote that it is.
  var CALLOUTS = {
    note: 'note',
    abstract: 'abstract', summary: 'abstract', tldr: 'abstract',
    info: 'info',
    todo: 'todo',
    tip: 'tip', hint: 'tip', important: 'tip',
    success: 'success', check: 'success', done: 'success',
    question: 'question', help: 'question', faq: 'question',
    warning: 'warning', attention: 'warning',
    failure: 'failure', fail: 'failure', missing: 'failure',
    danger: 'danger', caution: 'danger', error: 'danger',
    bug: 'bug',
    example: 'example',
    quote: 'quote', cite: 'quote'
  };

  // The first line of a quote that opens a callout: a noun in brackets, in any
  // case. The words after it are the title, and a line that holds none takes the
  // noun for its title. Obsidian writes a '+' or a '-' after the brackets for a
  // callout that opens folded. The board does not fold, so it reads that mark
  // and drops it.
  var CALLOUT = /^\[!([a-z]+)\][+-]?\s*(.*)$/i;

  // What the head and the body of a callout hold, for the text of a quote. It is
  // null for a quote that opens with no noun that the board knows, which is
  // every quote written before callouts and every one that names something else.
  function calloutOf(s) {
    var at = s.indexOf('\n');
    var m = CALLOUT.exec(at === -1 ? s : s.slice(0, at));
    var type = m && CALLOUTS[m[1].toLowerCase()];
    if (!type) return null;
    return {
      type: type,
      title: m[2] || m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase(),
      body: at === -1 ? '' : s.slice(at + 1)
    };
  }

  // Group the lines of a card into the blocks that they display as, in order. A
  // line with a line mark is the block that the mark names. Every other line is
  // prose, and a run of prose lines is one paragraph. A blank line closes any
  // open block, and a quote or a list takes as many lines in a row as it gets.
  //   {kind: 'para', text}            {kind: 'quote', text, at}
  //   {kind: 'heading', level, text}  {kind: 'rule'}
  //   {kind: 'code', width, lines}
  //   {kind: 'list', ordered, start, items: [{text, done, line}]}
  // An item of a list holds the line that it came from, and a quote holds the
  // line it opened on. Its `done` is true or false for an item that opens with a
  // box, and null for one that has none.
  // A rule comes before a bullet, so '---' is the divider that it draws and not
  // an item with two dashes for its text. A fence comes before all of them, and
  // an open fence reads nothing until the fence that closes it.
  // `from` is the line of the card that `s` starts on. Only the body of a
  // callout passes it, because the body is part of a card that begins above it.
  function blocks(s, from) {
    var out = [];
    var open = null;    // the block the line above left open, if it left one
    var lines = s.split('\n');
    var off = from || 0;
    function start(b) { out.push(b); open = b; }
    lines.forEach(function (line, i) {
      var m;
      // inside a fence every line is the characters you typed, so the board reads
      // none of the marks below and a blank line closes nothing
      if (open && open.kind === 'code') {
        if (closesFence(line, open.width)) { open = null; return; }
        open.lines.push(line);
        return;
      }
      if ((m = FENCE.exec(line)) && fenceCloses(lines, i, m[1].length)) {
        start({ kind: 'code', width: m[1].length, lines: [] });
        return;
      }
      if (RULE.test(line)) { out.push({ kind: 'rule' }); open = null; return; }
      if ((m = HEADING.exec(line))) {
        out.push({ kind: 'heading', level: m[1].length, text: m[2] });
        open = null;
        return;
      }
      if ((m = QUOTE.exec(line))) {
        if (open && open.kind === 'quote') open.text += '\n' + m[1];
        else start({ kind: 'quote', text: m[1], at: off + i });
        return;
      }
      var bullet = BULLET.exec(line);
      m = bullet || NUMBER.exec(line);
      if (m) {
        // a numbered list below a bulleted one is a list of its own, and a
        // bulleted list below a numbered one is too
        var ordered = !bullet;
        // a bulleted item can open with a box, and a box and a bullet belong to
        // the one list. The item keeps the line that it came from, which is where
        // a press on its box writes.
        var task = bullet && TASK.exec(line);
        var item = { text: task ? task[2] : (ordered ? m[2] : m[1]),
          done: task ? task[1] === 'x' : null, line: off + i };
        if (open && open.kind === 'list' && open.ordered === ordered) {
          open.items.push(item);
        } else {
          start({ kind: 'list', ordered: ordered, start: ordered ? Number(m[1]) : 1,
            items: [item] });
        }
        return;
      }
      if (!line.trim()) { open = null; return; }
      if (open && open.kind === 'para') open.text += '\n' + line;
      else start({ kind: 'para', text: line });
    });
    return out;
  }

  // Whether this line closes a fence that opened `width` backticks wide. A closer
  // needs at least as many backticks as the opener and nothing else on its line,
  // so a wider fence can hold a narrower one among its lines.
  function closesFence(line, width) {
    var m = FENCE.exec(line);
    return !!m && m[1].length >= width && !m[2];
  }

  // Whether the fence that opens on line `at` closes further down the card. The
  // same condition as the other marks holds here, over lines and not characters:
  // a mark that the card never closes is not a mark. So an opening fence with no
  // closer below it is the backticks you typed, and the lines below it stay the
  // prose, headings and lists that they are.
  function fenceCloses(lines, at, width) {
    var i;
    for (i = at + 1; i < lines.length; i++) {
      if (closesFence(lines[i], width)) return true;
    }
    return false;
  }

  function makeCard(card) {
    return makeItem(card, {
      level: 'card',
      redraw: render,
      mark: noteMark(card),
      markCls: card.notes.length ? '' : 'add',
      onMark: function () { openNotes(card.id, !card.notes.length); },
      pinned: card.pinned,
      buttons: [
        { icon: 'pin', title: card.pinned ? 'Unpin' : 'Pin to top',
          onClick: function () { togglePin(card.id); } },
        { icon: 'send', title: 'Export this card',
          onClick: function () { exportCard(card.id); } },
        { icon: 'bin', title: 'Delete', cls: 'del',
          onClick: function () { removeCard(card.id); } }
      ]
    });
  }

  function makeNote(note) {
    return makeItem(note, {
      level: 'note',
      redraw: redrawNotes,
      buttons: [
        { icon: 'bin', title: 'Delete note', cls: 'del',
          onClick: function () { removeNote(note.id); } }
      ]
    });
  }

  // What a board card says about its notes, in the small line after its date.
  // A press on it opens the notes window, and it is the only way there. A card
  // with notes gives their count, and keeps it while the actions stay hidden. A
  // card with none offers the first one.
  function noteMark(card) {
    return card.notes.length ? plural(card.notes.length, 'note') : 'add note';
  }

  // Draw a list of items into a body, or the one line that replaces an empty
  // list. Columns and the notes window both fill this way.
  function fillBody(body, items, emptyText, make) {
    body.innerHTML = '';
    if (!items.length) {
      body.appendChild(el('div', 'empty', emptyText));
      return;
    }
    items.forEach(function (item) { body.appendChild(make(item)); });
  }

  // The element that a block displays as, with the marked runs of its own text.
  // onToggle(line) is what a press on the box of a task does.
  function makeBlock(b, onToggle) {
    if (b.kind === 'rule') return document.createElement('hr');
    if (b.kind === 'code') {
      var pre = document.createElement('pre');
      var block = document.createElement('code');
      // the lines as you typed them. A fenced block reads no mark inside it, so
      // there is nothing here to add
      block.textContent = b.lines.join('\n');
      pre.appendChild(block);
      return pre;
    }
    if (b.kind === 'list') {
      var list = document.createElement(b.ordered ? 'ol' : 'ul');
      // a list that starts at 3 counts from 3
      if (b.ordered && b.start !== 1) list.start = b.start;
      b.items.forEach(function (item) {
        var li = document.createElement('li');
        if (item.done === null) {
          fillInline(li, item.text);
        } else {
          // the box takes the place of the marker, and the words of the item are
          // one box of their own beside it
          li.className = 'task';
          li.appendChild(taskBox(item, onToggle));
          var what = el('span', 'task-what');
          fillInline(what, item.text);
          li.appendChild(what);
        }
        list.appendChild(li);
      });
      return list;
    }
    if (b.kind === 'quote') {
      var call = calloutOf(b.text);
      // the body of a callout starts on the line below the one that names it
      if (call) return makeCallout(call, b.at + 1, onToggle);
    }
    var box = document.createElement(b.kind === 'heading' ? 'h' + b.level
      : b.kind === 'quote' ? 'blockquote' : 'p');
    fillInline(box, b.text);
    return box;
  }

  // A callout: the head that names it, and the rest of the quote below. The body
  // is read as card text, so it holds the lists, boxes and fences that a card
  // holds. `from` is the line of the card that the body starts on, which is
  // where a press on a box inside it writes.
  function makeCallout(call, from, onToggle) {
    var box = el('div', 'callout ' + call.type);
    var head = el('div', 'callout-head');
    head.appendChild(icon(call.type));
    head.appendChild(el('span', '', call.title));
    box.appendChild(head);
    if (call.body.trim()) {
      var body = el('div', 'callout-body');
      blocks(call.body, from).forEach(function (b) {
        body.appendChild(makeBlock(b, onToggle));
      });
      box.appendChild(body);
    }
    return box;
  }

  // The box of one task. It is a button, so it answers the pointer and the
  // keyboard, and the role says that a press ticks it and goes nowhere. The words
  // of the item name the box for a reader who cannot see it. A box that is done
  // holds the tick, and an open one holds nothing.
  function taskBox(task, onToggle) {
    var box = textBtn('tickbox');
    box.setAttribute('role', 'checkbox');
    box.setAttribute('aria-checked', task.done ? 'true' : 'false');
    box.setAttribute('aria-label', task.text);
    if (task.done) box.appendChild(icon('tick'));
    box.addEventListener('click', function () { onToggle(task.line); });
    return box;
  }

  // A line with the quote marks that hold it taken off. A task inside a callout
  // is a line of the card that opens with the '>' of its quote, and the marks in
  // it are read below that.
  function unquoted(line) {
    var m;
    while ((m = QUOTE.exec(line))) line = m[1];
    return line;
  }

  // Turn the box on line `at` of an item over. The line keeps everything else it
  // holds, so the words of the task, the marks in them and the quote that holds
  // them stay as they are. This is the one change to the text of a card that does
  // not go through the box that a double click opens.
  function toggleTask(item, at) {
    var lines = item.text.split('\n');
    var m = TASK.exec(unquoted(lines[at]));
    // the text moved below the card that shows it: another tab, or an import
    if (!m) return;
    lines[at] = lines[at].replace(BOX, m[1] === 'x' ? '[ ]' : '[x]');
    item.text = lines.join('\n');
    commit();
  }

  // Fill el with the text of the card: the blocks that hold its lines, and inside
  // each block the chips, addresses and marked runs that its characters name. The
  // stored text keeps every mark you typed, so an edit of the card shows them
  // again. Text nodes throughout, so card text never passes through innerHTML.
  function renderText(el, s, onToggle) {
    el.textContent = '';
    blocks(s).forEach(function (b) { el.appendChild(makeBlock(b, onToggle)); });
  }

  // The text of one block, each code segment as a <code> chip, each address as
  // a link, and each marked run as the tag that it named.
  function fillInline(el, s) {
    inlineSpans(s).forEach(function (seg) {
      if (seg.href) {
        var a = document.createElement('a');
        a.href = seg.href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        // the card drags, and the address written on it does not
        a.draggable = false;
        a.textContent = seg.text;
        // a labelled link does not show its address, so the title shows it
        if (seg.text !== seg.href) a.title = seg.href;
        el.appendChild(a);
      } else if (seg.code) {
        var code = document.createElement('code');
        code.textContent = seg.text;
        el.appendChild(code);
      } else if (seg.tag) {
        var mark = document.createElement(seg.tag);
        mark.textContent = seg.text;
        el.appendChild(mark);
      } else {
        el.appendChild(document.createTextNode(seg.text));
      }
    });
  }

  // ---------- notes window ----------
  // The notes of a card are cards themselves and sit on the card. So a deleted
  // card removes its notes too, and Undo returns all of them. The window uses the
  // body and foot of the column, and the colour of the column that holds the card.
  var scrim = document.getElementById('scrim');
  var notesPanel = document.getElementById('notes');
  var notesBody = document.getElementById('notesBody');
  var notesClose = document.getElementById('notesClose');
  var openCardId = null;    // the card whose notes are open, if any

  var notesComposer = makeComposer(document.getElementById('notesFoot'), {
    add: '+',
    placeholder: 'What is worth remembering?',
    inner: true,
    onAdd: function (text) {
      var list = notesList();
      if (!list) return;
      list.push(newItem(text));
      commit();
    }
  });

  function notesList() {
    var found = openCardId ? find(openCardId) : null;
    return found ? found.card.notes : null;
  }

  // `compose` opens the box for a new note with the window. The words that a
  // card with no notes shows are an offer to write the first one.
  function openNotes(cardId, compose) {
    closeComposers();
    openCardId = cardId;
    scrim.classList.add('on');
    redrawNotes();
    if (compose) notesComposer.open();
    else notesClose.focus();
  }

  function closeNotes() {
    if (!openCardId) return;
    notesComposer.close();
    // The board is redrawn on every change, so give the focus back by id and not
    // by a reference to the button that opened the window. The focus goes to the
    // button on the card, because the button that was pressed was in a menu that
    // is now closed.
    var back = document.querySelector('.card[data-id="' + openCardId + '"] .menubtn');
    openCardId = null;
    scrim.classList.remove('on');
    if (back) back.focus();
  }

  function redrawNotes() {
    if (!openCardId) return;
    var found = find(openCardId);
    // the card went away below the window: another tab, or an import
    if (!found) { closeNotes(); return; }

    paint(notesPanel, found.col);
    document.getElementById('notesCol').textContent = colOf(found.col).label;
    // the head of the window is the text of the card, so a box there is the same
    // box as the one on the card behind
    renderText(document.getElementById('notesWhat'), found.card.text,
      function (at) { toggleTask(found.card, at); });
    document.getElementById('notesCount').textContent = found.card.notes.length;
    fillBody(notesBody, found.card.notes, 'no notes yet', makeNote);
  }

  notesClose.addEventListener('click', closeNotes);
  // a click on the panel itself is not a click outside it
  scrim.addEventListener('click', function (e) { if (e.target === scrim) closeNotes(); });
  wireDrop(notesBody, notesBody, { level: 'note', onDrop: moveNote });

  // ---------- tips ----------
  // What the board does and what it reads, for someone who has not read the file.
  // It opens from the last word of the count line and closes the way the notes
  // window does. The window belongs to the board and not to a card, so no
  // palette reaches it.
  var tipsScrim = document.getElementById('tipsScrim');
  var tipsBody = document.getElementById('tipsBody');
  var tipsBtn = document.getElementById('tipsBtn');
  var tipsClose = document.getElementById('tipsClose');

  // The two states of the burst switch, in the order it turns through them, with
  // what each one leaves behind once a card is in.
  var TIP_BURST = [
    { on: false, what: 'the box closes once the card is in' },
    { on: true, what: 'the box stays open and empty, ready for the next card' }
  ];

  // The nouns of a callout, gathered by the colour that they draw in. Every
  // colour is in the stylesheet and is read back from there, so this list holds
  // no copy of them and cannot fall out of step with the board.
  var TIP_GROUPS = [
    ['note', 'info', 'todo'],
    ['abstract'],
    ['tip', 'success'],
    ['question', 'warning'],
    ['failure', 'danger', 'bug'],
    ['example'],
    ['quote']
  ];

  // the other ways to write a noun, in the order the CALLOUTS table lists them
  function aliasesOf(type) {
    return Object.keys(CALLOUTS).filter(function (word) {
      return CALLOUTS[word] === type && word !== type;
    });
  }

  function buildTips() {
    tipsBody.appendChild(el('h3', '', 'Callouts'));
    tipsBody.appendChild(el('p', '', 'A quote whose first line is a noun in'
      + ' brackets. The words after the noun are the head, and the lines below'
      + ' it are the text.'));
    var line = el('div', 'tips-syntax');
    line.appendChild(document.createTextNode('> '));
    line.appendChild(el('b', '', '[!warning]'));
    line.appendChild(document.createTextNode(' [alternative title]\n> Check the cable first'));
    tipsBody.appendChild(line);

    TIP_GROUPS.forEach(function (names) {
      var group = tipGroup(names);
      tipsBody.appendChild(group);
      // the colour of the group is in the stylesheet, and it is there to read
      // once the group is on the page
      group.querySelector('.tips-row')
        .appendChild(el('span', 'tips-hex', colourOf(group)));
    });

    tipsBody.appendChild(el('hr', 'tips-rule'));

    tipsBody.appendChild(el('h3', '', 'Burst'));
    tipsBody.appendChild(el('p', '', 'The switch at the end of the row inside the'
      + ' add box decides what a saved card leaves behind:'));
    TIP_BURST.forEach(function (state) {
      var row = el('div', 'tips-burst');
      row.appendChild(el('span', state.on ? 'burst on' : 'burst', 'burst'));
      row.appendChild(el('span', '', state.what));
      tipsBody.appendChild(row);
    });
  }

  function closeTips() {
    if (!tipsScrim.classList.contains('on')) return;
    tipsScrim.classList.remove('on');
    tipsBtn.focus();
  }

  function colourOf(node) {
    return getComputedStyle(node).getPropertyValue('--c').trim();
  }

  function openTips() {
    tipsScrim.classList.add('on');
    tipsClose.focus();
  }

  // One group: a callout with no text of its own, so it takes the bar and the
  // colour that a card gives those nouns. The nouns stand in a row on that bar,
  // and their other names run below them.
  function tipGroup(names) {
    var box = el('div', 'callout ' + names[0]);
    var row = el('div', 'tips-row');
    var aliases = [];
    names.forEach(function (name) {
      var noun = el('span', 'tips-noun');
      noun.appendChild(icon(name));
      noun.appendChild(el('span', '', name));
      row.appendChild(noun);
      var other = aliasesOf(name);
      if (other.length) aliases.push(name + ': ' + other.join(', '));
    });
    box.appendChild(row);
    if (aliases.length) box.appendChild(el('div', 'tips-alias', aliases.join('  ·  ')));
    return box;
  }

  tipsBtn.addEventListener('click', openTips);
  tipsClose.addEventListener('click', closeTips);
  // a click on the window itself is not a click outside it
  tipsScrim.addEventListener('click', function (e) {
    if (e.target === tipsScrim) closeTips();
  });
  buildTips();

  // ---------- render ----------
  function render() {
    // every card is built again below, and an open menu belongs to a button that
    // is about to go away
    closeMenu();
    COLUMNS.forEach(function (c) {
      var list = state.cols[c.key];
      var view = views[c.key];
      fillBody(view.body, list, 'nothing here', makeCard);
      view.count.textContent = list.length;
      if (view.clear) {
        // any state change drops a pending confirmation. It asked about a count
        // that can be wrong now
        view.clear.closeAsk();
        view.clear.classList.toggle('off', !list.length);
      }
    });
    renderSummary();
    // an open notes window is another view of the same state, so it redraws too
    redrawNotes();
  }

  function renderSummary() {
    var out = document.getElementById('summary');
    out.textContent = '';
    COLUMNS.forEach(function (c, i) {
      if (i) out.appendChild(el('span', 'dot', '·'));
      out.appendChild(el('b', null, String(state.cols[c.key].length)));
      // a hard space, so a count never wraps away from the word it counts
      out.appendChild(document.createTextNode(' ' + c.key));
    });
  }

  // ---------- export / import ----------
  // Export and Import use two shapes. A whole board is { cols: ... } and replaces
  // the board that is here. One card is { card: ..., col: ... } and joins the
  // board, which is how you pass a card to someone else. Import reads the fields
  // in the file to find which of the two shapes it is.
  function download(name, data) {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name + '-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // The notes of a card sit on the card, so a card is whole on its own and goes
  // out as it is. The column travels with the card, so it can land in the same
  // column on the other board.
  function exportCard(id) {
    var found = find(id);
    if (!found) return;
    download('personal-board-card', { card: found.card, col: found.col });
  }

  document.getElementById('exportBtn').addEventListener('click', function () {
    download('personal-board', state);
  });

  function importBoard(parsed) {
    var total = 0;
    // an older export can hold a Cut column. load() moves it into Backlog
    KEYS.concat(GONE_KEY).forEach(function (k) {
      if (Array.isArray(parsed.cols[k])) total += parsed.cols[k].length;
    });
    if (!confirm('Replace the current board with ' + total + ' card(s) from this file?')) return;
    lsSet(STORE, JSON.stringify(parsed));
    state = load();
    commit();
  }

  // A card arrives with the ids it had on the board it came from, and you can
  // import the same file twice. find() answers by id, so the card and every note
  // below it gets a new id on arrival.
  function reid(item) {
    return {
      id: uid(),
      text: item.text,
      created: item.created,
      pinned: item.pinned,
      notes: item.notes.map(reid)
    };
  }

  // One shared card joins the board. Nothing that is here already changes.
  function importCard(parsed) {
    var arriving = normalize([parsed.card]);
    if (!arriving.length) throw new Error('bad shape');
    var card = reid(arriving[0]);
    // the card came from a column, but a card made elsewhere can name a column
    // this board does not have, or no column. Any such card belongs in Backlog.
    var col = colOf(parsed.col) || colOf('backlog');
    var brought = card.notes.length ? ' and ' + plural(card.notes.length, 'note') : '';
    var says = card.text.length > 60 ? card.text.slice(0, 60) + '...' : card.text;
    if (!confirm('Add this card' + brought + ' to ' + col.label + '?\n\n' + says)) return;
    // The newest card sits at the bottom of a column, the same as one written
    // here. A card that arrives pinned goes to the foot of the pinned group,
    // because commit() puts every column in that order.
    state.cols[col.key].push(card);
    commit();
  }

  var fileInput = document.getElementById('fileInput');
  document.getElementById('importBtn').addEventListener('click', function () {
    fileInput.click();
  });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed) throw new Error('bad shape');
        if (parsed.card) importCard(parsed);
        else if (parsed.cols) importBoard(parsed);
        else throw new Error('bad shape');
      } catch (e) {
        alert("That file doesn't look like a personal board export.");

      fileInput.value = '';
    };
    reader.readAsText(f);
  });

  var PALETTES = [];
  FAMILIES.forEach(function (f) {
    f.palettes.forEach(function (p) { p.family = f; PALETTES.push(p); });
  });

  // the palette a board opens with, and the one it falls back to when the palette
  // it has kept is no longer here
  var DEFAULT_PAL = 'w262';

  function rgbOf(hex) {
    var h = hex.replace('#', '');
    return [0, 1, 2].map(function (i) { return parseInt(h.substr(i * 2, 2), 16); });
  }

  // a colour SHADE of the way to black. This is the colour a column marks a drop
  // with: its own colour, dark enough to read against its fill
  function shadeOf(hex) {
    return '#' + rgbOf(hex).map(function (v) {
      var m = Math.round(v * (1 - SHADE));
      return ('0' + m.toString(16)).slice(-2);
    }).join('').toUpperCase();
  }

  // a colour over the page at TINT strength. This is the fill of a column
  function tintOf(hex) {
    var under = rgbOf(IVORY);
    return '#' + rgbOf(hex).map(function (v, i) {
      var m = Math.round(v * TINT + under[i] * (1 - TINT));
      return ('0' + m.toString(16)).slice(-2);
    }).join('').toUpperCase();
  }

  // The icon is the board itself: one bar for each palette column, in the colours
  // of the palette. The tints are too pale at 16px, so the bars are solid.
  // Remember takes no palette colour, so it gets no bar.
  function setFavicon(colors) {
    var link = document.getElementById('favicon');
    if (!link) return;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
      '<rect width="32" height="32" rx="7" fill="' + IVORY + '"/>';
    colors.forEach(function (c, i) {
      svg += '<rect x="' + (4 + i * 9) + '" y="5" width="6" height="22" rx="2" fill="' + c + '"/>';
    });
    link.href = 'data:image/svg+xml,' + encodeURIComponent(svg + '</svg>');
  }

  // The colour of each column at this time: its own colour, or the one from the
  // palette. It goes onto the elements that show it.
  var tone = {};
  COLUMNS.forEach(function (c) {
    tone[c.key] = { fill: c.fill, rule: c.rule, drop: c.drop };
  });

  function paint(target, key) {
    target.style.setProperty('--fill', tone[key].fill);
    target.style.setProperty('--rule', tone[key].rule);
    target.style.setProperty('--drop', tone[key].drop);
    // cleared and not left in place, because the notes window is painted again
    // for the column that holds its card
    ['card', 'text', 'head'].forEach(function (name) {
      var own = colOf(key)[name];
      if (own) target.style.setProperty('--' + name, own);
      else target.style.removeProperty('--' + name);
    });
  }

  // The first two items change places when n is odd, so Backlog and Now swap
  // their colours. The third stays where it is, because Accomplished keeps the
  // green. The colours and the names turn together
  function turned(list, n) {
    return n % 2 ? [list[1], list[0]].concat(list.slice(2)) : list.slice();
  }

  // The colours of a palette as the board has them now. Only the palette on the
  // board is turned. The rest of the panel shows the order in the book
  function colorsOf(p) {
    return p.id === currentPal ? turned(p.colors, palTurn) : p.colors;
  }
  function namesOf(p) {
    return turned(p.names.split(' · '), p.id === currentPal ? palTurn : 0).join(' · ');
  }

  function applyPalette(id, turn) {
    var p = pick(PALETTES, function (x) { return x.id === id; }) ||
      pick(PALETTES, function (x) { return x.id === DEFAULT_PAL; });
    currentPal = p.id;
    palTurn = ((turn || 0) % 2 + 2) % 2;
    var colors = colorsOf(p);
    PAL_COLUMNS.forEach(function (c, i) {
      tone[c.key] = {
        fill: tintOf(colors[i]), rule: colors[i], drop: shadeOf(colors[i])
      };
    });
    KEYS.forEach(function (k) { paint(views[k].el, k); });
    // the notes window uses one of these colours too, if it is open
    redrawNotes();
    setFavicon(colors);
    lsSet(PAL_KEY, p.id);
    lsSet(TURN_KEY, String(palTurn));
  }

  var palPanel = document.getElementById('palettePanel');
  var palBtn = document.getElementById('paletteBtn');
  var palView = null;      // null = the family list, otherwise a family id
  var currentPal = DEFAULT_PAL;
  var palTurn = 0;         // 1 when Backlog and Now hold each other's colour

  // One button shape serves the two views of the panel: a name with a number to
  // its right, a strip of colour below it, and a line of small print below that.
  function palButton(spec) {
    var b = textBtn('pal');
    var top = el('span', 'pal-top');
    top.appendChild(el('span', 'pal-name', spec.name));
    top.appendChild(el('span', 'pal-num', spec.num));
    b.appendChild(top);
    b.appendChild(spec.strip);
    b.appendChild(el('span', 'pal-cols', spec.note));
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      spec.onClick();
    });
    return b;
  }

  // one bar for each column that the palette colours, in the tint of that column
  function palBars(colors) {
    var bars = el('span', 'pal-bars');
    colors.forEach(function (c) {
      var bar = el('span', 'pal-bar');
      bar.style.setProperty('--r', c);
      bar.style.setProperty('--t', tintOf(c));
      bars.appendChild(bar);
    });
    return bars;
  }

  // one dot for each palette in the family, in the main colour of that palette,
  // which is the colour that names the family. So the strip shows the number of
  // palettes and their character.
  function famDots(f) {
    var dots = el('span', 'fam-strip');
    f.palettes.forEach(function (p) {
      var dot = el('span', 'fam-dot');
      dot.style.setProperty('--c', p.lead);
      dots.appendChild(dot);
    });
    return dots;
  }

  function renderPanel() {
    palPanel.innerHTML = '';
    if (palView) renderFamily(pick(FAMILIES, function (f) { return f.id === palView; }));
    else renderFamilies();
  }

  function renderFamilies() {
    palPanel.appendChild(el('div', 'cap', 'Sanzo Wada · 24 combinations, each with a green'));
    FAMILIES.forEach(function (f) {
      var b = palButton({
        name: f.name,
        num: String(f.palettes.length),
        strip: famDots(f),
        note: f.note,
        onClick: function () { palView = f.id; renderPanel(); }
      });
      b.dataset.fam = f.id;
      if (pick(f.palettes, function (p) { return p.id === currentPal; })) b.classList.add('on');
      palPanel.appendChild(b);
    });
  }

  function renderFamily(f) {
    var back = textBtn('pal-back');
    back.appendChild(el('span', 'arrow', '‹'));
    back.appendChild(document.createTextNode(' all families · ' + f.name));
    back.addEventListener('click', function (e) {
      e.stopPropagation();
      palView = null;
      renderPanel();
    });
    palPanel.appendChild(back);
    palPanel.appendChild(el('div', 'cap', 'Click the one on the board again to swap Backlog and Now'));

    f.palettes.forEach(function (p) {
      var b = palButton({
        name: p.name,
        num: p.num ? 'no. ' + p.num : 'default',
        strip: palBars(colorsOf(p)),
        note: namesOf(p),
        onClick: function () {
          // A click on the palette that is already on the board swaps the colours
          // of Backlog and Now. Accomplished keeps its green. A second click
          // gives the order in the book again
          applyPalette(p.id, p.id === currentPal ? palTurn + 1 : 0);
          markPalettes();
        }
      });
      b.dataset.pal = p.id;
      if (p.id === currentPal) b.classList.add('on');
      palPanel.appendChild(b);
    });
  }

  // Stay open, so you can try several palettes in a row, and swap the one that
  // is on. The panel closes only on a click outside it or on Escape. The marker
  // and the bars move in place, because a new render would lose the scroll
  // position.
  function markPalettes() {
    palPanel.querySelectorAll('.pal').forEach(function (b) {
      var p = pick(PALETTES, function (x) { return x.id === b.dataset.pal; });
      if (!p) return;
      b.classList.toggle('on', p.id === currentPal);
      b.replaceChild(palBars(colorsOf(p)), b.querySelector('.pal-bars'));
      b.querySelector('.pal-cols').textContent = namesOf(p);
    });
  }

  function openPalette() {
    palView = null;
    renderPanel();
    palPanel.classList.add('on');
    palBtn.setAttribute('aria-expanded', 'true');
  }
  function closePalette() {
    palPanel.classList.remove('on');
    palBtn.setAttribute('aria-expanded', 'false');
  }
  palBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (palPanel.classList.contains('on')) closePalette(); else openPalette();
  });
  document.addEventListener('click', function (e) {
    if (!palPanel.contains(e.target) && e.target !== palBtn) closePalette();
    // a press on the button of a card never reaches here, and a press on a word
    // in the menu closes the menu itself before it runs the action
    if (!menu.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    // a menu over a card takes the key before the window below it does
    var owner = menuOwner;
    if (closeMenu()) { owner.focus(); return; }
    closePalette();
    closeClearAsks();
    closeNotes();
    closeTips();
  });

  // applyPalette writes the choice back to the current key
  applyPalette(readCarried(PAL_KEY, OLD_PAL_KEYS) || DEFAULT_PAL,
    Number(lsGet(TURN_KEY)) || 0);

  // keep two tabs of the same board in sync
  window.addEventListener('storage', function (e) {
    if (e.key !== STORE) return;
    state = load();
    render();
  });

  render();
</script>
</body>
</html>
